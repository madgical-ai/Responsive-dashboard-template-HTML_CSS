name: CI/CD Pipeline
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}
  AWS_REGION: us-east-1
  HOST_PORT: '80'
  CONTAINER_PORT: '80'
  HEALTHCHECK_PATH: /
jobs:
  validate:
    name: Validate (lint & type-check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      if: ${{ env.ACT != 'true' }}
      run: |
        if [ -f package.json ]; then
          npm ci || npm install
        fi
    - name: Execute lint
      if: ${{ env.ACT != 'true' }}
      run: |
        if [ -f Dockerfile ]; then
          docker run --rm -i hadolint/hadolint hadolint --failure-threshold error - < Dockerfile
        else
          echo "No Dockerfile found, skipping hadolint lint"
        fi
    - name: Execute type_check
      if: ${{ env.ACT != 'true' }}
      run: |
        if [ -f tsconfig.json ]; then
          npx tsc --noEmit
        else
          echo "No TypeScript configuration found, skipping type-check"
        fi
  test:
    name: Test (unit, integration, coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Cache npm dependencies
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-
    - name: Install dependencies
      run: |
        if [ -f package.json ]; then
          npm ci || npm install
        fi
    - name: Execute unit_test
      if: ${{ env.ACT != 'true' }}
      run: |
        if [ -f package.json ]; then
          npm run -s test --if-present
        else
          echo "No package.json, skipping unit tests"
        fi
    - name: Execute integration_test
      if: ${{ env.ACT != 'true' }}
      run: |
        if [ -f package.json ]; then
          npm run -s integration --if-present
        else
          echo "No package.json, skipping integration tests"
        fi
    - name: Execute coverage
      if: ${{ env.ACT != 'true' }}
      run: |
        if [ -f package.json ]; then
          npm run -s coverage --if-present
        else
          echo "No package.json, skipping coverage"
        fi
    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/
      continue-on-error: true
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: test-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  security:
    name: Security scan (SAST, deps, secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Execute dependency_scan
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: fs
        scan-ref: .
        severity: HIGH,CRITICAL
        exit-code: '0'
      continue-on-error: true
    - name: Execute secret_scan
      uses: trufflesecurity/trufflehog@v3.88.2
      with:
        path: .
        base: ${{ github.event.pull_request.base.sha || github.event.before }}
        head: ${{ github.event.pull_request.head.sha || github.sha }}
        extra_args: --only-verified --fail
      continue-on-error: true
    - name: Execute code_scan
      uses: semgrep/semgrep-action@v1
      with:
        config: auto
      continue-on-error: true
  build:
    name: Build, push & scan image
    needs:
    - validate
    - test
    - security
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4
    - name: Compute image name
      id: image
      run: |
        echo "repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
    - name: Cache npm dependencies
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ steps.image.outputs.repo }}:${{ env.IMAGE_TAG }}
          ${{ env.REGISTRY }}/${{ steps.image.outputs.repo }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Execute image_scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.REGISTRY }}/${{ steps.image.outputs.repo }}:${{ env.IMAGE_TAG }}
        format: table
        exit-code: '0'
        severity: CRITICAL,HIGH
      continue-on-error: true
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  deploy-staging:
    name: Deploy to staging
    needs:
    - build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Detect app port from Dockerfile
      shell: bash
      run: |
        PORT=$(grep -i '^EXPOSE' Dockerfile 2>/dev/null | awk '{print $2}' | head -n1)
        if [ -z "$PORT" ]; then
          echo "No EXPOSE found, defaulting to 8080"
          PORT="8080"
        fi
        echo "HOST_PORT=$PORT" >> $GITHUB_ENV
        echo "CONTAINER_PORT=$PORT" >> $GITHUB_ENV
    - name: Deploy to staging via SSM
      shell: bash
      run: |
        set -euo pipefail
        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        IMAGE="${{ env.REGISTRY }}/${IMAGE_REPO}:${{ env.IMAGE_TAG }}"
        HOST_PORT="${{ env.HOST_PORT }}"
        CONTAINER_PORT="${{ env.CONTAINER_PORT }}"
        APP_NAME="${{ secrets.DEPLOYMENT_NAME }}"
        COMMANDS_JSON=$(jq -n \
          --arg img "$IMAGE" \
          --arg user "${{ secrets.GHCR_USER || github.actor }}" \
          --arg token "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" \
          --arg host_port "$HOST_PORT" \
          --arg container_port "$CONTAINER_PORT" \
          --arg app_name "$APP_NAME" \
          '{commands: [
            "if ! command -v docker >/dev/null 2>&1; then (command -v dnf >/dev/null 2>&1 && dnf install -y docker) || (command -v yum >/dev/null 2>&1 && yum install -y docker) || (command -v apt-get >/dev/null 2>&1 && apt-get update && apt-get install -y docker.io); fi",
            "systemctl enable --now docker || service docker start || true",
            "for i in $(seq 1 15); do docker info >/dev/null 2>&1 && break || sleep 1; done",
            "echo " + ($token | @sh) + " | docker login ghcr.io -u " + ($user | @sh) + " --password-stdin",
            "docker pull " + ($img | @sh),
            "docker rm -f " + (($app_name + "-new") | @sh) + " 2>/dev/null || true",
            "docker run -d --name " + (($app_name + "-new") | @sh) + " --restart unless-stopped -p " + ($host_port | @sh) + ":" + ($container_port | @sh) + " " + ($img | @sh),
            "for i in $(seq 1 15); do docker exec " + (($app_name + "-new") | @sh) + " sh -c \"curl -sf http://localhost:" + ($container_port | @sh) + "/ || wget -q -O- http://localhost:" + ($container_port | @sh) + "/\" >/dev/null 2>&1 && break || sleep 1; done",
            "docker stop " + ($app_name | @sh) + " 2>/dev/null || true && docker rm " + ($app_name | @sh) + " 2>/dev/null || true",
            "docker rename " + (($app_name + "-new") | @sh) + " " + ($app_name | @sh),
            "docker image prune -f || true"
          ]}')
        aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Deploy app container" \
          --parameters "$COMMANDS_JSON" \
          --output json > ssm-output.json
        COMMAND_ID=$(jq -r '.Command.CommandId' ssm-output.json)
        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'Status' --output text)
          if [ "$STATUS" = "Success" ]; then
            echo "Deployment succeeded"
            exit 0
          elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
            echo "Deployment failed with status: $STATUS"
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'StandardErrorContent' --output text
            exit 1
          fi
          sleep 10
        done
        echo "Deployment timed out"
        exit 1
    - name: Staging health check & smoke test
      shell: bash
      run: |
        set -euo pipefail
        IP=$(aws ec2 describe-instances --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)
        if [ -z "$IP" ] || [ "$IP" = "None" ]; then
          echo "No public IP found"
          exit 1
        fi
        curl -sf "http://$IP:${{ env.HOST_PORT }}${{ env.HEALTHCHECK_PATH }}" >/dev/null || exit 1
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: deploy-staging-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  deploy-production:
    name: Deploy to production
    needs:
    - deploy-staging
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Detect app port from Dockerfile
      shell: bash
      run: |
        PORT=$(grep -i '^EXPOSE' Dockerfile 2>/dev/null | awk '{print $2}' | head -n1)
        if [ -z "$PORT" ]; then
          echo "No EXPOSE found, defaulting to 8080"
          PORT="8080"
        fi
        echo "HOST_PORT=$PORT" >> $GITHUB_ENV
        echo "CONTAINER_PORT=$PORT" >> $GITHUB_ENV
    - name: Deploy to production via SSM
      shell: bash
      run: |
        set -euo pipefail
        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        IMAGE="${{ env.REGISTRY }}/${IMAGE_REPO}:${{ env.IMAGE_TAG }}"
        HOST_PORT="${{ env.HOST_PORT }}"
        CONTAINER_PORT="${{ env.CONTAINER_PORT }}"
        APP_NAME="${{ secrets.DEPLOYMENT_NAME }}"
        COMMANDS_JSON=$(jq -n \
          --arg img "$IMAGE" \
          --arg user "${{ secrets.GHCR_USER || github.actor }}" \
          --arg token "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" \
          --arg host_port "$HOST_PORT" \
          --arg container_port "$CONTAINER_PORT" \
          --arg app_name "$APP_NAME" \
          '{commands: [
            "if ! command -v docker >/dev/null 2>&1; then (command -v dnf >/dev/null 2>&1 && dnf install -y docker) || (command -v yum >/dev/null 2>&1 && yum install -y docker) || (command -v apt-get >/dev/null 2>&1 && apt-get update && apt-get install -y docker.io); fi",
            "systemctl enable --now docker || service docker start || true",
            "for i in $(seq 1 15); do docker info >/dev/null 2>&1 && break || sleep 1; done",
            "echo " + ($token | @sh) + " | docker login ghcr.io -u " + ($user | @sh) + " --password-stdin",
            "docker pull " + ($img | @sh),
            "docker rm -f " + (($app_name + "-new") | @sh) + " 2>/dev/null || true",
            "docker run -d --name " + (($app_name + "-new") | @sh) + " --restart unless-stopped -p " + ($host_port | @sh) + ":" + ($container_port | @sh) + " " + ($img | @sh),
            "for i in $(seq 1 15); do docker exec " + (($app_name + "-new") | @sh) + " sh -c \"curl -sf http://localhost:" + ($container_port | @sh) + "/ || wget -q -O- http://localhost:" + ($container_port | @sh) + "/\" >/dev/null 2>&1 && break || sleep 1; done",
            "docker stop " + ($app_name | @sh) + " 2>/dev/null || true && docker rm " + ($app_name | @sh) + " 2>/dev/null || true",
            "docker rename " + (($app_name + "-new") | @sh) + " " + ($app_name | @sh),
            "docker image prune -f || true"
          ]}')
        aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Deploy app container" \
          --parameters "$COMMANDS_JSON" \
          --output json > ssm-output.json
        COMMAND_ID=$(jq -r '.Command.CommandId' ssm-output.json)
        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'Status' --output text)
          if [ "$STATUS" = "Success" ]; then
            echo "Deployment succeeded"
            exit 0
          elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
            echo "Deployment failed with status: $STATUS"
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'StandardErrorContent' --output text
            exit 1
          fi
          sleep 10
        done
        echo "Deployment timed out"
        exit 1
    - name: Production health check & smoke test
      shell: bash
      run: |
        set -euo pipefail
        IP=$(aws ec2 describe-instances --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)
        if [ -z "$IP" ] || [ "$IP" = "None" ]; then
          echo "No public IP found"
          exit 1
        fi
        curl -sf "http://$IP:${{ env.HOST_PORT }}${{ env.HEALTHCHECK_PATH }}" >/dev/null || exit 1
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: deploy-production-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  rollback:
    name: Rollback on production deploy failure
    needs:
    - deploy-production
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Detect app port from Dockerfile
      shell: bash
      run: |
        PORT=$(grep -i '^EXPOSE' Dockerfile 2>/dev/null | awk '{print $2}' | head -n1)
        if [ -z "$PORT" ]; then
          echo "No EXPOSE found, defaulting to 8080"
          PORT="8080"
        fi
        echo "HOST_PORT=$PORT" >> $GITHUB_ENV
        echo "CONTAINER_PORT=$PORT" >> $GITHUB_ENV
    - name: Rollback via SSM
      shell: bash
      run: |
        set -euo pipefail
        PREV_SHA=$(git rev-parse HEAD~1)
        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        IMAGE="${{ env.REGISTRY }}/${IMAGE_REPO}:${PREV_SHA}"
        HOST_PORT="${{ env.HOST_PORT }}"
        CONTAINER_PORT="${{ env.CONTAINER_PORT }}"
        APP_NAME="${{ secrets.DEPLOYMENT_NAME }}"
        COMMANDS_JSON=$(jq -n \
          --arg img "$IMAGE" \
          --arg user "${{ secrets.GHCR_USER || github.actor }}" \
          --arg token "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" \
          --arg host_port "$HOST_PORT" \
          --arg container_port "$CONTAINER_PORT" \
          --arg app_name "$APP_NAME" \
          '{commands: [
            "if ! command -v docker >/dev/null 2>&1; then (command -v dnf >/dev/null 2>&1 && dnf install -y docker) || (command -v yum >/dev/null 2>&1 && yum install -y docker) || (command -v apt-get >/dev/null 2>&1 && apt-get update && apt-get install -y docker.io); fi",
            "systemctl enable --now docker || service docker start || true",
            "for i in $(seq 1 15); do docker info >/dev/null 2>&1 && break || sleep 1; done",
            "echo " + ($token | @sh) + " | docker login ghcr.io -u " + ($user | @sh) + " --password-stdin",
            "docker pull " + ($img | @sh),
            "docker stop " + ($app_name | @sh) + " 2>/dev/null || true && docker rm " + ($app_name | @sh) + " 2>/dev/null || true",
            "docker run -d --name " + ($app_name | @sh) + " --restart unless-stopped -p " + ($host_port | @sh) + ":" + ($container_port | @sh) + " " + ($img | @sh),
            "docker image prune -f || true"
          ]}')
        aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Rollback app container" \
          --parameters "$COMMANDS_JSON" \
          --output json > ssm-output.json
        COMMAND_ID=$(jq -r '.Command.CommandId' ssm-output.json)
        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'Status' --output text)
          if [ "$STATUS" = "Success" ]; then
            echo "Rollback succeeded"
            exit 0
          elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
            echo "Rollback failed with status: $STATUS"
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'StandardErrorContent' --output text
            exit 1
          fi
          sleep 10
        done
        echo "Rollback timed out"
        exit 1
  post-deploy:
    name: Post-deploy notification
    needs:
    - deploy-production
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Post-deploy status check
      shell: bash
      run: |-
        set -euo pipefail
        aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Post-deploy status check" \
          --parameters '{"commands":[    "if ! command -v docker >/dev/null 2>&1; then if command -v dnf >/dev/null 2>&1; then dnf install -y docker; elif command -v yum >/dev/null 2>&1; then yum install -y docker; elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y docker.io; fi; systemctl enable --now docker; fi",
        "docker ps --filter name=${{ secrets.DEPLOYMENT_NAME }}"]}' \
          --output json > ssm-output.json
        COMMAND_ID=$(jq -r '.Command.CommandId' ssm-output.json)
        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'Status' --output text)
          if [ "$STATUS" = "Success" ]; then
            echo "Post-deploy status check succeeded"
            exit 0
          elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
            echo "Post-deploy status check failed"
            exit 1
          fi
          sleep 10
        done
        echo "Post-deploy status check timed out"
        exit 1
      if: ${{ env.ACT != 'true' }}
