name: CI
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch: null
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}
  HOST_PORT: '80'
  CONTAINER_PORT: '8080'
  HEALTHCHECK_PATH: /
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
  PYTHON_VERSION: '3.12'
jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

   # - name: Lint Dockerfile with Hadolint
   #   uses: hadolint/hadolint-action@v3.1.0
   #   with:
  #      dockerfile: Dockerfile
  #      failure-threshold: error
   # - name: Lint GitHub Actions workflows
  #    uses: raven-actions/actionlint@v2
  #  - name: Verify Dockerfile presence
  #    if: ${{ env.ACT != 'true' }}
  #    shell: bash
  #    run: |
   #     set -euo pipefail
   #     test -f Dockerfile
   #     echo "Dockerfile present"
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.job }}-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - validate
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
   # - name: Build and smoke test container
   #   if: ${{ env.ACT != 'true' }}
   #   shell: bash
   #   run: |
    #    set -euo pipefail
    #    docker build -t ci-test-image:local .
    #    docker run -d --name ci-test-container -p 8080:8080 ci-test-image:local
   #     ok=0
   #     for i in $(seq 1 15); do
   #       if curl -fsS http://localhost:8080/ >/dev/null 2>&1; then
   #         ok=1
    #        break
    #      fi
    #      sleep 2
    #    done
    #    docker logs ci-test-container > test-output.log 2>&1 || true
   #     docker rm -f ci-test-container || true
    #    if [ "$ok" -ne 1 ]; then
   #       echo "Container failed health check"
   #       cat test-output.log || true
   #       exit 1
    #    fi
    #    echo "Container responded on port 8080"
    - name: Upload test logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-logs
        path: test-output.log
        if-no-files-found: ignore
        retention-days: 1
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.job }}-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - validate
    permissions:
      contents: read
      pull-requests: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
  #  - name: Scan filesystem dependencies with Trivy
   #   uses: aquasecurity/trivy-action@v0.36.0
   #   with:
  #      scan-type: fs
  #      severity: CRITICAL,HIGH
  #      format: table
  #      exit-code: '1'
  #  - name: Run Gitleaks secret scan
  #    uses: gitleaks/gitleaks-action@v2
  #    env:
  #      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  #  - name: Install Semgrep
  #    shell: bash
  #    run: |
   #     set -euo pipefail
  #      python3 -m pip install --break-system-packages semgrep
   # - name: Run Semgrep static analysis
   #   if: ${{ env.ACT != 'true' }}
   #   shell: bash
    #  run: |
   #     set -euo pipefail
    #    semgrep --config=auto --error --quiet
  build:
    name: Build & Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - validate
    - test
    - security
  #  if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Compute lowercase image reference
      id: image
      shell: bash
      run: |
        set -euo pipefail
        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        echo "IMAGE_REPO=${IMAGE_REPO}" >> "$GITHUB_OUTPUT"
        echo "IMAGE=${{ env.REGISTRY }}/${IMAGE_REPO}:${{ env.IMAGE_TAG }}" >> "$GITHUB_OUTPUT"
    - name: Build Docker image
      shell: bash
      run: |
        set -euo pipefail
        docker build \
          -t "${{ steps.image.outputs.IMAGE }}" \
          -t "${{ env.REGISTRY }}/${{ steps.image.outputs.IMAGE_REPO }}:latest" \
          .
  #  - name: Scan built image with Trivy
  #    uses: aquasecurity/trivy-action@v0.36.0
   #   with:
   #     scan-type: image
   #     image-ref: ${{ steps.image.outputs.IMAGE }}
   #     severity: CRITICAL,HIGH
    #    format: table
    #    exit-code: '1'
    - name: Save image artifact
      shell: bash
      run: |
        set -euo pipefail
        docker save "${{ steps.image.outputs.IMAGE }}" | gzip > image.tar.gz
    - name: Upload image artifact
      uses: actions/upload-artifact@v4
      with:
        name: docker-image
        path: image.tar.gz
        retention-days: 1
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.job }}-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  publish:
    name: Publish Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - build
   # if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Download image artifact
      uses: actions/download-artifact@v4
      with:
        name: docker-image
    - name: Load image
      shell: bash
      run: |
        set -euo pipefail
        gunzip -c image.tar.gz | docker load
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Push Docker image
      shell: bash
      run: |
        set -euo pipefail
        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        IMAGE="${{ env.REGISTRY }}/${IMAGE_REPO}:${{ env.IMAGE_TAG }}"
        LATEST="${{ env.REGISTRY }}/${IMAGE_REPO}:latest"
        docker tag "$IMAGE" "$LATEST"
        docker push "$IMAGE"
        docker push "$LATEST"
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.job }}-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - publish
   # if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Deploy container via SSM
      if: ${{ env.ACT != 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        IMAGE="${{ env.REGISTRY }}/${IMAGE_REPO}:${{ env.IMAGE_TAG }}"
        PREVIOUS_IMAGE="${{ env.REGISTRY }}/${IMAGE_REPO}:previous"
        COMMANDS_JSON=$(jq -n \
          --arg img "$IMAGE" \
          --arg prev "$PREVIOUS_IMAGE" \
          --arg user "${{ secrets.GHCR_USER || github.actor }}" \
          --arg token "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" \
          --arg host_port "${{ env.HOST_PORT }}" \
          --arg container_port "${{ env.CONTAINER_PORT }}" \
          --arg app_name "${{ secrets.DEPLOYMENT_NAME || 'app' }}" \
          '{
            commands: [
              "if ! command -v docker >/dev/null 2>&1; then if command -v dnf >/dev/null 2>&1; then dnf install -y docker; elif command -v yum >/dev/null 2>&1; then yum install -y docker; elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y docker.io; else echo \"No supported package manager found\"; exit 1; fi; fi; systemctl enable --now docker || service docker start",
              "set -e",
              "for i in $(seq 1 15); do docker info >/dev/null 2>&1 && break || sleep 1; done",
              "docker info >/dev/null 2>&1",
              ("echo " + ($token | @sh) + " | docker login ghcr.io -u " + ($user | @sh) + " --password-stdin"),
              ("if docker inspect " + ($app_name | @sh) + " >/dev/null 2>&1; then docker tag \"$(docker inspect --format='{{.Config.Image}}' " + ($app_name | @sh) + ")\" " + ($prev | @sh) + " && docker push " + ($prev | @sh) + " || true; fi"),
              ("docker pull " + ($img | @sh)),
              ("docker rm -f " + ($app_name | @sh) + "-new 2>/dev/null || true"),
              ("docker run -d --name " + ($app_name | @sh) + "-new " + ($img | @sh)),
              ("ok=0; for i in $(seq 1 15); do if docker exec " + ($app_name | @sh) + "-new sh -c " + ("curl -fsS http://localhost:" + $container_port + "/ >/dev/null 2>&1 || wget -qO- http://localhost:" + $container_port + "/ >/dev/null 2>&1" | @sh) + "; then ok=1; break; fi; sleep 2; done; if [ \"$ok\" -ne 1 ]; then echo 'canary failed health check'; docker logs " + ($app_name | @sh) + "-new 2>&1 | tail -50 || true; docker rm -f " + ($app_name | @sh) + "-new 2>/dev/null || true; exit 1; fi"),
              ("docker stop " + ($app_name | @sh) + " 2>/dev/null || true"),
              ("docker rm " + ($app_name | @sh) + " 2>/dev/null || true"),
              ("docker rm -f " + ($app_name | @sh) + "-new 2>/dev/null || true"),
              ("docker run -d --name " + ($app_name | @sh) + " -p " + $host_port + ":" + $container_port + " --restart unless-stopped " + ($img | @sh)),
              ("ok=0; for i in $(seq 1 15); do if docker exec " + ($app_name | @sh) + "-new sh -c " + ("curl -fsS http://localhost:" + $container_port + "/ >/dev/null 2>&1 || wget -qO- http://localhost:" + $container_port + "/ >/dev/null 2>&1" | @sh) + "; then ok=1; break; fi; sleep 2; done; if [ \"$ok\" -ne 1 ]; then echo canary_failed_health_check; docker logs " + ($app_name | @sh) + "-new 2>&1 | tail -50 || true; docker rm -f " + ($app_name | @sh) + "-new 2>/dev/null || true; exit 1; fi"),
              "docker image prune -f || true"
            ]
          }')
        aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Deploy app container" \
          --parameters "$COMMANDS_JSON" \
          --output json > ssm-output.json
        COMMAND_ID=$(jq -r '.Command.CommandId' ssm-output.json)
        echo "SSM Command ID: ${COMMAND_ID}"
        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" \
            --query 'Status' --output text 2>/dev/null || echo "Pending")
          echo "Attempt ${i}: status=${STATUS}"
          if [ "$STATUS" = "Success" ]; then
            echo "Deployment succeeded"
            exit 0
          fi
          if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
            echo "Deployment failed with status ${STATUS}"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --region "${{ env.AWS_REGION }}" \
              --query 'StandardErrorContent' --output text || true
            exit 1
          fi
          sleep 10
        done
        echo "Timed out waiting for SSM command ${COMMAND_ID}"
        exit 1
    - name: Check staging health endpoint
      if: ${{ env.ACT != 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        PUBLIC_DNS=$(aws ec2 describe-instances \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --query 'Reservations[0].Instances[0].PublicDnsName' \
          --output text)
        curl -fsS --retry 10 --retry-delay 5 --retry-connrefused "http://${PUBLIC_DNS}${{ env.HEALTHCHECK_PATH }}"
    - name: Smoke test staging
      if: ${{ env.ACT != 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        PUBLIC_DNS=$(aws ec2 describe-instances \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --query 'Reservations[0].Instances[0].PublicDnsName' \
          --output text)
        CODE=$(curl -sS -o /dev/null -w "%{http_code}" "http://${PUBLIC_DNS}/")
        echo "Staging HTTP status: ${CODE}"
        test "$CODE" = "200"
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.job }}-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  #approval:
  #  name: Production Approval
  #  runs-on: ubuntu-latest
   # timeout-minutes: 30
  #  needs:
  #  - deploy-staging
    #if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
 #   permissions:
 #     contents: read
 #   steps:
  #  - name: Record production approval
  #    shell: bash
  #    run: |
   #     set -euo pipefail
  #      echo "Production deployment approved for ${{ github.sha }}"
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - deploy-staging
 #   if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Deploy container via SSM
      if: ${{ env.ACT != 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        IMAGE="${{ env.REGISTRY }}/${IMAGE_REPO}:${{ env.IMAGE_TAG }}"
        PREVIOUS_IMAGE="${{ env.REGISTRY }}/${IMAGE_REPO}:previous"
        COMMANDS_JSON=$(jq -n \
          --arg img "$IMAGE" \
          --arg prev "$PREVIOUS_IMAGE" \
          --arg user "${{ secrets.GHCR_USER || github.actor }}" \
          --arg token "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" \
          --arg host_port "${{ env.HOST_PORT }}" \
          --arg container_port "${{ env.CONTAINER_PORT }}" \
          --arg app_name "${{ secrets.DEPLOYMENT_NAME || 'app' }}" \
          '{
            commands: [
              "if ! command -v docker >/dev/null 2>&1; then if command -v dnf >/dev/null 2>&1; then dnf install -y docker; elif command -v yum >/dev/null 2>&1; then yum install -y docker; elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y docker.io; else echo \"No supported package manager found\"; exit 1; fi; fi; systemctl enable --now docker || service docker start",
              "set -e",
              "for i in $(seq 1 15); do docker info >/dev/null 2>&1 && break || sleep 1; done",
              "docker info >/dev/null 2>&1",
              ("echo " + ($token | @sh) + " | docker login ghcr.io -u " + ($user | @sh) + " --password-stdin"),
              ("if docker inspect " + ($app_name | @sh) + " >/dev/null 2>&1; then docker tag \"$(docker inspect --format='{{.Config.Image}}' " + ($app_name | @sh) + ")\" " + ($prev | @sh) + " && docker push " + ($prev | @sh) + " || true; fi"),
              ("docker pull " + ($img | @sh)),
              ("docker rm -f " + ($app_name | @sh) + "-new 2>/dev/null || true"),
              ("docker run -d --name " + ($app_name | @sh) + "-new " + ($img | @sh)),
              ("ok=0; for i in $(seq 1 15); do if docker exec " + ($app_name | @sh) + "-new sh -c " + ("curl -fsS http://localhost:" + $container_port + "/ >/dev/null 2>&1 || wget -qO- http://localhost:" + $container_port + "/ >/dev/null 2>&1" | @sh) + "; then ok=1; break; fi; sleep 2; done; if [ \"$ok\" -ne 1 ]; then echo 'canary failed health check'; docker logs " + ($app_name | @sh) + "-new 2>&1 | tail -50 || true; docker rm -f " + ($app_name | @sh) + "-new 2>/dev/null || true; exit 1; fi"),
              ("docker stop " + ($app_name | @sh) + " 2>/dev/null || true"),
              ("docker rm " + ($app_name | @sh) + " 2>/dev/null || true"),
              ("docker rm -f " + ($app_name | @sh) + "-new 2>/dev/null || true"),
              ("docker run -d --name " + ($app_name | @sh) + " -p " + $host_port + ":" + $container_port + " --restart unless-stopped " + ($img | @sh)),
              ("ok=0; for i in $(seq 1 15); do if docker exec " + ($app_name | @sh) + "-new sh -c " + ("curl -fsS http://localhost:" + $container_port + "/ >/dev/null 2>&1 || wget -qO- http://localhost:" + $container_port + "/ >/dev/null 2>&1" | @sh) + "; then ok=1; break; fi; sleep 2; done; if [ \"$ok\" -ne 1 ]; then echo canary_failed_health_check; docker logs " + ($app_name | @sh) + "-new 2>&1 | tail -50 || true; docker rm -f " + ($app_name | @sh) + "-new 2>/dev/null || true; exit 1; fi"),
              "docker image prune -f || true"
            ]
          }')
        aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Deploy production container" \
          --parameters "$COMMANDS_JSON" \
          --output json > ssm-output.json
        COMMAND_ID=$(jq -r '.Command.CommandId' ssm-output.json)
        echo "SSM Command ID: ${COMMAND_ID}"
        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" \
            --query 'Status' --output text 2>/dev/null || echo "Pending")
          echo "Attempt ${i}: status=${STATUS}"
          if [ "$STATUS" = "Success" ]; then
            echo "Deployment succeeded"
            exit 0
          fi
          if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
            echo "Deployment failed with status ${STATUS}"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --region "${{ env.AWS_REGION }}" \
              --query 'StandardErrorContent' --output text || true
            exit 1
          fi
          sleep 10
        done
        echo "Timed out waiting for SSM command ${COMMAND_ID}"
        exit 1
    - name: Check production health endpoint
      if: ${{ env.ACT != 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        PUBLIC_DNS=$(aws ec2 describe-instances \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --query 'Reservations[0].Instances[0].PublicDnsName' \
          --output text)
        curl -fsS --retry 10 --retry-delay 5 --retry-connrefused "http://${PUBLIC_DNS}${{ env.HEALTHCHECK_PATH }}"
    - name: Smoke test production
      if: ${{ env.ACT != 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        PUBLIC_DNS=$(aws ec2 describe-instances \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --query 'Reservations[0].Instances[0].PublicDnsName' \
          --output text)
        CODE=$(curl -sS -o /dev/null -w "%{http_code}" "http://${PUBLIC_DNS}/")
        echo "Production HTTP status: ${CODE}"
        test "$CODE" = "200"
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.job }}-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  rollback:
    name: Rollback
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - deploy-production
    #if: failure() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Roll back container via SSM
      if: ${{ env.ACT != 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        PREVIOUS_IMAGE="${{ env.REGISTRY }}/${IMAGE_REPO}:previous"
        COMMANDS_JSON=$(jq -n \
          --arg img "$PREVIOUS_IMAGE" \
          --arg user "${{ secrets.GHCR_USER || github.actor }}" \
          --arg token "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" \
          --arg host_port "${{ env.HOST_PORT }}" \
          --arg container_port "${{ env.CONTAINER_PORT }}" \
          --arg app_name "${{ secrets.DEPLOYMENT_NAME || 'app' }}" \
          '{
            commands: [
              "if ! command -v docker >/dev/null 2>&1; then if command -v dnf >/dev/null 2>&1; then dnf install -y docker; elif command -v yum >/dev/null 2>&1; then yum install -y docker; elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y docker.io; else echo \"No supported package manager found\"; exit 1; fi; fi; systemctl enable --now docker || service docker start",
              "set -e",
              ("echo " + ($token | @sh) + " | docker login ghcr.io -u " + ($user | @sh) + " --password-stdin"),
              ("docker pull " + ($img | @sh)),
              ("docker stop " + ($app_name | @sh) + " 2>/dev/null || true"),
              ("docker rm " + ($app_name | @sh) + " 2>/dev/null || true"),
              ("docker run -d --name " + ($app_name | @sh) + " -p " + $host_port + ":" + $container_port + " --restart unless-stopped " + ($img | @sh))
            ]
          }')
        aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Rollback app container" \
          --parameters "$COMMANDS_JSON" \
          --output json > ssm-rollback.json
        COMMAND_ID=$(jq -r '.Command.CommandId' ssm-rollback.json)
        echo "SSM Rollback Command ID: ${COMMAND_ID}"
        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" \
            --query 'Status' --output text 2>/dev/null || echo "Pending")
          echo "Attempt ${i}: status=${STATUS}"
          if [ "$STATUS" = "Success" ]; then
            echo "Rollback succeeded"
            exit 0
          fi
          if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
            echo "Rollback failed with status ${STATUS}"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --region "${{ env.AWS_REGION }}" \
              --query 'StandardErrorContent' --output text || true
            exit 1
          fi
          sleep 10
        done
        echo "Timed out waiting for SSM rollback command ${COMMAND_ID}"
        exit 1
  post-deploy:
    name: Post Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - deploy-production
    if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
    steps:
    - name: Report post-deploy status
      shell: bash
      run: |-
        set -euo pipefail
        echo "Post-deploy complete for ${{ secrets.DEPLOYMENT_NAME }} at ${{ github.sha }}"