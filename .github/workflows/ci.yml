name: CI
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch: null
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}
  AWS_REGION: us-east-1
  PYTHON_VERSION: '3.12'
  HOST_PORT: '80'
  CONTAINER_PORT: '80'
  APP_URL: http://18.232.137.88:80
  DEPLOYMENT_NAME: app
jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Lint Dockerfile (hadolint)
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: Dockerfile
        failure-threshold: error
    - name: Type check
      if: ${{ env.ACT != 'true' }}
      run: |
        set -euo pipefail
        if [ -f tsconfig.json ]; then
          npx --yes tsc --noEmit
        elif [ -f mypy.ini ] || { [ -f pyproject.toml ] && grep -q "mypy" pyproject.toml; }; then
          python3 -m pip install --break-system-packages mypy
          python3 -m mypy .
        else
          echo "No type checker configured; skipping type check."
        fi
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    - name: Cache npm packages
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json', '**/package.json') }}
        restore-keys: |
          ${{ runner.os }}-npm-
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Run unit and integration tests
      if: ${{ env.ACT != 'true' }}
      run: |
        set -euo pipefail
        if [ -f package.json ] && grep -q '"test"' package.json; then
          npm ci || npm install
          npm test
        elif [ -f pyproject.toml ] || [ -f pytest.ini ] || [ -d tests ]; then
          if [ -f requirements.txt ]; then
            python3 -m pip install --break-system-packages -r requirements.txt
          fi
          python3 -m pip install --break-system-packages pytest pytest-cov
          python3 -m pytest -q --cov=. --cov-report=xml --cov-report=term
        else
          echo "No test framework configured; no unit/integration tests to run."
        fi
    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: |
          coverage.xml
          coverage/
        if-no-files-found: ignore
    - name: Upload test artifacts
      uses: actions/upload-artifact@v4
      with:
        name: test-ci-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    #- name: Dependency scan (Trivy filesystem)
    #  uses: aquasecurity/trivy-action@v0.36.0
    #  with:
    #    scan-type: fs
    #    scan-ref: .
    #    format: sarif
    #    output: trivy-fs.sarif
    #    exit-code: '1'
    #    severity: CRITICAL,HIGH
    #- name: Secret scan (Gitleaks)
    #  uses: gitleaks/gitleaks-action@v2
    #  env:
    #    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    #  with:
    #    args: --verbose --redact
    #- name: Code scan (Trivy config)
    #  uses: aquasecurity/trivy-action@v0.36.0
    #  with:
    #    scan-type: config
    #    scan-ref: .
    #    format: sarif
    #    output: trivy-config.sarif
    #    exit-code: '1'
    #    severity: CRITICAL,HIGH
    - name: Upload security reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: '*.sarif'
        if-no-files-found: ignore
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - validate
    - test
    - security
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Compute lowercase image reference
      id: image
      run: |
        set -euo pipefail
        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        echo "repo=$IMAGE_REPO" >> "$GITHUB_OUTPUT"
        echo "ref=${{ env.REGISTRY }}/$IMAGE_REPO:${{ env.IMAGE_TAG }}" >> "$GITHUB_OUTPUT"
    - name: Build Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: false
        load: true
        tags: |
          ${{ env.REGISTRY }}/${{ steps.image.outputs.repo }}:${{ env.IMAGE_TAG }}
          ${{ env.REGISTRY }}/${{ steps.image.outputs.repo }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
    #- name: Scan Docker image for vulnerabilities
    #  uses: aquasecurity/trivy-action@v0.36.0
    #  with:
    #    image-ref: ${{ steps.image.outputs.ref }}
    #    format: table
    #    exit-code: '1'
    #    severity: CRITICAL,HIGH
    #    output: trivy-image-report.txt
    - name: Upload build artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-scan-report
        path: trivy-image-report.txt
        if-no-files-found: ignore
    - name: Upload build artifacts bundle
      uses: actions/upload-artifact@v4
      with:
        name: build-ci-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      }}
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Compute lowercase image reference
      id: image
      run: |
        set -euo pipefail
        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        echo "repo=$IMAGE_REPO" >> "$GITHUB_OUTPUT"
        echo "ref=${{ env.REGISTRY }}/$IMAGE_REPO:${{ env.IMAGE_TAG }}" >> "$GITHUB_OUTPUT"
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ steps.image.outputs.repo }}:${{ env.IMAGE_TAG }}
          ${{ env.REGISTRY }}/${{ steps.image.outputs.repo }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Upload publish artifacts
      uses: actions/upload-artifact@v4
      with:
        name: publish-ci-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  deploy-staging:
    name: Deploy (Staging)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: publish
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      }}
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Deploy container via SSM
      shell: bash
      run: |
        set -euo pipefail
        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        IMAGE="${{ env.REGISTRY }}/$IMAGE_REPO:${{ env.IMAGE_TAG }}"

        COMMANDS_JSON=$(jq -n \
          --arg img "$IMAGE" \
          --arg user "${{ secrets.GHCR_USER || github.actor }}" \
          --arg token "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" \
          --arg host_port "${{ env.HOST_PORT }}" \
          --arg container_port "${{ env.CONTAINER_PORT }}" \
          --arg app_name "${{ secrets.DEPLOYMENT_NAME || env.DEPLOYMENT_NAME }}" \
          '{
            commands: [
              "if ! command -v docker >/dev/null 2>&1; then if command -v dnf >/dev/null 2>&1; then dnf install -y docker; elif command -v yum >/dev/null 2>&1; then yum install -y docker; elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y docker.io; else echo \"No supported package manager found\"; exit 1; fi; fi; systemctl enable --now docker || service docker start",
              "set -e",
              "for i in $(seq 1 15); do docker info >/dev/null 2>&1 && break || sleep 1; done",
              "docker info >/dev/null 2>&1",
              ("echo " + ($token | @sh) + " | docker login ghcr.io -u " + ($user | @sh) + " --password-stdin"),
              ("docker pull " + ($img | @sh)),
              ("docker rm -f " + ($app_name | @sh) + "-new 2>/dev/null || true"),
              ("docker run -d --name " + ($app_name | @sh) + "-new " + ($img | @sh)),
              ("for i in $(seq 1 15); do docker exec " + ($app_name | @sh) + "-new sh -c \"curl -fsS http://localhost:" + ($container_port | @sh) + "/ || wget -qO- http://localhost:" + ($container_port | @sh) + "/\" >/dev/null 2>&1 && break || sleep 2; done"),
              ("docker exec " + ($app_name | @sh) + "-new sh -c \"curl -fsS http://localhost:" + ($container_port | @sh) + "/ || wget -qO- http://localhost:" + ($container_port | @sh) + "/\" >/dev/null"),
              ("docker stop " + ($app_name | @sh) + " 2>/dev/null || true"),
              ("docker rm " + ($app_name | @sh) + " 2>/dev/null || true"),
              ("docker rm -f " + ($app_name | @sh) + "-new 2>/dev/null || true"),
              ("docker run -d --name " + ($app_name | @sh) + " -p " + ($host_port | @sh) + ":" + ($container_port | @sh) + " --restart unless-stopped " + ($img | @sh)),
              "docker image prune -f || true"
            ]
          }')

        aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Deploy app container (staging)" \
          --parameters "$COMMANDS_JSON" \
          --output json > ssm-output.json

        COMMAND_ID=$(jq -r '.Command.CommandId' ssm-output.json)
        echo "SSM command id: $COMMAND_ID"

        STATUS="Pending"
        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" \
            --query 'Status' --output text 2>/dev/null || echo "Pending")
          echo "Attempt $i: status=$STATUS"
          case "$STATUS" in
            Success)
              break
              ;;
            Failed|Cancelled|TimedOut|Cancelling)
              echo "SSM command failed with status $STATUS"
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'StandardErrorContent' --output text || true
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'StandardOutputContent' --output text || true
              exit 1
              ;;
          esac
          sleep 10
        done

        if [ "$STATUS" != "Success" ]; then
          echo "SSM command did not succeed (final status: $STATUS)"
          exit 1
        fi
  staging-health-check:
    name: Staging Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: deploy-staging
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      }}
    steps:
    - name: Check staging health
      run: |
        set -euo pipefail
        for i in $(seq 1 12); do
          if curl --fail --silent --show-error "${{ env.APP_URL }}/"; then
            echo "Staging health check passed"
            exit 0
          fi
          echo "Attempt $i failed; retrying..."
          sleep 5
        done
        echo "Staging health check failed"
        exit 1
  staging-smoke-test:
    name: Staging Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: staging-health-check
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      }}
    steps:
    - name: Run staging smoke test
      run: |
        set -euo pipefail
        curl --fail --silent --show-error "${{ env.APP_URL }}/" > /dev/null
        echo "Staging smoke test passed against ${{ env.APP_URL }}/"
    - name: Upload staging smoke test artifacts
      uses: actions/upload-artifact@v4
      with:
        name: staging-smoke-test-ci-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  deploy-production:
    name: Deploy (Production)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: staging-smoke-test
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      }}
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Deploy container via SSM
      shell: bash
      run: |
        set -euo pipefail
        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        IMAGE="${{ env.REGISTRY }}/$IMAGE_REPO:${{ env.IMAGE_TAG }}"

        COMMANDS_JSON=$(jq -n \
          --arg img "$IMAGE" \
          --arg user "${{ secrets.GHCR_USER || github.actor }}" \
          --arg token "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" \
          --arg host_port "${{ env.HOST_PORT }}" \
          --arg container_port "${{ env.CONTAINER_PORT }}" \
          --arg app_name "${{ secrets.DEPLOYMENT_NAME || env.DEPLOYMENT_NAME }}" \
          '{
            commands: [
              "if ! command -v docker >/dev/null 2>&1; then if command -v dnf >/dev/null 2>&1; then dnf install -y docker; elif command -v yum >/dev/null 2>&1; then yum install -y docker; elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y docker.io; else echo \"No supported package manager found\"; exit 1; fi; fi; systemctl enable --now docker || service docker start",
              "set -e",
              "for i in $(seq 1 15); do docker info >/dev/null 2>&1 && break || sleep 1; done",
              "docker info >/dev/null 2>&1",
              ("echo " + ($token | @sh) + " | docker login ghcr.io -u " + ($user | @sh) + " --password-stdin"),
              ("docker pull " + ($img | @sh)),
              ("docker rm -f " + ($app_name | @sh) + "-new 2>/dev/null || true"),
              ("docker run -d --name " + ($app_name | @sh) + "-new " + ($img | @sh)),
              ("for i in $(seq 1 15); do docker exec " + ($app_name | @sh) + "-new sh -c \"curl -fsS http://localhost:" + ($container_port | @sh) + "/ || wget -qO- http://localhost:" + ($container_port | @sh) + "/\" >/dev/null 2>&1 && break || sleep 2; done"),
              ("docker exec " + ($app_name | @sh) + "-new sh -c \"curl -fsS http://localhost:" + ($container_port | @sh) + "/ || wget -qO- http://localhost:" + ($container_port | @sh) + "/\" >/dev/null"),
              ("docker stop " + ($app_name | @sh) + " 2>/dev/null || true"),
              ("docker rm " + ($app_name | @sh) + " 2>/dev/null || true"),
              ("docker rm -f " + ($app_name | @sh) + "-new 2>/dev/null || true"),
              ("docker run -d --name " + ($app_name | @sh) + " -p " + ($host_port | @sh) + ":" + ($container_port | @sh) + " --restart unless-stopped " + ($img | @sh)),
              "docker image prune -f || true"
            ]
          }')

        aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Deploy app container (production)" \
          --parameters "$COMMANDS_JSON" \
          --output json > ssm-output.json

        COMMAND_ID=$(jq -r '.Command.CommandId' ssm-output.json)
        echo "SSM command id: $COMMAND_ID"

        STATUS="Pending"
        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" \
            --query 'Status' --output text 2>/dev/null || echo "Pending")
          echo "Attempt $i: status=$STATUS"
          case "$STATUS" in
            Success)
              break
              ;;
            Failed|Cancelled|TimedOut|Cancelling)
              echo "SSM command failed with status $STATUS"
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'StandardErrorContent' --output text || true
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'StandardOutputContent' --output text || true
              exit 1
              ;;
          esac
          sleep 10
        done

        if [ "$STATUS" != "Success" ]; then
          echo "SSM command did not succeed (final status: $STATUS)"
          exit 1
        fi
  production-health-check:
    name: Production Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: deploy-production
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      }}
    steps:
    - name: Check production health
      run: |
        set -euo pipefail
        for i in $(seq 1 12); do
          if curl --fail --silent --show-error "${{ env.APP_URL }}/"; then
            echo "Production health check passed"
            exit 0
          fi
          echo "Attempt $i failed; retrying..."
          sleep 5
        done
        echo "Production health check failed"
        exit 1
  production-smoke-test:
    name: Production Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: production-health-check
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      }}
    steps:
    - name: Run production smoke test
      run: |
        set -euo pipefail
        curl --fail --silent --show-error "${{ env.APP_URL }}/" > /dev/null
        echo "Production smoke test passed against ${{ env.APP_URL }}/"
    - name: Upload production smoke test artifacts
      uses: actions/upload-artifact@v4
      with:
        name: production-smoke-test-ci-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  rollback:
    name: Rollback
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - deploy-production
    - production-health-check
    - production-smoke-test
    if: ${{ failure() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      }}
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Redeploy previous published image via SSM
      shell: bash
      run: |
        set -euo pipefail
        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        PREVIOUS_TAG="${{ github.event.before }}"
        case "$PREVIOUS_TAG" in
          ""|"null"|"0000000000000000000000000000000000000000")
            PREVIOUS_TAG="latest"
            ;;
        esac
        PREVIOUS_IMAGE="${{ env.REGISTRY }}/$IMAGE_REPO:$PREVIOUS_TAG"
        LATEST_IMAGE="${{ env.REGISTRY }}/$IMAGE_REPO:latest"

        COMMANDS_JSON=$(jq -n \
          --arg prev "$PREVIOUS_IMAGE" \
          --arg latest "$LATEST_IMAGE" \
          --arg user "${{ secrets.GHCR_USER || github.actor }}" \
          --arg token "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" \
          --arg host_port "${{ env.HOST_PORT }}" \
          --arg container_port "${{ env.CONTAINER_PORT }}" \
          --arg app_name "${{ secrets.DEPLOYMENT_NAME || env.DEPLOYMENT_NAME }}" \
          '{
            commands: [
              "if ! command -v docker >/dev/null 2>&1; then if command -v dnf >/dev/null 2>&1; then dnf install -y docker; elif command -v yum >/dev/null 2>&1; then yum install -y docker; elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y docker.io; else echo \"No supported package manager found\"; exit 1; fi; fi; systemctl enable --now docker || service docker start",
              "set -e",
              "for i in $(seq 1 15); do docker info >/dev/null 2>&1 && break || sleep 1; done",
              "docker info >/dev/null 2>&1",
              ("echo " + ($token | @sh) + " | docker login ghcr.io -u " + ($user | @sh) + " --password-stdin"),
              ("if docker pull " + ($prev | @sh) + " 2>/dev/null; then ROLLBACK_IMAGE=" + ($prev | @sh) + "; else ROLLBACK_IMAGE=" + ($latest | @sh) + "; docker pull \"$ROLLBACK_IMAGE\"; fi; echo \"Rolling back to $ROLLBACK_IMAGE\"; docker stop " + ($app_name | @sh) + " 2>/dev/null || true; docker rm " + ($app_name | @sh) + " 2>/dev/null || true; docker run -d --name " + ($app_name | @sh) + " -p " + ($host_port | @sh) + ":" + ($container_port | @sh) + " --restart unless-stopped \"$ROLLBACK_IMAGE\""),
              "docker image prune -f || true"
            ]
          }')

        aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Rollback app container" \
          --parameters "$COMMANDS_JSON" \
          --output json > ssm-rollback.json

        COMMAND_ID=$(jq -r '.Command.CommandId' ssm-rollback.json)
        echo "SSM rollback command id: $COMMAND_ID"

        STATUS="Pending"
        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" \
            --query 'Status' --output text 2>/dev/null || echo "Pending")
          echo "Attempt $i: status=$STATUS"
          case "$STATUS" in
            Success)
              break
              ;;
            Failed|Cancelled|TimedOut|Cancelling)
              echo "Rollback SSM command failed with status $STATUS"
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'StandardErrorContent' --output text || true
              exit 1
              ;;
          esac
          sleep 10
        done

        if [ "$STATUS" != "Success" ]; then
          echo "Rollback did not succeed (final status: $STATUS)"
          exit 1
        fi
    - name: Upload rollback artifacts
      uses: actions/upload-artifact@v4
      with:
        name: rollback-ci-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  post-deploy:
    name: Post Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - production-smoke-test
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      }}
    steps:
    - name: Verify deployment
      run: |
        set -euo pipefail
        curl --fail --silent --show-error "${{ env.APP_URL }}/" > /dev/null
        echo "Deployment verified at ${{ env.APP_URL }}/"
    - name: Write deployment summary
      run: |-
        {
          echo "## Deployment Summary"
          echo ""
          echo "- Image: \`${{ env.REGISTRY }}/${{ github.repository }}:${{ env.IMAGE_TAG }}\`"
          echo "- URL: ${{ env.APP_URL }}/"
          echo "- Commit: \`${{ github.sha }}\`"
          echo "- Instance: \`${{ secrets.EC2_INSTANCE_ID }}\`"
        } >> "$GITHUB_STEP_SUMMARY"