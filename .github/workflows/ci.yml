name: CI
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  REGISTRY: ghcr.io
  IMAGE_REPO: ${{ github.repository }}
  IMAGE_TAG: ${{ github.sha }}
  AWS_REGION: ${{ secrets.AWS_REGION }}
  PYTHON_VERSION: '3.12'
  HOST_PORT: '80'
  CONTAINER_PORT: '80'
  ACCESS_URL: http://18.233.200.88:80
jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Lint
      if: ${{ env.ACT != 'true' }}
      run: |
        set -euo pipefail
        test -f Dockerfile
        find . -name '*.html' -not -path './.git/*' | head -n 1
        echo "Lint passed"
    - name: Type check
      if: ${{ env.ACT != 'true' }}
      run: |
        set -euo pipefail
        grep -qE '^FROM ' Dockerfile
        grep -qE '^(CMD|ENTRYPOINT) ' Dockerfile
        echo "Type check passed"
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: validate-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Unit tests
      if: ${{ env.ACT != 'true' }}
      run: |
        set -euo pipefail
        echo "No unit test framework detected; running static asset assertions"
        find . -name '*.html' -not -path './.git/*' | head -n 1
    - name: Integration test (serve site in container)
      if: ${{ env.ACT != 'true' }}
      run: |
        set -euo pipefail
        docker build -t ci-test-image .
        docker run -d --name ci-test -p 8081:80 ci-test-image
        ok=0
        for i in $(seq 1 15); do
          if curl -fsS http://localhost:8081/ >/dev/null 2>&1; then ok=1; break; fi
          sleep 2
        done
        docker rm -f ci-test >/dev/null 2>&1 || true
        test "$ok" = "1"
        echo "Integration test passed"
    - name: Coverage report
      if: ${{ env.ACT != 'true' }}
      run: |
        set -euo pipefail
        mkdir -p coverage
        echo "No coverage tool detected for this project; recording static asset baseline." > coverage/summary.txt
        echo "html_files=$(find . -name '*.html' -not -path './.git/*' | wc -l)" >> coverage/summary.txt
        cat coverage/summary.txt
    - name: Upload coverage artifact
      if: ${{ env.ACT != 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/
        retention-days: 7
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: test-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  security:
    name: Security Scans
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Dependency vulnerability scan
      if: ${{ env.ACT != 'true' }}
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: fs
        scan-ref: .
        scanners: vuln
        format: table
        exit-code: '1'
        severity: CRITICAL,HIGH
    - name: Install gitleaks
      if: ${{ env.ACT != 'true' }}
      run: |
        set -euo pipefail
        curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz -o gitleaks.tar.gz
        tar -xzf gitleaks.tar.gz gitleaks
        sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
    #- name: Run secret scan
    #  if: ${{ env.ACT != 'true' }}
    #  run: |
    #    set -euo pipefail
    #    gitleaks detect --source . --verbose --redact
    #- name: Install semgrep
    #  if: ${{ env.ACT != 'true' }}
    #  run: |
    #    set -euo pipefail
    #    pip install --break-system-packages semgrep
    #- name: Run static code analysis
    #  if: ${{ env.ACT != 'true' }}
    #  run: |
    #    set -euo pipefail
    #    semgrep scan --config=p/default --error --metrics=off
  build:
    name: Build & Scan Image
    needs:
    - validate
    - test
    - security
    #if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Normalize image repository
      run: echo "IMAGE_REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
        >> "$GITHUB_ENV"
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build Docker image
      if: ${{ env.ACT != 'true' }}
      run: |
        set -euo pipefail
        docker build \
          -t "${{ env.REGISTRY }}/$IMAGE_REPO:${{ env.IMAGE_TAG }}" \
          -t "${{ env.REGISTRY }}/$IMAGE_REPO:latest" \
          .
    #- name: Scan Docker image for vulnerabilities
    #  if: ${{ env.ACT != 'true' }}
    #  uses: aquasecurity/trivy-action@v0.36.0
    #  with:
    #    image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
    #    format: table
    #    exit-code: '1'
    #    severity: CRITICAL,HIGH
    - name: Save image for downstream jobs
      if: ${{ env.ACT != 'true' }}
      run: |
        set -euo pipefail
        docker save "${{ env.REGISTRY }}/$IMAGE_REPO:${{ env.IMAGE_TAG }}" -o image.tar
    - name: Upload image artifact
      uses: actions/upload-artifact@v4
      with:
        name: docker-image
        path: image.tar
        retention-days: 1
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  publish:
    name: Publish Image
    needs:
    - build
    #if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
    - name: Download image artifact
      uses: actions/download-artifact@v4
      with:
        name: docker-image
    - name: Load image
      run: |
        set -euo pipefail
        docker load -i image.tar

        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        IMAGE="ghcr.io/${IMAGE_REPO}"

        # Ensure both tags exist in the publish job
        docker tag "${IMAGE}:${{ github.sha }}" "${IMAGE}:latest"

        docker image ls "${IMAGE}"
    - name: Normalize image repository
      run: echo "IMAGE_REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
        >> "$GITHUB_ENV"
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Push Docker image
      run: |
        set -euo pipefail
        docker push "${{ env.REGISTRY }}/$IMAGE_REPO:${{ env.IMAGE_TAG }}"
        docker push "${{ env.REGISTRY }}/$IMAGE_REPO:latest"
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: publish-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  deploy-staging:
    name: Deploy Staging
    needs:
    - publish
    #if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Deploy container via SSM
      shell: bash
      run: |
        set -euo pipefail
        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        IMAGE="${{ env.REGISTRY }}/$IMAGE_REPO:${{ env.IMAGE_TAG }}"

        COMMANDS_JSON=$(jq -n \
          --arg img "$IMAGE" \
          --arg user "${{ secrets.GHCR_USER || github.actor }}" \
          --arg token "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" \
          --arg host_port "${{ env.HOST_PORT }}" \
          --arg container_port "${{ env.CONTAINER_PORT }}" \
          --arg app_name "${{ secrets.DEPLOYMENT_NAME || 'app' }}" \
          '{
            commands: [
              "set -e",
              "if ! command -v docker >/dev/null 2>&1; then if command -v dnf >/dev/null 2>&1; then dnf install -y docker; elif command -v yum >/dev/null 2>&1; then yum install -y docker; elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y docker.io; fi; fi",
              "systemctl enable --now docker >/dev/null 2>&1 || service docker start >/dev/null 2>&1 || true",
              "for i in $(seq 1 15); do docker info >/dev/null 2>&1 && break || sleep 1; done",
              "docker info >/dev/null 2>&1",
              "echo " + ($token | @sh) + " | docker login ghcr.io -u " + ($user | @sh) + " --password-stdin",
              "docker pull " + ($img | @sh),
              "docker rm -f " + ($app_name | @sh) + "-new >/dev/null 2>&1 || true",
              "docker run -d --name " + ($app_name | @sh) + "-new " + ($img | @sh),
              "ok=0; for i in $(seq 1 15); do if docker exec " + ($app_name | @sh) + "-new curl -fsS http://localhost:" + ($container_port | @sh) + "/ >/dev/null 2>&1 || docker exec " + ($app_name | @sh) + "-new wget -q -O /dev/null http://localhost:" + ($container_port | @sh) + "/ >/dev/null 2>&1; then ok=1; break; fi; sleep 2; done; test \"$ok\" = \"1\"",
              "docker stop " + ($app_name | @sh) + " >/dev/null 2>&1 || true",
              "docker rm " + ($app_name | @sh) + " >/dev/null 2>&1 || true",
              "docker rm -f " + ($app_name | @sh) + "-new >/dev/null 2>&1 || true",
              "docker run -d --name " + ($app_name | @sh) + " --restart unless-stopped -p " + ($host_port | @sh) + ":" + ($container_port | @sh) + " " + ($img | @sh),
              "ok=0; for i in $(seq 1 15); do if curl -fsS http://localhost:" + ($host_port | @sh) + "/ >/dev/null 2>&1 || wget -q -O /dev/null http://localhost:" + ($host_port | @sh) + "/ >/dev/null 2>&1; then ok=1; break; fi; sleep 2; done; test \"$ok\" = \"1\"",
              "docker image prune -f >/dev/null 2>&1 || true"
            ]
          }')

        aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Deploy app container" \
          --parameters "$COMMANDS_JSON" \
          --output json > ssm-output.json

        COMMAND_ID=$(jq -r '.Command.CommandId' ssm-output.json)
        echo "SSM Command ID: $COMMAND_ID"

        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" \
            --query 'Status' --output text 2>/dev/null || echo "Pending")
          echo "Attempt $i: $STATUS"
          case "$STATUS" in
            Success)
              echo "Deployment succeeded"
              exit 0
              ;;
            Failed|Cancelled|TimedOut)
              echo "Deployment failed with status $STATUS"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --region "${{ env.AWS_REGION }}" \
                --query 'StandardErrorContent' --output text || true
              exit 1
              ;;
          esac
          sleep 10
        done

        echo "Timed out waiting for SSM command"
        aws ssm get-command-invocation \
          --command-id "$COMMAND_ID" \
          --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --query 'StandardErrorContent' --output text || true
        exit 1
    - name: Staging health check
      if: ${{ env.ACT != 'true' }}
      run: |
        set -euo pipefail
        curl --fail --retry 10 --retry-delay 5 "${{ env.ACCESS_URL }}/"
    - name: Staging smoke test
      if: ${{ env.ACT != 'true' }}
      run: |
        set -euo pipefail
        curl --fail --silent --show-error "${{ env.ACCESS_URL }}/" > /dev/null
        echo "Staging smoke test passed"
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: deploy-staging-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  deploy-production:
    name: Deploy Production
    needs:
    - deploy-staging
    #if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Deploy container via SSM
      shell: bash
      run: |
        set -euo pipefail
        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        IMAGE="${{ env.REGISTRY }}/$IMAGE_REPO:${{ env.IMAGE_TAG }}"

        COMMANDS_JSON=$(jq -n \
          --arg img "$IMAGE" \
          --arg user "${{ secrets.GHCR_USER || github.actor }}" \
          --arg token "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" \
          --arg host_port "${{ env.HOST_PORT }}" \
          --arg container_port "${{ env.CONTAINER_PORT }}" \
          --arg app_name "${{ secrets.DEPLOYMENT_NAME || 'app' }}" \
          '{
            commands: [
              "set -e",
              "if ! command -v docker >/dev/null 2>&1; then if command -v dnf >/dev/null 2>&1; then dnf install -y docker; elif command -v yum >/dev/null 2>&1; then yum install -y docker; elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y docker.io; fi; fi",
              "systemctl enable --now docker >/dev/null 2>&1 || service docker start >/dev/null 2>&1 || true",
              "for i in $(seq 1 15); do docker info >/dev/null 2>&1 && break || sleep 1; done",
              "docker info >/dev/null 2>&1",
              "echo " + ($token | @sh) + " | docker login ghcr.io -u " + ($user | @sh) + " --password-stdin",
              "docker pull " + ($img | @sh),
              "docker rm -f " + ($app_name | @sh) + "-new >/dev/null 2>&1 || true",
              "docker run -d --name " + ($app_name | @sh) + "-new " + ($img | @sh),
              "ok=0; for i in $(seq 1 15); do if docker exec " + ($app_name | @sh) + "-new curl -fsS http://localhost:" + ($container_port | @sh) + "/ >/dev/null 2>&1 || docker exec " + ($app_name | @sh) + "-new wget -q -O /dev/null http://localhost:" + ($container_port | @sh) + "/ >/dev/null 2>&1; then ok=1; break; fi; sleep 2; done; test \"$ok\" = \"1\"",
              "docker stop " + ($app_name | @sh) + " >/dev/null 2>&1 || true",
              "docker rm " + ($app_name | @sh) + " >/dev/null 2>&1 || true",
              "docker rm -f " + ($app_name | @sh) + "-new >/dev/null 2>&1 || true",
              "docker run -d --name " + ($app_name | @sh) + " --restart unless-stopped -p " + ($host_port | @sh) + ":" + ($container_port | @sh) + " " + ($img | @sh),
              "ok=0; for i in $(seq 1 15); do if curl -fsS http://localhost:" + ($host_port | @sh) + "/ >/dev/null 2>&1 || wget -q -O /dev/null http://localhost:" + ($host_port | @sh) + "/ >/dev/null 2>&1; then ok=1; break; fi; sleep 2; done; test \"$ok\" = \"1\"",
              "docker image prune -f >/dev/null 2>&1 || true"
            ]
          }')

        aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Deploy app container" \
          --parameters "$COMMANDS_JSON" \
          --output json > ssm-output.json

        COMMAND_ID=$(jq -r '.Command.CommandId' ssm-output.json)
        echo "SSM Command ID: $COMMAND_ID"

        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" \
            --query 'Status' --output text 2>/dev/null || echo "Pending")
          echo "Attempt $i: $STATUS"
          case "$STATUS" in
            Success)
              echo "Deployment succeeded"
              exit 0
              ;;
            Failed|Cancelled|TimedOut)
              echo "Deployment failed with status $STATUS"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --region "${{ env.AWS_REGION }}" \
                --query 'StandardErrorContent' --output text || true
              exit 1
              ;;
          esac
          sleep 10
        done

        echo "Timed out waiting for SSM command"
        aws ssm get-command-invocation \
          --command-id "$COMMAND_ID" \
          --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --query 'StandardErrorContent' --output text || true
        exit 1
    - name: Production health check
      if: ${{ env.ACT != 'true' }}
      run: |
        set -euo pipefail
        curl --fail --retry 10 --retry-delay 5 "${{ env.ACCESS_URL }}/"
    - name: Production smoke test
      if: ${{ env.ACT != 'true' }}
      run: |
        set -euo pipefail
        curl --fail --silent --show-error "${{ env.ACCESS_URL }}/" > /dev/null
        echo "Production smoke test passed"
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: deploy-production-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  rollback:
    name: Rollback
    needs:
    - deploy-production
    #if: ${{ failure() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')}}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Restart previous container via SSM
      shell: bash
      run: |
        set -euo pipefail
        APP_NAME="${{ secrets.DEPLOYMENT_NAME || 'app' }}"
        COMMANDS_JSON=$(jq -n --arg app "$APP_NAME" '{
          commands: [
                "if ! command -v docker >/dev/null 2>&1; then if command -v dnf >/dev/null 2>&1; then dnf install -y docker; elif command -v yum >/dev/null 2>&1; then yum install -y docker; elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y docker.io; fi; systemctl enable --now docker; fi",
        "set -e",
            "docker start " + ($app | @sh) + " >/dev/null 2>&1 || true",
            "docker ps -a"
          ]
        }')

        aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Rollback app container" \
          --parameters "$COMMANDS_JSON" \
          --output json > rollback-output.json

        COMMAND_ID=$(jq -r '.Command.CommandId' rollback-output.json)
        echo "Rollback SSM Command ID: $COMMAND_ID"

        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" \
            --query 'Status' --output text 2>/dev/null || echo "Pending")
          echo "Attempt $i: $STATUS"
          case "$STATUS" in
            Success)
              echo "Rollback succeeded"
              exit 0
              ;;
            Failed|Cancelled|TimedOut)
              echo "Rollback failed with status $STATUS"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --region "${{ env.AWS_REGION }}" \
                --query 'StandardErrorContent' --output text || true
              exit 1
              ;;
          esac
          sleep 10
        done

        echo "Timed out waiting for rollback SSM command"
        exit 1
  post-deploy:
    name: Post Deploy Verification
    needs:
    - deploy-production
    #if: ${{ success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')}}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Verify public endpoint
      if: ${{ env.ACT != 'true' }}
      run: |-
        set -euo pipefail
        curl --fail --silent --show-error --retry 5 --retry-delay 5 "${{ env.ACCESS_URL }}/" > /dev/null
        echo "Post-deploy verification passed for ${{ env.ACCESS_URL }}"