name: CI/CD Pipeline
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}
  AWS_REGION: ${{ secrets.AWS_REGION }}
  HOST_PORT: '80'
  CONTAINER_PORT: '80'
  HEALTHCHECK_PATH: /
jobs:
  validate:
    name: Validate (lint & type-check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Execute lint
      run: docker run --rm -i hadolint/hadolint < Dockerfile
      if: ${{ env.ACT != 'true' }}
    - name: Execute type_check
      shell: bash
      run: |
        set -euo pipefail
        docker run --rm -v "$PWD":/app -w /app node:20-alpine sh -c '
          if [ -f package.json ]; then
            npm install --silent
            npm run typecheck --if-present
          else
            echo "No package.json found; type check skipped"
          fi
        '
  test:
    name: Test (unit, integration, coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE_NAME: test-app-image
    steps:
    - uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build image for testing
      run: docker buildx build --cache-from=type=gha,scope=test --cache-to=type=gha,mode=max,scope=test
        --load -t ${{ env.IMAGE_NAME }} .
    - name: Execute unit_test
      run: docker run --rm -d -p 80:80 --name test-app ${{ env.IMAGE_NAME }} && sleep
        2 && (curl -f http://localhost:80 || exit 1)
    - name: Execute integration_test
      shell: bash
      run: |
        set -euo pipefail
        docker run --rm -d -p 8080:80 --name test-app-integration ${{ env.IMAGE_NAME }}
        trap 'docker rm -f test-app-integration >/dev/null 2>&1 || true' EXIT
        sleep 2
        curl -f http://localhost:8080/ || exit 1
        echo 'Integration test passed'
    - name: Execute coverage
      shell: bash
      run: |
        set -euo pipefail
        docker run --rm -v "$PWD":/app -w /app node:20-alpine sh -c '
          if [ -f package.json ]; then
            npm install --silent
            npm test -- --coverage --coverageReporters=text
          else
            echo "No package.json found; coverage skipped"
          fi
        '
      if: ${{ env.ACT != 'true' }}
    - name: Upload coverage report
      if: hashFiles('coverage/**', 'coverage.out', 'coverage.xml') != ''
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: |
          coverage/**
          coverage.out
          coverage.xml
    - name: Cleanup test container
      if: always()
      run: docker rm -f test-app || true
  security:
    name: Security scan (SAST, deps, secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Execute dependency_scan
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: fs
        scan-ref: .
        severity: HIGH,CRITICAL
        exit-code: '1'
    - name: Execute secret_scan
      uses: trufflesecurity/trufflehog@v3.82.11
      with:
        path: ./
        base: HEAD
        head: HEAD
        only_verified: true
        fail: true
    - name: Execute code_scan
      uses: semgrep/semgrep-action@v1.31.0
      with:
        config: auto
  build:
    name: Build, push & scan image
    needs:
    - validate
    - test
    - security
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Compute lowercase image repo
      id: image-repo
      run: |
        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        echo "image_repo=${IMAGE_REPO}" >> "$GITHUB_OUTPUT"
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        cache-from: type=gha,scope=build
        cache-to: type=gha,mode=max,scope=build
        tags: |
          ${{ env.REGISTRY }}/${{ steps.image-repo.outputs.image_repo }}:${{ env.IMAGE_TAG }}
          ${{ env.REGISTRY }}/${{ steps.image-repo.outputs.image_repo }}:latest
    - name: Execute image_scan
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: ${{ env.REGISTRY }}/${{ steps.image-repo.outputs.image_repo }}:${{
          env.IMAGE_TAG }}
        format: table
        exit-code: '1'
        severity: CRITICAL,HIGH
        output: trivy-image-report.txt
    - name: Upload image scan report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: trivy-image-report
        path: trivy-image-report.txt
  deploy-staging:
    name: Deploy to staging
    needs:
    - build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Deploy to staging via SSM
      shell: bash
      run: |
        set -euo pipefail
        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        IMAGE="${{ env.REGISTRY }}/$IMAGE_REPO:${{ env.IMAGE_TAG }}"
        HOST_PORT="${{ env.HOST_PORT || '80' }}"
        CONTAINER_PORT="${{ env.CONTAINER_PORT || '80' }}"
        host_port="$HOST_PORT"
        container_port="$CONTAINER_PORT"
        COMMANDS_JSON=$(jq -n \
          --arg img "$IMAGE" \
          --arg registry "${{ env.REGISTRY }}" \
          --arg user "${{ secrets.GHCR_USER || github.actor }}" \
          --arg token "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" \
          --arg host_port "$HOST_PORT" \
          --arg container_port "$CONTAINER_PORT" \
          --arg app_name "${{ secrets.DEPLOYMENT_NAME }}" \
          '{commands: [
            "if ! command -v docker >/dev/null 2>&1; then if command -v dnf >/dev/null 2>&1; then dnf install -y docker; elif command -v yum >/dev/null 2>&1; then yum install -y docker; elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y docker.io; else echo \"No supported package manager found\"; exit 1; fi; fi; systemctl enable --now docker || service docker start",
            "for i in $(seq 1 15); do docker info >/dev/null 2>&1 && break || sleep 1; done",
            "echo " + ($token | @sh) + " | docker login " + ($registry | @sh) + " --username " + ($user | @sh) + " --password-stdin",
            "docker pull " + ($img | @sh),
            "docker rm -f " + (($app_name + "-new") | @sh) + " 2>/dev/null || true",
            "docker run -d --name " + (($app_name + "-new") | @sh) + " " + ($img | @sh),
            "healthy=0",
            "for i in $(seq 1 15); do if docker exec " + (($app_name + "-new") | @sh) + " sh -c \"curl -sf http://localhost:" + ($container_port | @sh) + "/ || wget -q -O- http://localhost:" + ($container_port | @sh) + "/\" >/dev/null 2>&1; then healthy=1; break; fi; sleep 1; done",
            "if [ \"$healthy\" != \"1\" ]; then echo 'new container failed health check'; docker rm -f " + (($app_name + "-new") | @sh) + " 2>/dev/null || true; exit 1; fi",
            "docker stop " + ($app_name | @sh) + " 2>/dev/null || true && docker rm " + ($app_name | @sh) + " 2>/dev/null || true",
            "docker rm -f " + (($app_name + "-new") | @sh) + " 2>/dev/null || true",
            "docker run -d --name " + ($app_name | @sh) + " --restart unless-stopped -p " + ($host_port | @sh) + ":" + ($container_port | @sh) + " " + ($img | @sh),
            "docker image prune -f || true"
          ]}')
        aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Deploy app container to staging" \
          --parameters "$COMMANDS_JSON" \
          --output json > ssm-output.json
        COMMAND_ID=$(jq -r '.Command.CommandId' ssm-output.json)
        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'Status' --output text)
          if [ "$STATUS" = "Success" ]; then
            echo "Staging deploy succeeded"
            break
          fi
          if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
            echo "Staging deploy failed with status: $STATUS"
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'StandardErrorContent' --output text
            exit 1
          fi
          sleep 10
        done
        if [ "$STATUS" != "Success" ]; then
          echo "Staging deploy timed out"
          exit 1
        fi
    - name: Staging health check & smoke test
      shell: bash
      run: |
        set -euo pipefail
        PUBLIC_IP=$(aws ec2 describe-instances --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)
        if [ -z "$PUBLIC_IP" ] || [ "$PUBLIC_IP" = "None" ]; then
          echo "No public IP found for instance"
          exit 1
        fi
        echo "Probing http://$PUBLIC_IP:${{ env.HOST_PORT }}${{ env.HEALTHCHECK_PATH }}"
        curl -sf "http://$PUBLIC_IP:${{ env.HOST_PORT }}${{ env.HEALTHCHECK_PATH }}" || exit 1
        echo "Staging health check passed"
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.job }}-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  deploy-production:
    name: Deploy to production
    needs:
    - deploy-staging
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Deploy to production via SSM
      shell: bash
      run: |
        set -euo pipefail
        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        IMAGE="${{ env.REGISTRY }}/$IMAGE_REPO:${{ env.IMAGE_TAG }}"
        HOST_PORT="${{ env.HOST_PORT || '80' }}"
        CONTAINER_PORT="${{ env.CONTAINER_PORT || '80' }}"
        host_port="$HOST_PORT"
        container_port="$CONTAINER_PORT"
        COMMANDS_JSON=$(jq -n \
          --arg img "$IMAGE" \
          --arg registry "${{ env.REGISTRY }}" \
          --arg user "${{ secrets.GHCR_USER || github.actor }}" \
          --arg token "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" \
          --arg host_port "$HOST_PORT" \
          --arg container_port "$CONTAINER_PORT" \
          --arg app_name "${{ secrets.DEPLOYMENT_NAME }}" \
          '{commands: [
            "if ! command -v docker >/dev/null 2>&1; then if command -v dnf >/dev/null 2>&1; then dnf install -y docker; elif command -v yum >/dev/null 2>&1; then yum install -y docker; elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y docker.io; else echo \"No supported package manager found\"; exit 1; fi; fi; systemctl enable --now docker || service docker start",
            "for i in $(seq 1 15); do docker info >/dev/null 2>&1 && break || sleep 1; done",
            "echo " + ($token | @sh) + " | docker login " + ($registry | @sh) + " --username " + ($user | @sh) + " --password-stdin",
            "docker pull " + ($img | @sh),
            "docker rm -f " + (($app_name + "-new") | @sh) + " 2>/dev/null || true",
            "docker run -d --name " + (($app_name + "-new") | @sh) + " " + ($img | @sh),
            "healthy=0",
            "for i in $(seq 1 15); do if docker exec " + (($app_name + "-new") | @sh) + " sh -c \"curl -sf http://localhost:" + ($container_port | @sh) + "/ || wget -q -O- http://localhost:" + ($container_port | @sh) + "/\" >/dev/null 2>&1; then healthy=1; break; fi; sleep 1; done",
            "if [ \"$healthy\" != \"1\" ]; then echo 'new container failed health check'; docker rm -f " + (($app_name + "-new") | @sh) + " 2>/dev/null || true; exit 1; fi",
            "docker stop " + ($app_name | @sh) + " 2>/dev/null || true && docker rm " + ($app_name | @sh) + " 2>/dev/null || true",
            "docker rm -f " + (($app_name + "-new") | @sh) + " 2>/dev/null || true",
            "docker run -d --name " + ($app_name | @sh) + " --restart unless-stopped -p " + ($host_port | @sh) + ":" + ($container_port | @sh) + " " + ($img | @sh),
            "docker image prune -f || true"
          ]}')
        aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Deploy app container to production" \
          --parameters "$COMMANDS_JSON" \
          --output json > ssm-output.json
        COMMAND_ID=$(jq -r '.Command.CommandId' ssm-output.json)
        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'Status' --output text)
          if [ "$STATUS" = "Success" ]; then
            echo "Production deploy succeeded"
            break
          fi
          if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
            echo "Production deploy failed with status: $STATUS"
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'StandardErrorContent' --output text
            exit 1
          fi
          sleep 10
        done
        if [ "$STATUS" != "Success" ]; then
          echo "Production deploy timed out"
          exit 1
        fi
    - name: Production health check & smoke test
      shell: bash
      run: |
        set -euo pipefail
        PUBLIC_IP=$(aws ec2 describe-instances --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)
        if [ -z "$PUBLIC_IP" ] || [ "$PUBLIC_IP" = "None" ]; then
          echo "No public IP found for instance"
          exit 1
        fi
        echo "Probing http://$PUBLIC_IP:${{ env.HOST_PORT }}${{ env.HEALTHCHECK_PATH }}"
        curl -sf "http://$PUBLIC_IP:${{ env.HOST_PORT }}${{ env.HEALTHCHECK_PATH }}" || exit 1
        echo "Production health check passed"
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.job }}-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  rollback:
    name: Rollback on production deploy failure
    needs:
    - deploy-production
    if: failure() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Rollback to previous image via SSM
      shell: bash
      run: |
        set -euo pipefail
        PREV_SHA=$(git rev-parse HEAD~1)
        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        IMAGE="${{ env.REGISTRY }}/$IMAGE_REPO:$PREV_SHA"
        HOST_PORT="${{ env.HOST_PORT || '80' }}"
        CONTAINER_PORT="${{ env.CONTAINER_PORT || '80' }}"
        host_port="$HOST_PORT"
        container_port="$CONTAINER_PORT"
        COMMANDS_JSON=$(jq -n \
          --arg img "$IMAGE" \
          --arg registry "${{ env.REGISTRY }}" \
          --arg user "${{ secrets.GHCR_USER || github.actor }}" \
          --arg token "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" \
          --arg host_port "$HOST_PORT" \
          --arg container_port "$CONTAINER_PORT" \
          --arg app_name "${{ secrets.DEPLOYMENT_NAME }}" \
          '{commands: [
            "if ! command -v docker >/dev/null 2>&1; then if command -v dnf >/dev/null 2>&1; then dnf install -y docker; elif command -v yum >/dev/null 2>&1; then yum install -y docker; elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y docker.io; else echo \"No supported package manager found\"; exit 1; fi; fi; systemctl enable --now docker || service docker start",
            "for i in $(seq 1 15); do docker info >/dev/null 2>&1 && break || sleep 1; done",
            "echo " + ($token | @sh) + " | docker login " + ($registry | @sh) + " --username " + ($user | @sh) + " --password-stdin",
            "docker pull " + ($img | @sh),
            "docker rm -f " + (($app_name + "-new") | @sh) + " 2>/dev/null || true",
            "docker run -d --name " + (($app_name + "-new") | @sh) + " " + ($img | @sh),
            "healthy=0",
            "for i in $(seq 1 15); do if docker exec " + (($app_name + "-new") | @sh) + " sh -c \"curl -sf http://localhost:" + ($container_port | @sh) + "/ || wget -q -O- http://localhost:" + ($container_port | @sh) + "/\" >/dev/null 2>&1; then healthy=1; break; fi; sleep 1; done",
            "if [ \"$healthy\" != \"1\" ]; then echo 'rollback image failed health check'; docker rm -f " + (($app_name + "-new") | @sh) + " 2>/dev/null || true; exit 1; fi",
            "docker stop " + ($app_name | @sh) + " 2>/dev/null || true && docker rm " + ($app_name | @sh) + " 2>/dev/null || true",
            "docker rm -f " + (($app_name + "-new") | @sh) + " 2>/dev/null || true",
            "docker run -d --name " + ($app_name | @sh) + " --restart unless-stopped -p " + ($host_port | @sh) + ":" + ($container_port | @sh) + " " + ($img | @sh),
            "docker image prune -f || true"
          ]}')
        aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Rollback app container" \
          --parameters "$COMMANDS_JSON" \
          --output json > ssm-output.json
        COMMAND_ID=$(jq -r '.Command.CommandId' ssm-output.json)
        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'Status' --output text)
          if [ "$STATUS" = "Success" ]; then
            echo "Rollback succeeded"
            exit 0
          fi
          if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
            echo "Rollback failed with status: $STATUS"
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'StandardErrorContent' --output text
            exit 1
          fi
          sleep 10
        done
        echo "Rollback timed out"
        exit 1
  post-deploy:
    name: Post-deploy notification
    needs:
    - deploy-production
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
      packages: write
      statuses: write
    steps:
    - uses: actions/checkout@v4
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Post-deploy container status check via SSM
      shell: bash
      run: |
        set -euo pipefail
        COMMANDS_JSON=$(jq -n \
          --arg app_name "${{ secrets.DEPLOYMENT_NAME }}" \
          '{commands: [
            "if ! command -v docker >/dev/null 2>&1; then if command -v dnf >/dev/null 2>&1; then dnf install -y docker; elif command -v yum >/dev/null 2>&1; then yum install -y docker; elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y docker.io; else echo \"No supported package manager found\"; exit 1; fi; fi; systemctl enable --now docker || service docker start",
            "docker ps --filter name=" + ($app_name | @sh) + " --format \"{{.Names}} {{.Status}}\"",
            "docker inspect " + ($app_name | @sh) + " --format \"{{.Image}} {{.State.Status}}\" 2>/dev/null || true"
          ]}')
        aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Post-deploy container status check" \
          --parameters "$COMMANDS_JSON" \
          --output json > ssm-output.json
        COMMAND_ID=$(jq -r '.Command.CommandId' ssm-output.json)
        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'Status' --output text)
          if [ "$STATUS" = "Success" ]; then
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'StandardOutputContent' --output text
            exit 0
          fi
          if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'StandardErrorContent' --output text
            exit 1
          fi
          sleep 10
        done
        echo "Post-deploy status check timed out"
        exit 1
      if: ${{ env.ACT != 'true' }}
    - name: Notify deploy outcome
      if: always()
      uses: actions/github-script@v7.0.0
      with:
        script: |-
          const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
          await github.rest.repos.createCommitStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: context.sha,
            state: state,
            context: 'post-deploy',
            description: 'Post-deploy status check completed'
          });