name: CI
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch: null
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  AWS_REGION: us-east-1
  PYTHON_VERSION: '3.12'
  HOST_PORT: '80'
  CONTAINER_PORT: '8080'
  APP_URL: http://3.89.79.100
jobs:
