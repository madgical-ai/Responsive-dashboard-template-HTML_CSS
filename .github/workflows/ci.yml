name: CI/CD Pipeline
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}
  HOST_PORT: '80'
  CONTAINER_PORT: '80'
  HEALTHCHECK_PATH: /
  AWS_REGION: us-east-1
jobs:
  validate:
    name: Validate (lint & type-check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Execute lint
      run: docker run --rm -i hadolint/hadolint < Dockerfile
      if: ${{ env.ACT != 'true' }}
    - name: Execute type_check
      run: echo 'Executing type_check'
  test:
    name: Test (unit, integration, coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - validate
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Build test image
      run: docker build -t test-image .
    - name: Execute unit_test
      run: |
        IMAGE_NAME=test-image
        docker run --rm -d -p 80:80 --name test-app $IMAGE_NAME && sleep 2 && (curl -f http://localhost:80 || exit 1)
    - name: Execute integration_test
      run: echo 'Executing integration_test'
    - name: Execute coverage
      run: echo 'Executing coverage'
      if: ${{ env.ACT != 'true' }}
    - name: Upload test artifacts
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          coverage/
          test-results/
        if-no-files-found: ignore
  security:
    name: Security scan (SAST, deps, secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Execute dependency_scan
      run: |
        docker run --rm -v "$PWD:/project" -w /project aquasec/trivy:latest fs --severity HIGH,CRITICAL .
    - name: Execute secret_scan
      run: |
        docker run --rm -v "$PWD:/project" -w /project trufflesecurity/trufflehog:latest git file:///project --since-commit HEAD --only-verified --fail
      if: ${{ env.ACT != 'true' }}
    - name: Execute code_scan
      run: |
        docker run --rm -v "$PWD:/project" -w /project returntocorp/semgrep:latest semgrep --config=auto .
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.job }}-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  build:
    name: Build, push & scan image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - validate
    - test
    - security
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REPO: ${{ github.repository }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Normalize image repository
      run: |
        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        echo "IMAGE_REPO=$IMAGE_REPO" >> "$GITHUB_ENV"
    - name: Build and push image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:latest
    - name: Scan image
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
        format: table
        exit-code: '1'
        severity: CRITICAL,HIGH
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.job }}-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      IMAGE_REPO: ${{ github.repository }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Normalize image repository
      run: |
        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        echo "IMAGE_REPO=$IMAGE_REPO" >> "$GITHUB_ENV"
    - name: Deploy to staging via SSM
      shell: bash
      run: |
        set -euo pipefail

        IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}"
        HOST_PORT="${{ env.HOST_PORT || '80' }}"
        CONTAINER_PORT="${{ env.CONTAINER_PORT || '80' }}"
        host_port="$HOST_PORT"
        container_port="$CONTAINER_PORT"

        COMMANDS_JSON=$(jq -n \
          --arg img "$IMAGE" \
          --arg user "${{ secrets.GHCR_USER || github.actor }}" \
          --arg token "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" \
          --arg host_port "$HOST_PORT" \
          --arg container_port "$CONTAINER_PORT" \
          --arg app_name "app" \
          '{commands: [
            "set -e",
            "if ! command -v docker >/dev/null 2>&1; then if command -v dnf >/dev/null 2>&1; then dnf install -y docker; elif command -v yum >/dev/null 2>&1; then yum install -y docker; else apt-get update && apt-get install -y docker.io; fi; fi",
            "systemctl enable --now docker || service docker start || true",
            "for i in $(seq 1 15); do docker info >/dev/null 2>&1 && break || sleep 1; done",
            "echo " + ($token | @sh) + " | docker login ghcr.io -u " + ($user | @sh) + " --password-stdin",
            "docker pull " + ($img | @sh),
            "docker rm -f " + ($app_name + "-new") + " 2>/dev/null || true",
            "docker run -d --name " + ($app_name + "-new") + " -p " + ($host_port | @sh) + ":" + ($container_port | @sh) + " " + ($img | @sh),
            "for i in $(seq 1 15); do curl -sf http://localhost:" + ($host_port | @sh) + "/ >/dev/null 2>&1 && break || sleep 1; done",
            "if ! curl -sf http://localhost:" + ($host_port | @sh) + "/ >/dev/null 2>&1; then echo 'New container health check failed'; docker logs " + ($app_name + "-new") + " || true; exit 1; fi",
            "docker stop " + ($app_name) + " 2>/dev/null || true && docker rm " + ($app_name) + " 2>/dev/null || true",
            "docker rename " + ($app_name + "-new") + " " + ($app_name),
            "docker image prune -f || true"
          ]}')

        aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Deploy app container to staging" \
          --parameters "$COMMANDS_JSON" \
          --output json > ssm-output.json

        COMMAND_ID=$(jq -r '.Command.CommandId' ssm-output.json)
        echo "SSM Command ID: $COMMAND_ID"

        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" \
            --query 'Status' --output text 2>/dev/null || echo "Pending")
          echo "Deployment status: $STATUS"
          if [ "$STATUS" = "Success" ]; then
            echo "Deployment succeeded"
            exit 0
          elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
            echo "Deployment failed with status: $STATUS"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --region "${{ env.AWS_REGION }}" \
              --query 'StandardErrorContent' --output text || true
            exit 1
          fi
          sleep 10
        done

        echo "Deployment timed out"
        exit 1
    - name: Staging health check & smoke test
      shell: bash
      run: |
        set -euo pipefail

        IP=$(aws ec2 describe-instances \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --query 'Reservations[0].Instances[0].PublicIpAddress' \
          --output text)

        echo "Checking health at http://${IP}:${{ env.HOST_PORT }}${{ env.HEALTHCHECK_PATH }}"
        for i in $(seq 1 15); do
          if curl -sf "http://${IP}:${{ env.HOST_PORT }}${{ env.HEALTHCHECK_PATH }}" >/dev/null 2>&1; then
            echo "Health check passed"
            exit 0
          fi
          sleep 2
        done

        echo "Health check failed"
        exit 1
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.job }}-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  deploy-production:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - deploy-staging
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      IMAGE_REPO: ${{ github.repository }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Normalize image repository
      run: |
        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        echo "IMAGE_REPO=$IMAGE_REPO" >> "$GITHUB_ENV"
    - name: Deploy to production via SSM
      shell: bash
      run: |
        set -euo pipefail

        IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}"
        HOST_PORT="${{ env.HOST_PORT || '80' }}"
        CONTAINER_PORT="${{ env.CONTAINER_PORT || '80' }}"
        host_port="$HOST_PORT"
        container_port="$CONTAINER_PORT"

        COMMANDS_JSON=$(jq -n \
          --arg img "$IMAGE" \
          --arg user "${{ secrets.GHCR_USER || github.actor }}" \
          --arg token "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" \
          --arg host_port "$HOST_PORT" \
          --arg container_port "$CONTAINER_PORT" \
          --arg app_name "app" \
          '{commands: [
            "set -e",
            "if ! command -v docker >/dev/null 2>&1; then if command -v dnf >/dev/null 2>&1; then dnf install -y docker; elif command -v yum >/dev/null 2>&1; then yum install -y docker; else apt-get update && apt-get install -y docker.io; fi; fi",
            "systemctl enable --now docker || service docker start || true",
            "for i in $(seq 1 15); do docker info >/dev/null 2>&1 && break || sleep 1; done",
            "echo " + ($token | @sh) + " | docker login ghcr.io -u " + ($user | @sh) + " --password-stdin",
            "docker pull " + ($img | @sh),
            "docker rm -f " + ($app_name + "-new") + " 2>/dev/null || true",
            "docker run -d --name " + ($app_name + "-new") + " -p " + ($host_port | @sh) + ":" + ($container_port | @sh) + " " + ($img | @sh),
            "for i in $(seq 1 15); do curl -sf http://localhost:" + ($host_port | @sh) + "/ >/dev/null 2>&1 && break || sleep 1; done",
            "if ! curl -sf http://localhost:" + ($host_port | @sh) + "/ >/dev/null 2>&1; then echo 'New container health check failed'; docker logs " + ($app_name + "-new") + " || true; exit 1; fi",
            "docker stop " + ($app_name) + " 2>/dev/null || true && docker rm " + ($app_name) + " 2>/dev/null || true",
            "docker rename " + ($app_name + "-new") + " " + ($app_name),
            "docker image prune -f || true"
          ]}')

        aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Deploy app container to production" \
          --parameters "$COMMANDS_JSON" \
          --output json > ssm-output.json

        COMMAND_ID=$(jq -r '.Command.CommandId' ssm-output.json)
        echo "SSM Command ID: $COMMAND_ID"

        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" \
            --query 'Status' --output text 2>/dev/null || echo "Pending")
          echo "Deployment status: $STATUS"
          if [ "$STATUS" = "Success" ]; then
            echo "Deployment succeeded"
            exit 0
          elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
            echo "Deployment failed with status: $STATUS"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --region "${{ env.AWS_REGION }}" \
              --query 'StandardErrorContent' --output text || true
            exit 1
          fi
          sleep 10
        done

        echo "Deployment timed out"
        exit 1
    - name: Production health check & smoke test
      shell: bash
      run: |
        set -euo pipefail

        IP=$(aws ec2 describe-instances \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --query 'Reservations[0].Instances[0].PublicIpAddress' \
          --output text)

        echo "Checking health at http://${IP}:${{ env.HOST_PORT }}${{ env.HEALTHCHECK_PATH }}"
        for i in $(seq 1 15); do
          if curl -sf "http://${IP}:${{ env.HOST_PORT }}${{ env.HEALTHCHECK_PATH }}" >/dev/null 2>&1; then
            echo "Health check passed"
            exit 0
          fi
          sleep 2
        done

        echo "Health check failed"
        exit 1
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.job }}-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  rollback:
    name: Rollback on production deploy failure
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - deploy-production
    if: failure()
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      IMAGE_REPO: ${{ github.repository }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Normalize image repository
      run: |
        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        echo "IMAGE_REPO=$IMAGE_REPO" >> "$GITHUB_ENV"
    - name: Rollback to previous image via SSM
      shell: bash
      run: |
        set -euo pipefail

        PREV_SHA=$(git rev-parse HEAD~1)
        IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:${PREV_SHA}"
        HOST_PORT="${{ env.HOST_PORT || '80' }}"
        CONTAINER_PORT="${{ env.CONTAINER_PORT || '80' }}"
        host_port="$HOST_PORT"
        container_port="$CONTAINER_PORT"

        COMMANDS_JSON=$(jq -n \
          --arg img "$IMAGE" \
          --arg user "${{ secrets.GHCR_USER || github.actor }}" \
          --arg token "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" \
          --arg host_port "$HOST_PORT" \
          --arg container_port "$CONTAINER_PORT" \
          --arg app_name "app" \
          '{commands: [
            "set -e",
            "if ! command -v docker >/dev/null 2>&1; then if command -v dnf >/dev/null 2>&1; then dnf install -y docker; elif command -v yum >/dev/null 2>&1; then yum install -y docker; else apt-get update && apt-get install -y docker.io; fi; fi",
            "systemctl enable --now docker || service docker start || true",
            "for i in $(seq 1 15); do docker info >/dev/null 2>&1 && break || sleep 1; done",
            "echo " + ($token | @sh) + " | docker login ghcr.io -u " + ($user | @sh) + " --password-stdin",
            "docker pull " + ($img | @sh),
            "docker stop " + ($app_name) + " 2>/dev/null || true && docker rm " + ($app_name) + " 2>/dev/null || true",
            "docker run -d --name " + ($app_name) + " --restart unless-stopped -p " + ($host_port | @sh) + ":" + ($container_port | @sh) + " " + ($img | @sh),
            "for i in $(seq 1 15); do curl -sf http://localhost:" + ($host_port | @sh) + "/ >/dev/null 2>&1 && break || sleep 1; done",
            "if ! curl -sf http://localhost:" + ($host_port | @sh) + "/ >/dev/null 2>&1; then echo 'Rollback health check failed'; docker logs " + ($app_name) + " || true; exit 1; fi",
            "docker image prune -f || true"
          ]}')

        aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Rollback app container" \
          --parameters "$COMMANDS_JSON" \
          --output json > ssm-output.json

        COMMAND_ID=$(jq -r '.Command.CommandId' ssm-output.json)
        echo "SSM Command ID: $COMMAND_ID"

        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" \
            --query 'Status' --output text 2>/dev/null || echo "Pending")
          echo "Rollback status: $STATUS"
          if [ "$STATUS" = "Success" ]; then
            echo "Rollback succeeded"
            exit 0
          elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
            echo "Rollback failed with status: $STATUS"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --region "${{ env.AWS_REGION }}" \
              --query 'StandardErrorContent' --output text || true
            exit 1
          fi
          sleep 10
        done

        echo "Rollback timed out"
        exit 1
  post-deploy:
    name: Post-deploy notification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - deploy-production
    if: always()
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Post-deploy container status check
      shell: bash
      run: |-
        set -euo pipefail

        COMMANDS_JSON=$(jq -n \
          '{commands: [
                "if ! command -v docker >/dev/null 2>&1; then if command -v dnf >/dev/null 2>&1; then dnf install -y docker; elif command -v yum >/dev/null 2>&1; then yum install -y docker; elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y docker.io; fi; systemctl enable --now docker; fi",
        "set -e",
            "docker ps --filter name=app",
            "curl -sf http://localhost:${{ env.HOST_PORT }}${{ env.HEALTHCHECK_PATH }} && echo 'Container is healthy' || echo 'Container health check failed'"
          ]}')

        aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Post-deploy container status check" \
          --parameters "$COMMANDS_JSON" \
          --output json > ssm-output.json

        COMMAND_ID=$(jq -r '.Command.CommandId' ssm-output.json)
        echo "SSM Command ID: $COMMAND_ID"

        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" \
            --query 'Status' --output text 2>/dev/null || echo "Pending")
          echo "Post-deploy check status: $STATUS"
          if [ "$STATUS" = "Success" ]; then
            echo "Post-deploy check succeeded"
            exit 0
          elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
            echo "Post-deploy check failed with status: $STATUS"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --region "${{ env.AWS_REGION }}" \
              --query 'StandardErrorContent' --output text || true
            exit 1
          fi
          sleep 10
        done

        echo "Post-deploy check timed out"
        exit 1