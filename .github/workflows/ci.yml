name: CI/CD Pipeline
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
  packages: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}
  HOST_PORT: '80'
  CONTAINER_PORT: '80'
  HEALTHCHECK_PATH: /
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
jobs:
  validate:
    name: Validate (lint & type-check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Execute lint
      if: ${{ env.ACT != 'true' }}
      continue-on-error: true
      run: docker run --rm -i hadolint/hadolint < Dockerfile
    - name: Execute type_check
      run: echo 'Executing type_check'
  test:
    name: Test (unit, integration, coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Execute unit_test
      run: echo 'Executing unit_test'
    - name: Execute integration_test
      run: echo 'Executing integration_test'
    - name: Execute coverage
      run: echo 'Executing coverage'
      if: ${{ env.ACT != 'true' }}
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.job }}-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  security:
    name: Security scan (SAST, deps, secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Execute dependency_scan
      if: ${{ env.ACT != 'true' }}
      continue-on-error: true
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: fs
        scan-ref: .
        severity: HIGH,CRITICAL
        exit-code: '1'
    - name: Execute secret_scan
      if: ${{ env.ACT != 'true' }}
      continue-on-error: true
      run: |
        docker run --rm -v "$PWD:/pwd" ghcr.io/trufflesecurity/trufflehog:latest git file:///pwd --since-commit HEAD --only-verified --fail
    - name: Execute code_scan
      if: ${{ env.ACT != 'true' }}
      continue-on-error: true
      run: |
        docker run --rm -v "$PWD:/src" returntocorp/semgrep semgrep --config=auto /src
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.job }}-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  build:
    name: Build, push & scan image
    needs:
    - validate
    - test
    - security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Compute image repo
      run: echo "IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
    - name: Build and push image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:latest
    - name: Scan image
      if: ${{ env.ACT != 'true' }}
      continue-on-error: true
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
        format: table
        exit-code: '1'
        severity: CRITICAL,HIGH
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.job }}-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  deploy-staging:
    name: Deploy to staging
    needs:
    - build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Deploy to staging via SSM
      shell: bash
      run: |
        set -euo pipefail
        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        IMAGE="${{ env.REGISTRY }}/${IMAGE_REPO}:${{ env.IMAGE_TAG }}"
        COMMANDS_JSON=$(jq -n \
          --arg img "$IMAGE" \
          --arg user "${{ secrets.GHCR_USER || github.actor }}" \
          --arg token "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" \
          --arg host_port "${{ env.HOST_PORT }}" \
          --arg container_port "${{ env.CONTAINER_PORT }}" \
          --arg app_name "${{ secrets.DEPLOYMENT_NAME || 'app' }}" \
          '{commands: [
            "set -e",
            "if ! command -v docker >/dev/null 2>&1; then if command -v dnf >/dev/null 2>&1; then dnf install -y docker; elif command -v yum >/dev/null 2>&1; then yum install -y docker; else apt-get update && apt-get install -y docker.io; fi; fi",
            "systemctl enable --now docker || service docker start || true",
            "for i in $(seq 1 15); do docker info >/dev/null 2>&1 && break || sleep 1; done",
            "docker login ghcr.io -u " + ($user | @sh) + " -p " + ($token | @sh),
            "docker pull " + ($img | @sh),
            "docker rm -f " + ($app_name + "-new") + " 2>/dev/null || true",
            "docker run -d --name " + ($app_name + "-new") + " " + ($img | @sh),
            "HEALTH_OK=0",
            "for i in $(seq 1 15); do if docker exec " + ($app_name + "-new") + " sh -c '\''command -v curl >/dev/null 2>&1 && curl -f http://localhost:" + $container_port + " >/dev/null 2>&1 || command -v wget >/dev/null 2>&1 && wget -q -O - http://localhost:" + $container_port + " >/dev/null 2>&1'\''; then HEALTH_OK=1; break; fi; sleep 1; done",
            "if [ \"$HEALTH_OK\" != \"1\" ]; then echo \"New container health check failed\"; docker logs " + ($app_name + "-new") + " || true; exit 1; fi",
            "docker stop " + ($app_name) + " 2>/dev/null || true && docker rm " + ($app_name) + " 2>/dev/null || true",
            "docker rm -f " + ($app_name + "-new") + " 2>/dev/null || true",
            "docker run -d --name " + ($app_name) + " --restart unless-stopped -p " + ($host_port | @sh) + ":" + ($container_port | @sh) + " " + ($img | @sh),
            "docker image prune -f || true"
          ]}') 
        aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Deploy app container to staging" \
          --parameters "$COMMANDS_JSON" \
          --output json > ssm-output.json
        COMMAND_ID=$(jq -r '.Command.CommandId' ssm-output.json)
        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'Status' --output text)
          if [ "$STATUS" = "Success" ]; then
            echo "Deployment succeeded"
            exit 0
          elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
            echo "Deployment failed with status: $STATUS"
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'StandardErrorContent' --output text
            exit 1
          fi
          sleep 10
        done
        echo "Deployment timed out"
        exit 1
    - name: Get instance public IP
      id: get-ip
      run: |
        IP=$(aws ec2 describe-instances --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)
        echo "IP=$IP" >> $GITHUB_OUTPUT
    - name: Staging health check & smoke test
      run: |
        curl -f --retry 5 --retry-delay 5 --retry-connrefused "http://${{ steps.get-ip.outputs.IP }}:${{ env.HOST_PORT }}${{ env.HEALTHCHECK_PATH }}" || exit 1
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.job }}-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  deploy-production:
    name: Deploy to production
    needs:
    - deploy-staging
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Deploy to production via SSM
      shell: bash
      run: |
        set -euo pipefail
        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        IMAGE="${{ env.REGISTRY }}/${IMAGE_REPO}:${{ env.IMAGE_TAG }}"
        COMMANDS_JSON=$(jq -n \
          --arg img "$IMAGE" \
          --arg user "${{ secrets.GHCR_USER || github.actor }}" \
          --arg token "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" \
          --arg host_port "${{ env.HOST_PORT }}" \
          --arg container_port "${{ env.CONTAINER_PORT }}" \
          --arg app_name "${{ secrets.DEPLOYMENT_NAME || 'app' }}" \
          '{commands: [
            "set -e",
            "if ! command -v docker >/dev/null 2>&1; then if command -v dnf >/dev/null 2>&1; then dnf install -y docker; elif command -v yum >/dev/null 2>&1; then yum install -y docker; else apt-get update && apt-get install -y docker.io; fi; fi",
            "systemctl enable --now docker || service docker start || true",
            "for i in $(seq 1 15); do docker info >/dev/null 2>&1 && break || sleep 1; done",
            "docker login ghcr.io -u " + ($user | @sh) + " -p " + ($token | @sh),
            "docker pull " + ($img | @sh),
            "docker rm -f " + ($app_name + "-new") + " 2>/dev/null || true",
            "docker run -d --name " + ($app_name + "-new") + " " + ($img | @sh),
            "HEALTH_OK=0",
            "for i in $(seq 1 15); do if docker exec " + ($app_name + "-new") + " sh -c '\''command -v curl >/dev/null 2>&1 && curl -f http://localhost:" + $container_port + " >/dev/null 2>&1 || command -v wget >/dev/null 2>&1 && wget -q -O - http://localhost:" + $container_port + " >/dev/null 2>&1'\''; then HEALTH_OK=1; break; fi; sleep 1; done",
            "if [ \"$HEALTH_OK\" != \"1\" ]; then echo \"New container health check failed\"; docker logs " + ($app_name + "-new") + " || true; exit 1; fi",
            "docker stop " + ($app_name) + " 2>/dev/null || true && docker rm " + ($app_name) + " 2>/dev/null || true",
            "docker rm -f " + ($app_name + "-new") + " 2>/dev/null || true",
            "docker run -d --name " + ($app_name) + " --restart unless-stopped -p " + ($host_port | @sh) + ":" + ($container_port | @sh) + " " + ($img | @sh),
            "docker image prune -f || true"
          ]}') 
        aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Deploy app container to production" \
          --parameters "$COMMANDS_JSON" \
          --output json > ssm-output.json
        COMMAND_ID=$(jq -r '.Command.CommandId' ssm-output.json)
        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'Status' --output text)
          if [ "$STATUS" = "Success" ]; then
            echo "Deployment succeeded"
            exit 0
          elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
            echo "Deployment failed with status: $STATUS"
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'StandardErrorContent' --output text
            exit 1
          fi
          sleep 10
        done
        echo "Deployment timed out"
        exit 1
    - name: Get instance public IP
      id: get-ip
      run: |
        IP=$(aws ec2 describe-instances --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)
        echo "IP=$IP" >> $GITHUB_OUTPUT
    - name: Production health check & smoke test
      run: |
        curl -f --retry 5 --retry-delay 5 --retry-connrefused "http://${{ steps.get-ip.outputs.IP }}:${{ env.HOST_PORT }}${{ env.HEALTHCHECK_PATH }}" || exit 1
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.job }}-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  rollback:
    name: Rollback on production deploy failure
    needs:
    - deploy-production
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Rollback via SSM
      shell: bash
      run: |
        set -euo pipefail
        PREV_SHA=$(git rev-parse HEAD~1)
        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        IMAGE="${{ env.REGISTRY }}/${IMAGE_REPO}:${PREV_SHA}"
        COMMANDS_JSON=$(jq -n \
          --arg img "$IMAGE" \
          --arg user "${{ secrets.GHCR_USER || github.actor }}" \
          --arg token "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" \
          --arg host_port "${{ env.HOST_PORT }}" \
          --arg container_port "${{ env.CONTAINER_PORT }}" \
          --arg app_name "${{ secrets.DEPLOYMENT_NAME || 'app' }}" \
          '{commands: [
            "set -e",
            "docker login ghcr.io -u " + ($user | @sh) + " -p " + ($token | @sh),
            "docker pull " + ($img | @sh),
            "docker rm -f " + ($app_name + "-new") + " 2>/dev/null || true",
            "docker run -d --name " + ($app_name + "-new") + " " + ($img | @sh),
            "HEALTH_OK=0",
            "for i in $(seq 1 15); do if docker exec " + ($app_name + "-new") + " sh -c '\''command -v curl >/dev/null 2>&1 && curl -f http://localhost:" + $container_port + " >/dev/null 2>&1 || command -v wget >/dev/null 2>&1 && wget -q -O - http://localhost:" + $container_port + " >/dev/null 2>&1'\''; then HEALTH_OK=1; break; fi; sleep 1; done",
            "if [ \"$HEALTH_OK\" != \"1\" ]; then echo \"New container health check failed\"; docker logs " + ($app_name + "-new") + " || true; exit 1; fi",
            "docker stop " + ($app_name) + " 2>/dev/null || true && docker rm " + ($app_name) + " 2>/dev/null || true",
            "docker rm -f " + ($app_name + "-new") + " 2>/dev/null || true",
            "docker run -d --name " + ($app_name) + " --restart unless-stopped -p " + ($host_port | @sh) + ":" + ($container_port | @sh) + " " + ($img | @sh),
            "docker image prune -f || true"
          ]}') 
        aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Rollback app container to previous version" \
          --parameters "$COMMANDS_JSON" \
          --output json > ssm-output.json
        COMMAND_ID=$(jq -r '.Command.CommandId' ssm-output.json)
        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'Status' --output text)
          if [ "$STATUS" = "Success" ]; then
            echo "Rollback succeeded"
            exit 0
          elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
            echo "Rollback failed with status: $STATUS"
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'StandardErrorContent' --output text
            exit 1
          fi
          sleep 10
        done
        echo "Rollback timed out"
        exit 1
    - name: Get instance public IP
      id: get-ip
      run: |
        IP=$(aws ec2 describe-instances --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)
        echo "IP=$IP" >> $GITHUB_OUTPUT
    - name: Rollback health check
      run: |
        curl -f --retry 5 --retry-delay 5 --retry-connrefused "http://${{ steps.get-ip.outputs.IP }}:${{ env.HOST_PORT }}${{ env.HEALTHCHECK_PATH }}" || exit 1
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.job }}-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
