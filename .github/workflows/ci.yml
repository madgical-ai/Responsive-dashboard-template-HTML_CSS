name: CI
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
  PYTHON_VERSION: '3.12'
  HOST_PORT: '80'
  CONTAINER_PORT: '8080'
  APP_NAME: ${{ secrets.DEPLOYMENT_NAME || 'app' }}
jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Lint Dockerfile (hadolint)
      if: ${{ env.ACT != 'true' }}
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: Dockerfile
        failure-threshold: error
    - name: Validate project structure
      if: ${{ env.ACT != 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        test -f Dockerfile
        test -f .github/workflows/ci.yml
        echo "Project structure validated."
    - name: Type check (static runtime)
      if: ${{ env.ACT != 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "No typed runtime detected; validating Dockerfile contract instead."
        grep -qE '^EXPOSE' Dockerfile
        grep -qE '^(CMD|ENTRYPOINT)' Dockerfile
        echo "Dockerfile contract validated."
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.job }}-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Build test image
      if: ${{ env.ACT != 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        docker build -t ci-test:${{ github.sha }} .
   # - name: Run unit and integration tests
   #   if: ${{ env.ACT != 'true' }}
   #   shell: bash
   #   run: |
    #    set -euo pipefail
    #    docker rm -f ci-test >/dev/null 2>&1 || true
   #     docker run -d --name ci-test -p 8080:8080 ci-test:${{ github.sha }}
   #     ok=0
   #     for i in $(seq 1 15); do
   #       if curl -fsS http://localhost:8080/ >/dev/null 2>&1; then ok=1; break; fi
    #      sleep 2
   #     done
   #     if [ "$ok" -ne 1 ]; then
   #       echo "Container failed to serve traffic"
    #      docker logs ci-test || true
    #      docker rm -f ci-test || true
    #      exit 1
   #     fi
   #     echo "Integration smoke test passed"
   #     docker rm -f ci-test || true
    - name: Coverage report
      if: ${{ env.ACT != 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "No coverage tool configured for this project." > coverage-summary.txt
        cat coverage-summary.txt
    - name: Upload test artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-artifacts
        path: coverage-summary.txt
        if-no-files-found: ignore
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.job }}-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    #- name: Run Trivy dependency scan
    #  if: ${{ env.ACT != 'true' }}
    #  uses: aquasecurity/trivy-action@v0.36.0
    #  with:
    #    scan-type: fs
    #    scan-ref: .
    #    format: table
    #    exit-code: '1'
    #    severity: CRITICAL,HIGH
    #    ignore-unfixed: true
    #- name: Run Trivy config (code) scan
    #  if: ${{ env.ACT != 'true' }}
    #  uses: aquasecurity/trivy-action@v0.36.0
   #   with:
    #    scan-type: config
    #    scan-ref: .
    #    format: table
    #    exit-code: '1'
    #    severity: CRITICAL,HIGH
    #- name: Run Gitleaks secret scan
    #  if: ${{ env.ACT != 'true' }}
    #  uses: gitleaks/gitleaks-action@v2
   #   env:
     #   GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build-image:
    name: Build and Scan Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - validate
    - test
    - security-scan
   # if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set image name
      id: set-image
      shell: bash
      run: |
        set -euo pipefail
        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        echo "IMAGE=${{ env.REGISTRY }}/${IMAGE_REPO}" >> "$GITHUB_ENV"
        echo "image=${{ env.REGISTRY }}/${IMAGE_REPO}" >> "$GITHUB_OUTPUT"
    - name: Set up Docker Buildx
      if: ${{ env.ACT != 'true' }}
      uses: docker/setup-buildx-action@v3
    - name: Log in to GHCR
      if: ${{ env.ACT != 'true' }}
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push Docker image
      if: ${{ env.ACT != 'true' }}
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        cache-from: type=gha
        cache-to: type=gha,mode=max
        tags: |
          ${{ steps.set-image.outputs.image }}:${{ env.IMAGE_TAG }}
          ${{ steps.set-image.outputs.image }}:latest
   # - name: Scan image with Trivy
   #   if: ${{ env.ACT != 'true' }}
   #   uses: aquasecurity/trivy-action@v0.36.0
   #   with:
   #     image-ref: ${{ steps.set-image.outputs.image }}:${{ env.IMAGE_TAG }}
   #     format: table
   #     exit-code: '1'
   #     severity: CRITICAL,HIGH
    #    ignore-unfixed: true
    - name: Upload build artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: Dockerfile
        if-no-files-found: ignore
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.job }}-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-image
   # if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Configure AWS credentials
      if: ${{ env.ACT != 'true' }}
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Deploy container to EC2 via SSM
      if: ${{ env.ACT != 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        IMAGE="${{ env.REGISTRY }}/${IMAGE_REPO}:${{ env.IMAGE_TAG }}"
        COMMANDS_JSON=$(jq -n \
          --arg img "$IMAGE" \
          --arg user "${{ secrets.GHCR_USER || github.actor }}" \
          --arg token "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" \
          --arg host_port "${{ env.HOST_PORT }}" \
          --arg container_port "${{ env.CONTAINER_PORT }}" \
          --arg app_name "${{ env.APP_NAME }}" \
          '{
            commands: [
              "set -e",
              "if ! command -v docker >/dev/null 2>&1; then if command -v dnf >/dev/null 2>&1; then dnf install -y docker; elif command -v yum >/dev/null 2>&1; then yum install -y docker; elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y docker.io; else echo \"No supported package manager found\"; exit 1; fi; fi; systemctl enable --now docker || service docker start",
              "for i in $(seq 1 15); do docker info >/dev/null 2>&1 && break || sleep 1; done",
              "docker info >/dev/null 2>&1",
              ("echo " + ($token | @sh) + " | docker login ghcr.io -u " + ($user | @sh) + " --password-stdin"),
              ("docker pull " + ($img | @sh)),
              ("docker rm -f " + ($app_name | @sh) + "-new 2>/dev/null || true"),
              ("docker run -d --name " + ($app_name | @sh) + "-new " + ($img | @sh)),
              ("for i in $(seq 1 15); do docker exec " + ($app_name | @sh) + "-new sh -c " + (("curl -fsS http://localhost:" + $container_port + "/ || wget -qO- http://localhost:" + $container_port + "/") | @sh) + " >/dev/null 2>&1 && break || sleep 2; done"),
              ("docker exec " + ($app_name | @sh) + "-new sh -c " + (("curl -fsS http://localhost:" + $container_port + "/ || wget -qO- http://localhost:" + $container_port + "/") | @sh)),
              ("docker rename " + ($app_name | @sh) + " " + ($app_name | @sh) + "-prev 2>/dev/null || true"),
              ("docker stop " + ($app_name | @sh) + "-prev 2>/dev/null || true"),
              ("docker rm -f " + ($app_name | @sh) + "-new 2>/dev/null || true"),
              ("docker run -d --name " + ($app_name | @sh) + " --restart unless-stopped -p " + ($host_port | @sh) + ":" + ($container_port | @sh) + " " + ($img | @sh)),
              "docker image prune -f || true"
            ]
          }')
        aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Deploy app container" \
          --parameters "$COMMANDS_JSON" \
          --output json > ssm-output.json
        COMMAND_ID=$(jq -r '.Command.CommandId' ssm-output.json)
        echo "SSM Command ID: ${COMMAND_ID}"
        STATUS="Pending"
        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" \
            --query 'Status' --output text 2>/dev/null || echo "Pending")
          echo "Poll ${i}: ${STATUS}"
          case "$STATUS" in
            Success) echo "Deployment succeeded"; exit 0 ;;
            Failed|Cancelled|TimedOut)
              echo "SSM command failed with status ${STATUS}"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --region "${{ env.AWS_REGION }}" \
                --query 'StandardErrorContent' --output text || true
              exit 1 ;;
          esac
          sleep 10
        done
        echo "Timed out waiting for SSM command ${COMMAND_ID}"
        exit 1
    - name: Health check via SSM
      if: ${{ env.ACT != 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        COMMANDS_JSON=$(jq -n --arg hp "${{ env.HOST_PORT }}" '{commands: ["set -e", ("curl -fsS http://localhost:" + ($hp | @sh) + "/ >/dev/null || wget -qO- http://localhost:" + ($hp | @sh) + "/ >/dev/null")]}')
        aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Staging health check" \
          --parameters "$COMMANDS_JSON" \
          --output json > ssm-health.json
        COMMAND_ID=$(jq -r '.Command.CommandId' ssm-health.json)
        STATUS="Pending"
        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'Status' --output text 2>/dev/null || echo "Pending")
          case "$STATUS" in
            Success) echo "Health check passed"; exit 0 ;;
            Failed|Cancelled|TimedOut)
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'StandardErrorContent' --output text || true
              exit 1 ;;
          esac
          sleep 10
        done
        echo "Health check timed out"
        exit 1
    - name: Smoke test via SSM
      if: ${{ env.ACT != 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        COMMANDS_JSON=$(jq -n --arg hp "${{ env.HOST_PORT }}" '{commands: ["set -e", ("curl -fsS http://localhost:" + ($hp | @sh) + "/ >/dev/null || wget -qO- http://localhost:" + ($hp | @sh) + "/ >/dev/null")]}')
        aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Staging smoke test" \
          --parameters "$COMMANDS_JSON" \
          --output json > ssm-smoke.json
        COMMAND_ID=$(jq -r '.Command.CommandId' ssm-smoke.json)
        STATUS="Pending"
        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'Status' --output text 2>/dev/null || echo "Pending")
          case "$STATUS" in
            Success) echo "Smoke test passed"; exit 0 ;;
            Failed|Cancelled|TimedOut)
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'StandardErrorContent' --output text || true
              exit 1 ;;
          esac
          sleep 10
        done
        echo "Smoke test timed out"
        exit 1
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.job }}-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: deploy-staging
    #if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Configure AWS credentials
      if: ${{ env.ACT != 'true' }}
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Deploy container to EC2 via SSM
      if: ${{ env.ACT != 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        IMAGE="${{ env.REGISTRY }}/${IMAGE_REPO}:${{ env.IMAGE_TAG }}"
        COMMANDS_JSON=$(jq -n \
          --arg img "$IMAGE" \
          --arg user "${{ secrets.GHCR_USER || github.actor }}" \
          --arg token "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" \
          --arg host_port "${{ env.HOST_PORT }}" \
          --arg container_port "${{ env.CONTAINER_PORT }}" \
          --arg app_name "${{ env.APP_NAME }}" \
          '{
            commands: [
              "set -e",
              "if ! command -v docker >/dev/null 2>&1; then if command -v dnf >/dev/null 2>&1; then dnf install -y docker; elif command -v yum >/dev/null 2>&1; then yum install -y docker; elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y docker.io; else echo \"No supported package manager found\"; exit 1; fi; fi; systemctl enable --now docker || service docker start",
              "for i in $(seq 1 15); do docker info >/dev/null 2>&1 && break || sleep 1; done",
              "docker info >/dev/null 2>&1",
              ("echo " + ($token | @sh) + " | docker login ghcr.io -u " + ($user | @sh) + " --password-stdin"),
              ("docker pull " + ($img | @sh)),
              ("docker rm -f " + ($app_name | @sh) + "-new 2>/dev/null || true"),
              ("docker run -d --name " + ($app_name | @sh) + "-new " + ($img | @sh)),
              ("for i in $(seq 1 15); do docker exec " + ($app_name | @sh) + "-new sh -c " + (("curl -fsS http://localhost:" + $container_port + "/ || wget -qO- http://localhost:" + $container_port + "/") | @sh) + " >/dev/null 2>&1 && break || sleep 2; done"),
              ("docker exec " + ($app_name | @sh) + "-new sh -c " + (("curl -fsS http://localhost:" + $container_port + "/ || wget -qO- http://localhost:" + $container_port + "/") | @sh)),
              ("docker rename " + ($app_name | @sh) + " " + ($app_name | @sh) + "-prev 2>/dev/null || true"),
              ("docker stop " + ($app_name | @sh) + "-prev 2>/dev/null || true"),
              ("docker rm -f " + ($app_name | @sh) + "-new 2>/dev/null || true"),
              ("docker run -d --name " + ($app_name | @sh) + " --restart unless-stopped -p " + ($host_port | @sh) + ":" + ($container_port | @sh) + " " + ($img | @sh)),
              "docker image prune -f || true"
            ]
          }')
        aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Deploy app container" \
          --parameters "$COMMANDS_JSON" \
          --output json > ssm-output.json
        COMMAND_ID=$(jq -r '.Command.CommandId' ssm-output.json)
        echo "SSM Command ID: ${COMMAND_ID}"
        STATUS="Pending"
        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" \
            --query 'Status' --output text 2>/dev/null || echo "Pending")
          echo "Poll ${i}: ${STATUS}"
          case "$STATUS" in
            Success) echo "Deployment succeeded"; exit 0 ;;
            Failed|Cancelled|TimedOut)
              echo "SSM command failed with status ${STATUS}"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --region "${{ env.AWS_REGION }}" \
                --query 'StandardErrorContent' --output text || true
              exit 1 ;;
          esac
          sleep 10
        done
        echo "Timed out waiting for SSM command ${COMMAND_ID}"
        exit 1
    - name: Health check via SSM
      if: ${{ env.ACT != 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        COMMANDS_JSON=$(jq -n --arg hp "${{ env.HOST_PORT }}" '{commands: ["set -e", ("curl -fsS http://localhost:" + ($hp | @sh) + "/ >/dev/null || wget -qO- http://localhost:" + ($hp | @sh) + "/ >/dev/null")]}')
        aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Production health check" \
          --parameters "$COMMANDS_JSON" \
          --output json > ssm-health.json
        COMMAND_ID=$(jq -r '.Command.CommandId' ssm-health.json)
        STATUS="Pending"
        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'Status' --output text 2>/dev/null || echo "Pending")
          case "$STATUS" in
            Success) echo "Health check passed"; exit 0 ;;
            Failed|Cancelled|TimedOut)
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'StandardErrorContent' --output text || true
              exit 1 ;;
          esac
          sleep 10
        done
        echo "Health check timed out"
        exit 1
    - name: Smoke test via SSM
      if: ${{ env.ACT != 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        COMMANDS_JSON=$(jq -n --arg hp "${{ env.HOST_PORT }}" '{commands: ["set -e", ("curl -fsS http://localhost:" + ($hp | @sh) + "/ >/dev/null || wget -qO- http://localhost:" + ($hp | @sh) + "/ >/dev/null")]}')
        aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Production smoke test" \
          --parameters "$COMMANDS_JSON" \
          --output json > ssm-smoke.json
        COMMAND_ID=$(jq -r '.Command.CommandId' ssm-smoke.json)
        STATUS="Pending"
        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'Status' --output text 2>/dev/null || echo "Pending")
          case "$STATUS" in
            Success) echo "Smoke test passed"; exit 0 ;;
            Failed|Cancelled|TimedOut)
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'StandardErrorContent' --output text || true
              exit 1 ;;
          esac
          sleep 10
        done
        echo "Smoke test timed out"
        exit 1
    - name: Rollback on failure
      if: failure() && env.ACT != 'true'
      shell: bash
      run: |
        set -euo pipefail
        COMMANDS_JSON=$(jq -n --arg app_name "${{ env.APP_NAME }}" '{commands: [    "if ! command -v docker >/dev/null 2>&1; then if command -v dnf >/dev/null 2>&1; then dnf install -y docker; elif command -v yum >/dev/null 2>&1; then yum install -y docker; elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y docker.io; fi; systemctl enable --now docker; fi",
        "set -e", ("docker rm -f " + ($app_name | @sh) + " 2>/dev/null || true"), ("docker rename " + ($app_name | @sh) + "-prev " + ($app_name | @sh) + " 2>/dev/null || true"), ("docker start " + ($app_name | @sh) + " 2>/dev/null || true"), "docker ps"]}')
        aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Rollback to previous container" \
          --parameters "$COMMANDS_JSON" \
          --output json > ssm-rollback.json
        COMMAND_ID=$(jq -r '.Command.CommandId' ssm-rollback.json)
        echo "Rollback SSM Command ID: ${COMMAND_ID}"
        STATUS="Pending"
        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'Status' --output text 2>/dev/null || echo "Pending")
          case "$STATUS" in
            Success) echo "Rollback completed"; exit 0 ;;
            Failed|Cancelled|TimedOut)
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'StandardErrorContent' --output text || true
              exit 1 ;;
          esac
          sleep 10
        done
        echo "Rollback timed out"
        exit 1
    - name: Post deploy verification
      if: success() && env.ACT != 'true'
      shell: bash
      run: |-
        set -euo pipefail
        echo "Deployment complete."
        echo "Application is reachable at http://<instance-public-ip>:${HOST_PORT}/"
        echo "Health endpoint: /"
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
