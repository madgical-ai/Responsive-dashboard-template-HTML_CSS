name: CI/CD Pipeline
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  REGISTRY: ghcr.io
  IMAGE_TAG: latest
  HOST_PORT: '80'
  CONTAINER_PORT: '80'
  HEALTHCHECK_PATH: /
  AWS_REGION: ${{ secrets.AWS_REGION }}
jobs:
  validate:
    name: Validate (lint & type-check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Execute lint
      run: docker run --rm -i hadolint/hadolint < Dockerfile
      if: github.actor != 'nektos/act'
    - name: Execute type_check
      run: echo 'Executing type_check'
  test:
    name: Test (unit, integration, coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - validate
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Build test image
      run: docker build -t test-app-image .
    - name: Execute unit_test
      run: docker run --rm -d -p 80:80 --name test-app test-app-image && sleep 2 &&
        (curl -f http://localhost:80 || exit 1)
    - name: Execute integration_test
      run: echo 'Executing integration_test'
    - name: Execute coverage
      run: echo 'Executing coverage'
      if: github.actor != 'nektos/act'
    - name: Upload test artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          coverage/
          test-results/
        retention-days: 7
  security:
    name: Security scan (SAST, deps, secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Execute dependency_scan
      run: |
        docker run --rm -v "$PWD":/project aquasec/trivy:latest fs --severity HIGH,CRITICAL /project
    - name: Execute secret_scan
      run: |
        docker run --rm -v "$PWD":/repo trufflesecurity/trufflehog:latest git file:///repo --since-commit HEAD --only-verified --fail
      if: github.actor != 'nektos/act'
    - name: Execute code_scan
      run: |
        docker run --rm -v "$PWD":/src semgrep/semgrep:latest semgrep --config=auto /src
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.job }}-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  build:
    name: Build, push & scan image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - validate
    - test
    - security
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Compute lowercase image repository
      run: |
        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        echo "IMAGE_REPO=$IMAGE_REPO" >> "$GITHUB_ENV"
    - name: Build Docker image
      run: docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }} .
    - name: Scan image for vulnerabilities
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
        format: table
        exit-code: '1'
        severity: CRITICAL,HIGH
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Push image to GHCR
      run: |
        docker push ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
        docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }} ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:latest
        docker push ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:latest
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.job }}-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Deploy to staging via SSM
      shell: bash
      run: |
        set -euo pipefail

        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        IMAGE="${{ env.REGISTRY }}/${IMAGE_REPO}:${{ env.IMAGE_TAG }}"

        HOST_PORT="${{ env.HOST_PORT }}"
        CONTAINER_PORT="${{ env.CONTAINER_PORT }}"
        host_port="$HOST_PORT"
        container_port="$CONTAINER_PORT"

        COMMANDS_JSON=$(jq -n \
          --arg img "$IMAGE" \
          --arg user "${{ secrets.GHCR_USER || github.actor }}" \
          --arg token "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" \
          --arg host_port "$HOST_PORT" \
          --arg container_port "$CONTAINER_PORT" \
          --arg app_name "${{ secrets.DEPLOYMENT_NAME }}" \
          '{commands: [
            "set -e",
            "if ! command -v docker >/dev/null 2>&1; then if command -v dnf >/dev/null 2>&1; then dnf install -y docker; elif command -v yum >/dev/null 2>&1; then yum install -y docker; else apt-get update && apt-get install -y docker.io; fi; fi",
            "systemctl enable --now docker 2>/dev/null || service docker start 2>/dev/null || true",
            "for i in $(seq 1 15); do docker info >/dev/null 2>&1 && break || sleep 1; done",
            "echo " + ($user | @sh) + " | docker login " + ($img | split(":")[0] | split("/")[0] | @sh) + " -u " + ($user | @sh) + " --password-stdin",
            "docker pull " + ($img | @sh),
            "docker rm -f " + ($app_name + "-new" | @sh) + " 2>/dev/null || true",
            "docker run -d --name " + ($app_name + "-new" | @sh) + " " + ($img | @sh),
            "for i in $(seq 1 15); do docker exec " + ($app_name + "-new" | @sh) + " sh -c \"curl -sf http://localhost:" + ($container_port | @sh) + "/ || wget -q -O- http://localhost:" + ($container_port | @sh) + "/\" >/dev/null 2>&1 && break || sleep 1; done",
            "docker stop " + ($app_name | @sh) + " 2>/dev/null || true && docker rm " + ($app_name | @sh) + " 2>/dev/null || true",
            "docker rm -f " + ($app_name + "-new" | @sh) + " 2>/dev/null || true",
            "docker run -d --name " + ($app_name | @sh) + " --restart unless-stopped -p " + ($host_port | @sh) + ":" + ($container_port | @sh) + " " + ($img | @sh),
            "docker image prune -f || true"
          ]}')

        aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Deploy app container to staging" \
          --parameters "$COMMANDS_JSON" \
          --output json > ssm-output.json

        COMMAND_ID=$(jq -r '.Command.CommandId' ssm-output.json)

        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" \
            --query 'Status' \
            --output text)
          if [ "$STATUS" = "Success" ]; then
            echo "SSM command completed successfully"
            exit 0
          elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
            echo "SSM command failed with status: $STATUS"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --region "${{ env.AWS_REGION }}" \
              --query 'StandardErrorContent' \
              --output text
            exit 1
          fi
          sleep 10
        done

        echo "SSM command timed out waiting for completion"
        exit 1
    - name: Staging health check & smoke test
      shell: bash
      run: |
        set -euo pipefail
        IP=$(aws ec2 describe-instances \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --query 'Reservations[0].Instances[0].PublicIpAddress' \
          --output text)
        echo "Staging instance IP: $IP"
        for i in $(seq 1 15); do
          if curl -sf "http://${IP}:${{ env.HOST_PORT }}${{ env.HEALTHCHECK_PATH }}" >/dev/null 2>&1; then
            echo "Staging health check passed"
            exit 0
          fi
          sleep 5
        done
        echo "Staging health check failed"
        exit 1
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.job }}-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  deploy-production:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - deploy-staging
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Deploy to production via SSM
      shell: bash
      run: |
        set -euo pipefail

        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        IMAGE="${{ env.REGISTRY }}/${IMAGE_REPO}:${{ env.IMAGE_TAG }}"

        HOST_PORT="${{ env.HOST_PORT }}"
        CONTAINER_PORT="${{ env.CONTAINER_PORT }}"
        host_port="$HOST_PORT"
        container_port="$CONTAINER_PORT"

        COMMANDS_JSON=$(jq -n \
          --arg img "$IMAGE" \
          --arg user "${{ secrets.GHCR_USER || github.actor }}" \
          --arg token "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" \
          --arg host_port "$HOST_PORT" \
          --arg container_port "$CONTAINER_PORT" \
          --arg app_name "${{ secrets.DEPLOYMENT_NAME }}" \
          '{commands: [
            "set -e",
            "if ! command -v docker >/dev/null 2>&1; then if command -v dnf >/dev/null 2>&1; then dnf install -y docker; elif command -v yum >/dev/null 2>&1; then yum install -y docker; else apt-get update && apt-get install -y docker.io; fi; fi",
            "systemctl enable --now docker 2>/dev/null || service docker start 2>/dev/null || true",
            "for i in $(seq 1 15); do docker info >/dev/null 2>&1 && break || sleep 1; done",
            "echo " + ($user | @sh) + " | docker login " + ($img | split(":")[0] | split("/")[0] | @sh) + " -u " + ($user | @sh) + " --password-stdin",
            "docker pull " + ($img | @sh),
            "docker rm -f " + ($app_name + "-new" | @sh) + " 2>/dev/null || true",
            "docker run -d --name " + ($app_name + "-new" | @sh) + " " + ($img | @sh),
            "for i in $(seq 1 15); do docker exec " + ($app_name + "-new" | @sh) + " sh -c \"curl -sf http://localhost:" + ($container_port | @sh) + "/ || wget -q -O- http://localhost:" + ($container_port | @sh) + "/\" >/dev/null 2>&1 && break || sleep 1; done",
            "docker stop " + ($app_name | @sh) + " 2>/dev/null || true && docker rm " + ($app_name | @sh) + " 2>/dev/null || true",
            "docker rm -f " + ($app_name + "-new" | @sh) + " 2>/dev/null || true",
            "docker run -d --name " + ($app_name | @sh) + " --restart unless-stopped -p " + ($host_port | @sh) + ":" + ($container_port | @sh) + " " + ($img | @sh),
            "docker image prune -f || true"
          ]}')

        aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Deploy app container to production" \
          --parameters "$COMMANDS_JSON" \
          --output json > ssm-output.json

        COMMAND_ID=$(jq -r '.Command.CommandId' ssm-output.json)

        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" \
            --query 'Status' \
            --output text)
          if [ "$STATUS" = "Success" ]; then
            echo "SSM command completed successfully"
            exit 0
          elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
            echo "SSM command failed with status: $STATUS"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --region "${{ env.AWS_REGION }}" \
              --query 'StandardErrorContent' \
              --output text
            exit 1
          fi
          sleep 10
        done

        echo "SSM command timed out waiting for completion"
        exit 1
    - name: Production health check & smoke test
      shell: bash
      run: |
        set -euo pipefail
        IP=$(aws ec2 describe-instances \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --query 'Reservations[0].Instances[0].PublicIpAddress' \
          --output text)
        echo "Production instance IP: $IP"
        for i in $(seq 1 15); do
          if curl -sf "http://${IP}:${{ env.HOST_PORT }}${{ env.HEALTHCHECK_PATH }}" >/dev/null 2>&1; then
            echo "Production health check passed"
            exit 0
          fi
          sleep 5
        done
        echo "Production health check failed"
        exit 1
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.job }}-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  rollback:
    name: Rollback on production deploy failure
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - deploy-production
    if: failure()
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Rollback to previous version via SSM
      shell: bash
      run: |
        set -euo pipefail

        PREV_SHA=$(git rev-parse HEAD~1)
        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        IMAGE="${{ env.REGISTRY }}/${IMAGE_REPO}:${PREV_SHA}"

        HOST_PORT="${{ env.HOST_PORT }}"
        CONTAINER_PORT="${{ env.CONTAINER_PORT }}"
        host_port="$HOST_PORT"
        container_port="$CONTAINER_PORT"

        COMMANDS_JSON=$(jq -n \
          --arg img "$IMAGE" \
          --arg user "${{ secrets.GHCR_USER || github.actor }}" \
          --arg token "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" \
          --arg host_port "$HOST_PORT" \
          --arg container_port "$CONTAINER_PORT" \
          --arg app_name "${{ secrets.DEPLOYMENT_NAME }}" \
          '{commands: [
            "set -e",
            "if ! command -v docker >/dev/null 2>&1; then if command -v dnf >/dev/null 2>&1; then dnf install -y docker; elif command -v yum >/dev/null 2>&1; then yum install -y docker; else apt-get update && apt-get install -y docker.io; fi; fi",
            "systemctl enable --now docker 2>/dev/null || service docker start 2>/dev/null || true",
            "for i in $(seq 1 15); do docker info >/dev/null 2>&1 && break || sleep 1; done",
            "echo " + ($user | @sh) + " | docker login " + ($img | split(":")[0] | split("/")[0] | @sh) + " -u " + ($user | @sh) + " --password-stdin",
            "docker pull " + ($img | @sh),
            "docker stop " + ($app_name | @sh) + " 2>/dev/null || true && docker rm " + ($app_name | @sh) + " 2>/dev/null || true",
            "docker run -d --name " + ($app_name | @sh) + " --restart unless-stopped -p " + ($host_port | @sh) + ":" + ($container_port | @sh) + " " + ($img | @sh),
            "docker image prune -f || true"
          ]}')

        aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Rollback app container" \
          --parameters "$COMMANDS_JSON" \
          --output json > ssm-output.json

        COMMAND_ID=$(jq -r '.Command.CommandId' ssm-output.json)

        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" \
            --query 'Status' \
            --output text)
          if [ "$STATUS" = "Success" ]; then
            echo "Rollback completed successfully"
            exit 0
          elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
            echo "Rollback failed with status: $STATUS"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --region "${{ env.AWS_REGION }}" \
              --query 'StandardErrorContent' \
              --output text
            exit 1
          fi
          sleep 10
        done

        echo "Rollback timed out waiting for completion"
        exit 1
  post-deploy:
    name: Post-deploy notification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - deploy-production
    if: always()
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Post-deploy container status check
      shell: bash
      run: |-
        set -euo pipefail

        COMMANDS_JSON=$(jq -n \
          --arg app_name "${{ secrets.DEPLOYMENT_NAME }}" \
          '{commands: [
                "if ! command -v docker >/dev/null 2>&1; then if command -v dnf >/dev/null 2>&1; then dnf install -y docker; elif command -v yum >/dev/null 2>&1; then yum install -y docker; elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y docker.io; fi; systemctl enable --now docker; fi",
        "set -e",
            "docker ps --filter name=" + ($app_name | @sh) + " --format \"table {{.Names}}\\t{{.Status}}\\t{{.Ports}}\"",
            "docker inspect " + ($app_name | @sh) + " --format \"{{.State.Status}}\""
          ]}')

        aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Post-deploy container status check" \
          --parameters "$COMMANDS_JSON" \
          --output json > ssm-output.json

        COMMAND_ID=$(jq -r '.Command.CommandId' ssm-output.json)

        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" \
            --query 'Status' \
            --output text)
          if [ "$STATUS" = "Success" ]; then
            echo "Post-deploy status check completed"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --region "${{ env.AWS_REGION }}" \
              --query 'StandardOutputContent' \
              --output text
            exit 0
          elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
            echo "Post-deploy status check failed with status: $STATUS"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --region "${{ env.AWS_REGION }}" \
              --query 'StandardErrorContent' \
              --output text
            exit 1
          fi
          sleep 10
        done

        echo "Post-deploy status check timed out"
        exit 1
      if: github.actor != 'nektos/act'
