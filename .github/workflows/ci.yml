name: CI/CD
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch: null
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}
  AWS_REGION: ${{ secrets.AWS_REGION }}
  HOST_PORT: '80'
  CONTAINER_PORT: '8080'
  PYTHON_VERSION: '3.12'
jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Verify Dockerfile present
      run: |
        set -euo pipefail
        test -f Dockerfile
    #- name: Lint Dockerfile
    #  if: ${{ env.ACT != 'true' }}
    #  run: |
    #    set -euo pipefail
    #    docker run --rm -i hadolint/hadolint:latest --failure-threshold error - < Dockerfile
    - name: Upload artifacts
      if: ${{ env.ACT != 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: validate-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build test image
      run: |
        set -euo pipefail
        docker build -t ci-test-image:${{ github.sha }} .
    #- name: Run container smoke test
    #  if: ${{ env.ACT != 'true' }}
    #  run: |
    #    set -euo pipefail
    #    docker run -d --name ci-test -p 8080:8080 ci-test-image:${{ github.sha }}
    #    for i in $(seq 1 15); do
    #      if curl -fsS http://localhost:8080/ >/dev/null 2>&1; then break; fi
    #      sleep 2
    #    done
    #    curl -fsS http://localhost:8080/ >/dev/null
    #- name: Capture container logs
    #  if: always()
    #  run: |
    #    docker logs ci-test > container-test.log 2>&1 || true
    #    docker rm -f ci-test || true
    #- name: Upload test artifacts
    #  if: ${{ always() && env.ACT != 'true' }}
    #  uses: actions/upload-artifact@v4
    #  with:
    #    name: test-logs
    #    path: container-test.log
    #    if-no-files-found: ignore
    - name: Upload artifacts
      if: ${{ env.ACT != 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: test-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
   # - name: Scan for leaked secrets
   #   if: ${{ env.ACT != 'true' }}
   #   uses: gitleaks/gitleaks-action@v2
   #   env:
   #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
   #     GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
   # - name: Dependency and misconfiguration scan
   #   if: ${{ env.ACT != 'true' }}
   #   uses: aquasecurity/trivy-action@v0.36.0
   #   with:
   #     scan-type: fs
    #    scan-ref: .
   #     format: table
   #     exit-code: '1'
   #     severity: CRITICAL,HIGH
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - validate
    - test
    - security
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      }}
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Compute image reference
      id: image
      run: |
        set -euo pipefail
        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        echo "ref=${{ env.REGISTRY }}/$IMAGE_REPO:${{ env.IMAGE_TAG }}" >> "$GITHUB_OUTPUT"
    - name: Build container image
      run: |
        set -euo pipefail
        docker build -t "${{ steps.image.outputs.ref }}" .
    #- name: Scan container image for vulnerabilities
    #  if: ${{ env.ACT != 'true' }}
    #  uses: aquasecurity/trivy-action@v0.36.0
    #  with:
    #    image-ref: ${{ steps.image.outputs.ref }}
    #    format: table
    #    exit-code: '1'
    #    severity: CRITICAL,HIGH
    - name: Save image artifact
      run: |
        set -euo pipefail
        docker save "${{ steps.image.outputs.ref }}" | gzip > container-image.tar.gz
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: container-image
        path: container-image.tar.gz
        retention-days: 7
    - name: Upload artifacts
      if: ${{ env.ACT != 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - build
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      }}
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push container image
      run: |
        set -euo pipefail
        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        IMAGE="${{ env.REGISTRY }}/$IMAGE_REPO:${{ env.IMAGE_TAG }}"
        LATEST="${{ env.REGISTRY }}/$IMAGE_REPO:latest"
        docker build -t "$IMAGE" -t "$LATEST" .
        docker push "$IMAGE"
        docker push "$LATEST"
    - name: Upload artifacts
      if: ${{ env.ACT != 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: publish-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - publish
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      }}
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}



    - name: Diagnose SSM target
      shell: bash
      env:
        AWS_REGION: ${{ secrets.AWS_REGION }}
        EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
      run: |
        set -euo pipefail

        echo "=== AWS account ==="
        aws sts get-caller-identity

        echo "=== EC2 state ==="
        aws ec2 describe-instances \
          --region "$AWS_REGION" \
          --instance-ids "$EC2_INSTANCE_ID" \
          --query 'Reservations[].Instances[].{ID:InstanceId,State:State.Name}' \
          --output table

        echo "=== SSM registration ==="
        aws ssm describe-instance-information \
          --region "$AWS_REGION" \
          --filters "Key=InstanceIds,Values=$EC2_INSTANCE_ID" \
          --query 'InstanceInformationList[].{ID:InstanceId,PingStatus:PingStatus,Platform:PlatformName}' \
          --output table
    - name: Deploy container to EC2 via SSM
      shell: bash
      run: |
        set -euo pipefail
        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        IMAGE="${{ env.REGISTRY }}/$IMAGE_REPO:${{ env.IMAGE_TAG }}"
        COMMANDS_JSON=$(jq -n \
          --arg img "$IMAGE" \
          --arg user "${{ secrets.GHCR_USER || github.actor }}" \
          --arg token "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" \
          --arg host_port "${{ env.HOST_PORT }}" \
          --arg container_port "${{ env.CONTAINER_PORT }}" \
          --arg app_name "${{ secrets.DEPLOYMENT_NAME || 'app' }}" \
          '{commands: [
            "if ! command -v docker >/dev/null 2>&1; then if command -v dnf >/dev/null 2>&1; then dnf install -y docker; elif command -v yum >/dev/null 2>&1; then yum install -y docker; elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y docker.io; else echo \"No supported package manager found\"; exit 1; fi; fi; systemctl enable --now docker || service docker start",
            "set -e",
            "for i in $(seq 1 15); do docker info >/dev/null 2>&1 && break || sleep 1; done",
            "echo " + ($token | @sh) + " | docker login ghcr.io -u " + ($user | @sh) + " --password-stdin",
            "docker pull " + ($img | @sh),
            "docker rm -f " + ($app_name | @sh) + "-new 2>/dev/null || true",
            "docker run -d --name " + ($app_name | @sh) + "-new " + ($img | @sh),
            "for i in $(seq 1 15); do docker exec " + ($app_name | @sh) + "-new sh -c \"curl -fsS http://localhost:" + ($container_port | @sh) + "/ >/dev/null 2>&1 || wget -qO- http://localhost:" + ($container_port | @sh) + "/ >/dev/null 2>&1\" && break || sleep 2; done",
            "docker exec " + ($app_name | @sh) + "-new sh -c \"curl -fsS http://localhost:" + ($container_port | @sh) + "/ >/dev/null 2>&1 || wget -qO- http://localhost:" + ($container_port | @sh) + "/ >/dev/null 2>&1\"",
            "docker stop " + ($app_name | @sh) + " 2>/dev/null || true",
            "docker rm " + ($app_name | @sh) + " 2>/dev/null || true",
            "docker rm -f " + ($app_name | @sh) + "-new 2>/dev/null || true",
            "docker run -d --name " + ($app_name | @sh) + " --restart unless-stopped -p " + ($host_port | @sh) + ":" + ($container_port | @sh) + " " + ($img | @sh),
            "for i in $(seq 1 15); do curl -fsS http://localhost:" + ($host_port | @sh) + "/ >/dev/null 2>&1 || wget -qO- http://localhost:" + ($host_port | @sh) + "/ >/dev/null 2>&1 && break || sleep 2; done",
            "curl -fsS http://localhost:" + ($host_port | @sh) + "/ >/dev/null 2>&1 || wget -qO- http://localhost:" + ($host_port | @sh) + "/ >/dev/null 2>&1",
            "docker image prune -f || true"
          ]}')
        aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Deploy app container" \
          --parameters "$COMMANDS_JSON" \
          --output json > ssm-output.json
        COMMAND_ID=$(jq -r '.Command.CommandId' ssm-output.json)
        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'Status' --output text 2>/dev/null || echo "Pending")
          if [ "$STATUS" = "Success" ]; then
            echo "SSM command succeeded"
            exit 0
          fi
          if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
            echo "SSM command failed with status $STATUS"
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'StandardErrorContent' --output text || true
            exit 1
          fi
          sleep 10
        done
        echo "Timed out waiting for SSM command"
        exit 1
    - name: Wait for health endpoint
      shell: bash
      run: |
        set -euo pipefail
        IP=$(aws ec2 describe-instances --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query "Reservations[0].Instances[0].PublicIpAddress" --output text)
        for i in $(seq 1 12); do
          if curl -fsS "http://$IP:${{ env.HOST_PORT }}/" -o /dev/null; then exit 0; fi
          sleep 5
        done
        exit 1
    - name: Run smoke tests
      shell: bash
      run: |
        set -euo pipefail
        IP=$(aws ec2 describe-instances --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query "Reservations[0].Instances[0].PublicIpAddress" --output text)
        curl -fsS "http://$IP:${{ env.HOST_PORT }}/" -o /dev/null
    - name: Upload artifacts
      if: ${{ env.ACT != 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: deploy-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  rollback:
    name: Rollback
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - deploy
    if: ${{ failure() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      }}
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Roll back to previous image via SSM
      shell: bash
      run: |
        set -euo pipefail
        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        PREV_TAG="${{ vars.PREVIOUS_IMAGE || 'latest' }}"
        PREV_IMAGE="${{ env.REGISTRY }}/$IMAGE_REPO:$PREV_TAG"
        COMMANDS_JSON=$(jq -n \
          --arg img "$PREV_IMAGE" \
          --arg host_port "${{ env.HOST_PORT }}" \
          --arg container_port "${{ env.CONTAINER_PORT }}" \
          --arg app_name "${{ secrets.DEPLOYMENT_NAME || 'app' }}" \
          '{commands: [
            "if ! command -v docker >/dev/null 2>&1; then if command -v dnf >/dev/null 2>&1; then dnf install -y docker; elif command -v yum >/dev/null 2>&1; then yum install -y docker; elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y docker.io; else echo \"No supported package manager found\"; exit 1; fi; fi; systemctl enable --now docker || service docker start",
            "set -e",
            "docker stop " + ($app_name | @sh) + " 2>/dev/null || true",
            "docker rm " + ($app_name | @sh) + " 2>/dev/null || true",
            "docker run -d --name " + ($app_name | @sh) + " --restart unless-stopped -p " + ($host_port | @sh) + ":" + ($container_port | @sh) + " " + ($img | @sh)
          ]}')
        aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Rollback app container" \
          --parameters "$COMMANDS_JSON" \
          --output json > ssm-rollback.json
        COMMAND_ID=$(jq -r '.Command.CommandId' ssm-rollback.json)
        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'Status' --output text 2>/dev/null || echo "Pending")
          if [ "$STATUS" = "Success" ]; then
            echo "Rollback succeeded"
            exit 0
          fi
          if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
            echo "Rollback failed with status $STATUS"
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'StandardErrorContent' --output text || true
            exit 1
          fi
          sleep 10
        done
        echo "Timed out waiting for rollback SSM command"
        exit 1
    - name: Upload artifacts
      if: ${{ env.ACT != 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: rollback-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  post-deploy:
    name: Post Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - deploy
    if: ${{ success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      }}
    steps:
    - name: Report deployment completion
      run: 'echo "Deployment complete: ${{ github.repository }}@${{ github.sha }}"'
