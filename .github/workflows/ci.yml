name: CI
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}
  HOST_PORT: '80'
  CONTAINER_PORT: '80'
jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Lint Dockerfile
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: Dockerfile
        failure-threshold: error
    - name: Detect linter configuration
      id: detect-lint
      run: |
        if ls .eslintrc* eslint.config.* 2>/dev/null | grep -q .; then
          echo "found=true" >> "$GITHUB_OUTPUT"
        else
          echo "found=false" >> "$GITHUB_OUTPUT"
        fi
      if: ${{ env.ACT != 'true' }}
    - name: Set up Node.js
      if: steps.detect-lint.outputs.found == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Run linter
      if: ${{ env.ACT != 'true' && steps.detect-lint.outputs.found == 'true' }}
      run: npx --yes eslint .
    - name: Linter not configured
      if: steps.detect-lint.outputs.found != 'true'
      run: echo "No application linter configuration detected; only Dockerfile linting
        was performed."
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Detect test tooling
      id: detect-test
      run: |
        if [ -f package.json ] && grep -q '"test"' package.json; then
          echo "runner=npm" >> "$GITHUB_OUTPUT"
          echo "found=true" >> "$GITHUB_OUTPUT"
        elif [ -f Makefile ] && grep -qE '^test:' Makefile; then
          echo "runner=make" >> "$GITHUB_OUTPUT"
          echo "found=true" >> "$GITHUB_OUTPUT"
        else
          echo "found=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Set up Node.js
      if: steps.detect-test.outputs.runner == 'npm'
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Cache npm dependencies
      if: steps.detect-test.outputs.runner == 'npm' && hashFiles('**/package-lock.json')
        != ''
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-npm-
    - name: Install dependencies
      if: steps.detect-test.outputs.runner == 'npm'
      run: |
        if [ -f package-lock.json ]; then
          npm ci --no-audit --no-fund
        else
          npm install --no-audit --no-fund
        fi
    - name: Run unit and integration tests
      if: ${{ env.ACT != 'true' && steps.detect-test.outputs.found == 'true' && steps.detect-test.outputs.runner
        == 'npm' }}
      run: npm test -- --coverage
    - name: Run tests via make
      if: ${{ env.ACT != 'true' && steps.detect-test.outputs.found == 'true' && steps.detect-test.outputs.runner
        == 'make' }}
      run: make test
    - name: Tests not configured
      if: steps.detect-test.outputs.found != 'true'
      run: echo "No test framework or test target detected; skipping test execution."
    - name: Upload test and coverage artifacts
      if: always() && steps.detect-test.outputs.found == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          coverage/
          junit.xml
          test-results/
        if-no-files-found: ignore
        retention-days: 7
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: test-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  security-dependency-scan:
    name: Security - Dependency Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Scan filesystem for vulnerable dependencies
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: fs
        scan-ref: .
        scanners: vuln
        format: table
        severity: CRITICAL,HIGH
        exit-code: '1'
  security-secret-scan:
    name: Security - Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Scan for leaked secrets
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build:
    name: Build and Scan Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - validate
    - test
    - security-dependency-scan
    - security-secret-scan
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Resolve lowercase image name
      run: |
        echo "IMAGE_NAME=${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
    - name: Build Docker image
      run: |
        docker build \
          -t "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" \
          -t "${{ env.IMAGE_NAME }}:latest" \
          .
    - name: Scan built image for vulnerabilities
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: image
        image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        format: table
        severity: CRITICAL,HIGH
        exit-code: '1'
    - name: Save image to tarball
      run: docker save "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" -o /tmp/image.tar
    - name: Upload image artifact
      uses: actions/upload-artifact@v4
      with:
        name: docker-image
        path: /tmp/image.tar
        retention-days: 1
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  publish:
    name: Publish Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
    - name: Download image artifact
      uses: actions/download-artifact@v4
      with:
        name: docker-image
        path: /tmp
    - name: Load image
      run: docker load -i /tmp/image.tar
    - name: Resolve lowercase image name
      run: |
        echo "IMAGE_NAME=${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Push Docker image
      run: |
        docker push "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
        docker push "${{ env.IMAGE_NAME }}:latest"
      continue-on-error: false
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: publish-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  staging-validation:
    name: Staging - Container Health and Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
    - name: Download image artifact
      uses: actions/download-artifact@v4
      with:
        name: docker-image
        path: /tmp
    - name: Load image
      run: docker load -i /tmp/image.tar
    - name: Resolve lowercase image name
      run: |
        echo "IMAGE_NAME=${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
    - name: Run container
      run: |
        docker run -d --name app-staging \
          -p "${{ env.HOST_PORT }}:${{ env.CONTAINER_PORT }}" \
          "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
    - name: Wait for health endpoint
      run: |
        for i in $(seq 1 30); do
          if curl -fsS "http://localhost:${{ env.HOST_PORT }}/healthz"; then
            echo "Health check passed"
            exit 0
          fi
          sleep 2
        done
        echo "Health check failed; container logs:"
        docker logs app-staging || true
        exit 1
    - name: Smoke test homepage
      run: curl -fsS "http://localhost:${{ env.HOST_PORT }}/" > /dev/null
    - name: Stop and remove container
      if: always()
      run: |
        docker stop app-staging || true
        docker rm app-staging || true
    - name: Print container logs on failure
      if: failure()
      run: docker logs app-staging || true
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: staging-validation-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn