name: CI
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch: null
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  REGISTRY: ghcr.io
  IMAGE_TAG: latest
  HOST_PORT: '80'
  # Fallback container port; will be overridden by detection step
  CONTAINER_PORT: '8080'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Lint static assets
      run: echo 'No lint tool declared for static HTML/CSS; skipping lint.'
      if: ${{ env.ACT != 'true' }}
    - name: Type check
      run: echo 'No TypeScript or type-check tooling declared; skipping type check.'
    - name: Run unit tests
      run: echo 'No unit test framework declared; skipping unit tests.'
    - name: Run integration tests
      run: echo 'No integration test suite declared; skipping integration tests.'
    - name: Collect coverage
      run: echo 'No coverage tool declared; skipping coverage collection.'
      if: ${{ env.ACT != 'true' }}
    - name: Upload validate artifacts
      uses: actions/upload-artifact@v4
      with:
        name: validate-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Scan for secrets with TruffleHog
      if: ${{ env.ACT != 'true' }}
      uses: trufflesecurity/trufflehog@v3.0.0
      with:
        path: .
        fail: 'true'
    - name: Check for JavaScript/TypeScript source files
      id: js_check
      run: |
        if find . -type f \( -name '*.js' -o -name '*.jsx' -o -name '*.ts' -o -name '*.tsx' \) \
          -not -path './node_modules/*' -not -path './dist/*' | grep -q .; then
          echo "has_js=true" >> $GITHUB_OUTPUT
        else
          echo "has_js=false" >> $GITHUB_OUTPUT
        fi
    - name: Initialize CodeQL
      if: steps.js_check.outputs.has_js == 'true' && env.ACT != 'true'
      uses: github/codeql-action/init@v3
      with:
        languages: javascript
    - name: Perform CodeQL Analysis
      if: steps.js_check.outputs.has_js == 'true' && env.ACT != 'true'
      uses: github/codeql-action/analyze@v3
  build:
    needs:
    - validate
    - security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      packages: write
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.GHCR_USER }}
        password: ${{ secrets.GHCR_TOKEN }}
    - name: Compute image name
      run: |
        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        echo "IMAGE=${{ env.REGISTRY }}/${IMAGE_REPO}:${{ env.IMAGE_TAG }}" >> $GITHUB_ENV
    - name: Build Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: false
        load: true
        tags: ${{ env.IMAGE }}
    - name: Push Docker image
      run: docker push "${{ env.IMAGE }}"
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
      packages: write
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    # NEW STEP: Detect the actual webserver port from the Dockerfile
    - name: Detect container port
      id: detect_port
      run: |
        if [ -f Dockerfile ]; then
          # Extract the first EXPOSE port (most common pattern)
          PORT=$(grep -i '^EXPOSE' Dockerfile | awk '{print $2}' | head -n1)
          if [ -z "$PORT" ]; then
            echo "No EXPOSE directive found in Dockerfile, defaulting to 8080"
            PORT=8080
          fi
        else
          echo "Dockerfile not found, defaulting to 8080"
          PORT=8080
        fi
        echo "Detected container port: $PORT"
        echo "CONTAINER_PORT=$PORT" >> $GITHUB_ENV
    - name: Deploy to EC2 via SSM
      shell: bash
      run: |
        set -euo pipefail
        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        IMAGE="${{ env.REGISTRY }}/${IMAGE_REPO}:${{ env.IMAGE_TAG }}"
        COMMANDS_JSON=$(jq -n \
          --arg img "$IMAGE" \
          --arg user "${{ secrets.GHCR_USER || github.actor }}" \
          --arg token "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" \
          --arg host_port "${{ env.HOST_PORT }}" \
          --arg container_port "${{ env.CONTAINER_PORT }}" \
          --arg app_name "${{ secrets.DEPLOYMENT_NAME || 'app' }}" \
          '{commands: ["set -e", ("if ! command -v docker >/dev/null 2>&1; then if command -v dnf >/dev/null 2>&1; then dnf install -y docker; elif command -v yum >/dev/null 2>&1; then yum install -y docker; elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y docker.io; else echo \"No supported package manager found\"; exit 1; fi; fi"), ("systemctl enable --now docker || service docker start"), ("for i in $(seq 1 15); do docker info >/dev/null 2>&1 && break || sleep 1; done"), ("echo " + ($token | @sh) + " | docker login ghcr.io -u " + ($user | @sh) + " --password-stdin"), ("docker pull " + ($img | @sh)), ("docker rm -f " + ($app_name | @sh) + "-new 2>/dev/null || true"), ("docker run -d --name " + ($app_name | @sh) + "-new " + ($img | @sh)), ("for i in $(seq 1 15); do docker exec " + ($app_name | @sh) + "-new sh -c \"command -v curl >/dev/null 2>&1 && curl -sf http://localhost:" + ($container_port | @sh) + "/ >/dev/null 2>&1 || wget -q -O- http://localhost:" + ($container_port | @sh) + "/ >/dev/null 2>&1\" && break || sleep 1; done"), ("docker stop " + ($app_name | @sh) + " 2>/dev/null || true && docker rm " + ($app_name | @sh) + " 2>/dev/null || true"), ("docker rm -f " + ($app_name | @sh) + "-new 2>/dev/null || true"), ("docker run -d --name " + ($app_name | @sh) + " -p " + ($host_port | @sh) + ":" + ($container_port | @sh) + " --restart unless-stopped " + ($img | @sh)), ("docker image prune -f || true")]}')
        aws ssm send-command --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --document-name "AWS-RunShellScript" --comment "Deploy app container" --parameters "$COMMANDS_JSON" --output json > ssm-output.json
        COMMAND_ID=$(jq -r '.Command.CommandId' ssm-output.json)
        for i in $(seq 1 30); do
          status=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'Status' --output text)
          if [ "$status" == "Success" ]; then
            echo "Deployment succeeded"
            break
          elif [ "$status" == "Failed" ] || [ "$status" == "Cancelled" ] || [ "$status" == "TimedOut" ]; then
            error=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'StandardErrorContent' --output text)
            echo "Deployment failed with error: $error" >&2
            exit 1
          else
            sleep 10
          fi
        done
        echo "Deployment command finished"
    - name: Get EC2 public IP
      id: ec2_ip
      run: |
        PUBLIC_IP=$(aws ec2 describe-instances --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)
        echo "PUBLIC_IP=$PUBLIC_IP" >> $GITHUB_ENV
    - name: Check health endpoint
      run: curl -f http://${{ env.PUBLIC_IP }}:${{ env.HOST_PORT }}/ || exit 1
    - name: Run smoke test
      run: curl -sSf -o /dev/null -w '%{http_code}' http://${{ env.PUBLIC_IP }}:${{ env.HOST_PORT }}/ | grep -q 200
    - name: Rollback to previous image
      if: failure()
      shell: bash
      run: |
        set -euo pipefail
        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        IMAGE="${{ env.REGISTRY }}/${IMAGE_REPO}:${{ env.IMAGE_TAG }}"
        COMMANDS_JSON=$(jq -n \
          --arg img "$IMAGE" \
          --arg user "${{ secrets.GHCR_USER || github.actor }}" \
          --arg token "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" \
          --arg host_port "${{ env.HOST_PORT }}" \
          --arg container_port "${{ env.CONTAINER_PORT }}" \
          --arg app_name "${{ secrets.DEPLOYMENT_NAME || 'app' }}" \
          '{commands: ["set -e", ("echo " + ($token | @sh) + " | docker login ghcr.io -u " + ($user | @sh) + " --password-stdin"), ("docker pull " + ($img | @sh)), ("docker rm -f " + ($app_name | @sh) + " 2>/dev/null || true"), ("docker run -d --name " + ($app_name | @sh) + " -p " + ($host_port | @sh) + ":" + ($container_port | @sh) + " --restart unless-stopped " + ($img | @sh))]}')
        aws ssm send-command --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --document-name "AWS-RunShellScript" --comment "Rollback app container" --parameters "$COMMANDS_JSON" --output json > ssm-rollback-output.json
        COMMAND_ID=$(jq -r '.Command.CommandId' ssm-rollback-output.json)
        for i in $(seq 1 30); do
          status=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'Status' --output text)
          if [ "$status" == "Success" ]; then
            echo "Rollback succeeded"
            break
          elif [ "$status" == "Failed" ] || [ "$status" == "Cancelled" ] || [ "$status" == "TimedOut" ]; then
            error=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'StandardErrorContent' --output text)
            echo "Rollback failed with error: $error" >&2
            exit 1
          else
            sleep 10
          fi
        done
    - name: Post-deploy verification
      run: echo 'Post-deploy steps not defined; skipping.'
    - name: Upload deploy artifacts
      uses: actions/upload-artifact@v4
      with:
        name: deploy-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn