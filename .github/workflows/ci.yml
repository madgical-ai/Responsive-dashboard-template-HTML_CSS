name: CI
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch: null
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  REGISTRY: ghcr.io
  IMAGE_TAG: latest
  AWS_REGION: us-east-1
  HOST_PORT: '80'
  CONTAINER_PORT: '8080'
jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Lint Dockerfile
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: Dockerfile
        failure-threshold: error
    - name: Validate workflow YAML
      if: ${{ env.ACT != 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        python3 -c "import yaml; yaml.safe_load(open('.github/workflows/ci.yml'))"
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build test image
      shell: bash
      run: |
        set -euo pipefail
        docker build -t ci-test:local .
    # - name: Run container integration smoke test
    #   if: ${{ env.ACT != 'true' }}
    #   shell: bash
    #   run: |
    #     set -euo pipefail
    #     docker run -d --name ci-test -p 8080:8080 ci-test:local
    #     for i in $(seq 1 15); do
    #       if curl -fsS http://localhost:8080/ >/dev/null 2>&1; then
    #         break
    #       fi
    #       sleep 2
    #     done
    #     curl -fsS http://localhost:8080/
    #     docker rm -f ci-test
    # - name: Upload test artifacts
    #   if: ${{ always() && env.ACT != 'true' }}
    #   uses: actions/upload-artifact@v4
    #   with:
    #     name: test-artifacts
    #     path: Dockerfile
    #     if-no-files-found: ignore
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.job }}-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    # - name: Run Trivy filesystem scan
    #   uses: aquasecurity/trivy-action@v0.36.0
    #   with:
    #     scan-type: fs
    #     scan-ref: .
    #     format: sarif
    #     output: trivy-results.sarif
    #     exit-code: '1'
    #     severity: HIGH,CRITICAL
    #     ignore-unfixed: 'true'
    # - name: Run Gitleaks secret scan
    #   uses: gitleaks/gitleaks-action@v2
    #   env:
    #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    #   with:
    #     args: --verbose --redact
    # - name: Run Semgrep code scan
    #   uses: semgrep/semgrep-action@v1
    #   with:
    #     config: auto
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - validate
    - test
    - security
    # if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set lowercase image name
      id: image
      shell: bash
      run: |
        set -euo pipefail
        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        IMAGE_NAME="${{ env.REGISTRY }}/${IMAGE_REPO}"
        echo "IMAGE_NAME=${IMAGE_NAME}" >> "$GITHUB_ENV"
        echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build Docker image
      shell: bash
      run: |
        set -euo pipefail
        docker buildx build \
          --load \
          --cache-from type=gha \
          --cache-to type=gha,mode=max \
          -t "${IMAGE_NAME}:${{ env.IMAGE_TAG }}" \
          -t "${IMAGE_NAME}:${{ github.sha }}" \
          .
    # - name: Scan Docker image with Trivy
    #   uses: aquasecurity/trivy-action@v0.36.0
    #   with:
    #     scan-type: image
    #     image-ref: ${{ steps.image.outputs.image_name }}:${{ github.sha }}
    #     format: table
    #     exit-code: '1'
    #     severity: CRITICAL,HIGH
    #     ignore-unfixed: 'true'
    - name: Upload build artifacts
      if: ${{ always() && env.ACT != 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: Dockerfile
        if-no-files-found: ignore
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.job }}-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - build
    # if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set lowercase image name
      id: image
      shell: bash
      run: |
        set -euo pipefail
        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        IMAGE_NAME="${{ env.REGISTRY }}/${IMAGE_REPO}"
        echo "IMAGE_NAME=${IMAGE_NAME}" >> "$GITHUB_ENV"
        echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        cache-from: type=gha
        cache-to: type=gha,mode=max
        tags: |
          ${{ steps.image.outputs.image_name }}:${{ env.IMAGE_TAG }}
          ${{ steps.image.outputs.image_name }}:${{ github.sha }}
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.job }}-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  deploy-staging:
    name: Deploy (Staging)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - publish
  #  if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Deploy container via SSM
      shell: bash
      run: |
        set -euo pipefail
        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        IMAGE="${{ env.REGISTRY }}/${IMAGE_REPO}:${{ env.IMAGE_TAG }}"
        COMMANDS_JSON=$(jq -n \
          --arg img "$IMAGE" \
          --arg user "${{ secrets.GHCR_USER || github.actor }}" \
          --arg token "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" \
          --arg host_port "${{ env.HOST_PORT }}" \
          --arg container_port "${{ env.CONTAINER_PORT }}" \
          --arg app_name "${{ secrets.DEPLOYMENT_NAME }}" \
          '{
            commands: [
              "set -e",
          
              "if ! command -v docker >/dev/null 2>&1; then if command -v dnf >/dev/null 2>&1; then dnf install -y docker; elif command -v yum >/dev/null 2>&1; then yum install -y docker; elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y docker.io; else echo Docker installation unsupported; exit 1; fi; fi",
              "systemctl enable --now docker",
          
              ("echo " + ($token | @sh) + " | docker login ghcr.io -u " + ($user | @sh) + " --password-stdin"),
              ("docker pull " + ($img | @sh)),
          
              # Remove stale temporary container
              ("docker rm -f " + ($app_name | @sh) + "-new 2>/dev/null || true"),
          
              # Start the new container without publishing a host port
              ("docker run -d --name " + ($app_name | @sh) + "-new " + ($img | @sh)),
          
              # Check that the application responds inside the container
              ("for i in $(seq 1 15); do docker exec " + ($app_name | @sh) + "-new sh -c " + (("curl -fsS http://localhost:" + $container_port + "/ || wget -qO- http://localhost:" + $container_port + "/") | @sh) + " >/dev/null 2>&1 && exit 0; sleep 2; done; echo Application health check failed; exit 1"),
          
              # Stop and remove the old application
              ("docker rm -f " + ($app_name | @sh) + " 2>/dev/null || true"),
          
              # Remove containers publishing the configured host port
              ("docker ps --filter " + ("publish=" + $host_port | @sh) + " -q | xargs -r docker rm -f"),
          
              # Remove the temporary container
              ("docker rm -f " + ($app_name | @sh) + "-new 2>/dev/null || true"),
          
              "sleep 2",
          
              # Check whether another host process still owns the port
              ("if command -v ss >/dev/null 2>&1; then ss -ltnp " + ("sport = :" + $host_port | @sh) + "; fi"),
          
              # Start the final application container
              ("docker run -d --name " + ($app_name | @sh) + " --restart unless-stopped -p " + ($host_port | @sh) + ":" + ($container_port | @sh) + " " + ($img | @sh)),
          
              "docker image prune -f || true"
            ]
          }')
        aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Deploy app container" \
          --parameters "$COMMANDS_JSON" \
          --output json > ssm-output.json
        COMMAND_ID=$(jq -r '.Command.CommandId' ssm-output.json)
        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" \
            --query 'Status' --output text 2>/dev/null || echo "Pending")
          if [ "$STATUS" = "Success" ]; then
            echo "Deployment succeeded"
            exit 0
          fi
          if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
            echo "Deployment failed with status $STATUS"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --region "${{ env.AWS_REGION }}" \
              --query 'StandardErrorContent' --output text || true
            exit 1
          fi
          sleep 10
        done
        echo "Timed out waiting for SSM command"
        exit 1
    - name: Staging health check
      shell: bash
      run: |
        set -euo pipefail
        PUBLIC_DNS=$(aws ec2 describe-instances \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --query "Reservations[0].Instances[0].PublicDnsName" \
          --output text)
        curl -f --retry 10 --retry-delay 5 --retry-connrefused "http://${PUBLIC_DNS}/"
    - name: Staging smoke test
      shell: bash
      run: |
        set -euo pipefail
        PUBLIC_DNS=$(aws ec2 describe-instances \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --query "Reservations[0].Instances[0].PublicDnsName" \
          --output text)
        curl -f "http://${PUBLIC_DNS}/"
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.job }}-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  deploy-production:
    name: Deploy (Production)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - deploy-staging
    #if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Deploy container via SSM
      shell: bash
      run: |
        set -euo pipefail
        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        IMAGE="${{ env.REGISTRY }}/${IMAGE_REPO}:${{ env.IMAGE_TAG }}"
        COMMANDS_JSON=$(jq -n \
          --arg img "$IMAGE" \
          --arg user "${{ secrets.GHCR_USER || github.actor }}" \
          --arg token "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" \
          --arg host_port "${{ env.HOST_PORT }}" \
          --arg container_port "${{ env.CONTAINER_PORT }}" \
          --arg app_name "${{ secrets.DEPLOYMENT_NAME }}" \
          '{
            commands: [
              "set -e",
    
              "if ! command -v docker >/dev/null 2>&1; then if command -v dnf >/dev/null 2>&1; then dnf install -y docker; elif command -v yum >/dev/null 2>&1; then yum install -y docker; elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y docker.io; else echo Docker installation unsupported; exit 1; fi; fi",
              "systemctl enable --now docker",
    
              ("echo " + ($token | @sh) + " | docker login ghcr.io -u " + ($user | @sh) + " --password-stdin"),
              ("docker pull " + ($img | @sh)),
    
              ("docker rm -f " + ($app_name | @sh) + "-new 2>/dev/null || true"),
    
              ("docker run -d --name " + ($app_name | @sh) + "-new " + ($img | @sh)),
    
              ("for i in $(seq 1 15); do docker exec " + ($app_name | @sh) + "-new sh -c " + (("curl -fsS http://localhost:" + $container_port + "/ || wget -qO- http://localhost:" + $container_port + "/") | @sh) + " >/dev/null 2>&1 && exit 0; sleep 2; done; echo Application health check failed; exit 1"),
    
              ("docker rm -f " + ($app_name | @sh) + " 2>/dev/null || true"),
    
              ("docker ps --filter " + ("publish=" + $host_port | @sh) + " -q | xargs -r docker rm -f"),
    
              ("docker rm -f " + ($app_name | @sh) + "-new 2>/dev/null || true"),
    
              "sleep 2",
    
              ("if command -v ss >/dev/null 2>&1; then ss -ltnp " + ("sport = :" + $host_port | @sh) + "; fi"),
    
              ("docker run -d --name " + ($app_name | @sh) + " --restart unless-stopped -p " + ($host_port | @sh) + ":" + ($container_port | @sh) + " " + ($img | @sh)),
    
              "docker image prune -f || true"
            ]
          }')
        aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Deploy app container" \
          --parameters "$COMMANDS_JSON" \
          --output json > ssm-output.json
        COMMAND_ID=$(jq -r '.Command.CommandId' ssm-output.json)
        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" \
            --query 'Status' --output text 2>/dev/null || echo "Pending")
          if [ "$STATUS" = "Success" ]; then
            echo "Deployment succeeded"
            exit 0
          fi
          if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
            echo "Deployment failed with status $STATUS"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --region "${{ env.AWS_REGION }}" \
              --query 'StandardErrorContent' --output text || true
            exit 1
          fi
          sleep 10
        done
        echo "Timed out waiting for SSM command"
        exit 1
    - name: Production health check
      shell: bash
      run: |
        set -euo pipefail
        PUBLIC_DNS=$(aws ec2 describe-instances \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --query "Reservations[0].Instances[0].PublicDnsName" \
          --output text)
        curl -f --retry 10 --retry-delay 5 --retry-connrefused "http://${PUBLIC_DNS}/"
    - name: Production smoke test
      shell: bash
      run: |
        set -euo pipefail
        PUBLIC_DNS=$(aws ec2 describe-instances \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --query "Reservations[0].Instances[0].PublicDnsName" \
          --output text)
        curl -f "http://${PUBLIC_DNS}/"
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.job }}-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  rollback:
    name: Rollback
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - deploy-production
    if: failure()
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Rollback container via SSM
      shell: bash
      run: |
        set -euo pipefail
        COMMANDS_JSON=$(jq -n \
          --arg app_name "${{ secrets.DEPLOYMENT_NAME }}" \
          '{
            commands: [
              "if ! command -v docker >/dev/null 2>&1; then if command -v dnf >/dev/null 2>&1; then dnf install -y docker; elif command -v yum >/dev/null 2>&1; then yum install -y docker; elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y docker.io; fi; systemctl enable --now docker; fi",
              "set -e",
              ("docker start " + ($app_name | @sh) + " 2>/dev/null || true"),
              ("docker ps -a --filter name=" + ($app_name | @sh) + " || true")
            ]
          }')
        aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Rollback app container" \
          --parameters "$COMMANDS_JSON" \
          --output json > ssm-rollback.json
        COMMAND_ID=$(jq -r '.Command.CommandId' ssm-rollback.json)
        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" \
            --query 'Status' --output text 2>/dev/null || echo "Pending")
          if [ "$STATUS" = "Success" ]; then
            echo "Rollback succeeded"
            exit 0
          fi
          if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
            echo "Rollback failed with status $STATUS"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --region "${{ env.AWS_REGION }}" \
              --query 'StandardErrorContent' --output text || true
            exit 1
          fi
          sleep 10
        done
        echo "Timed out waiting for rollback SSM command"
        exit 1
  post-deploy:
    name: Post Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - deploy-production
    if: success()
    steps:
    - name: Summarize deployment
      shell: bash
      run: |-
        set -euo pipefail
        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        echo "Deployment complete"
        echo "Image: ${{ env.REGISTRY }}/${IMAGE_REPO}:${{ env.IMAGE_TAG }}"
        echo "Host port: ${{ env.HOST_PORT }} -> Container port: ${{ env.CONTAINER_PORT }}"
        echo "Health endpoint: /"