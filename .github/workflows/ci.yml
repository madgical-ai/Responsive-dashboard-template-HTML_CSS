name: CI/CD Pipeline
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch: null
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}
  AWS_REGION: us-east-1
  HOST_PORT: '80'
  CONTAINER_PORT: '80'
  HEALTHCHECK_PATH: /
jobs:
  validate:
    name: Validate (lint & type-check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Execute lint
      run: docker run --rm -i hadolint/hadolint < Dockerfile
      if: ${{ env.ACT != 'true' }}
    - name: Execute type_check
      run: echo 'Executing type_check'
  test:
    name: Test (unit, integration, coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - validate
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Build test image
      run: docker build -t test-app-image .
    - name: Execute unit_test
      run: |
        IMAGE_NAME=test-app-image
        docker run --rm -d -p 80:80 --name test-app $IMAGE_NAME && sleep 2 && (curl -f http://localhost:80 || exit 1)
    - name: Execute integration_test
      run: echo 'Executing integration_test'
    - name: Execute coverage
      run: echo 'Executing coverage'
      if: ${{ env.ACT != 'true' }}
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.job }}-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  security:
    name: Security scan (SAST, deps, secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Execute dependency_scan
      run: |
        docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace aquasec/trivy:latest fs --severity HIGH,CRITICAL .
    - name: Execute secret_scan
      run: |
        docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace trufflesecurity/trufflehog:latest git file:///workspace --since-commit HEAD --only-verified --fail
      if: ${{ env.ACT != 'true' }}
    - name: Execute code_scan
      run: |
        docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace returntocorp/semgrep:latest semgrep --config=auto .
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.job }}-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  build:
    name: Build, push & scan image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - validate
    - test
    - security
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Compute lowercase image repo
      run: |
        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        echo "IMAGE_REPO=$IMAGE_REPO" >> "$GITHUB_ENV"
    - name: Build image
      run: |
        docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }} .
        docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }} ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:latest
    - name: Scan image
      run: |
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --severity HIGH,CRITICAL --exit-code 1 ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Push image
      run: |
        docker push ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
        docker push ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:latest
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.job }}-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Deploy to staging via SSM
      shell: bash
      run: |
        set -euo pipefail

        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        IMAGE="${{ env.REGISTRY }}/${IMAGE_REPO}:${{ env.IMAGE_TAG }}"

        HOST_PORT="${{ env.HOST_PORT || '80' }}"
        CONTAINER_PORT="${{ env.CONTAINER_PORT || '80' }}"
        host_port="$HOST_PORT"
        container_port="$CONTAINER_PORT"
        app_name="${{ secrets.DEPLOYMENT_NAME }}"

        COMMANDS_JSON=$(jq -n \
          --arg img "$IMAGE" \
          --arg user "${{ secrets.GHCR_USER || github.actor }}" \
          --arg token "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" \
          --arg host_port "$HOST_PORT" \
          --arg container_port "$CONTAINER_PORT" \
          --arg app_name "$app_name" \
          '{commands: [
            "set -e",
            "if ! command -v docker >/dev/null 2>&1; then if command -v dnf >/dev/null 2>&1; then dnf install -y docker; elif command -v yum >/dev/null 2>&1; then yum install -y docker; else apt-get update && apt-get install -y docker.io; fi; fi",
            "systemctl enable --now docker || service docker start || true",
            "for i in $(seq 1 15); do docker info >/dev/null 2>&1 && break || sleep 1; done",
            "echo " + ($token | @sh) + " | docker login " + ($env.REGISTRY | @sh) + " -u " + ($user | @sh) + " --password-stdin",
            "for i in $(seq 1 5); do docker pull " + ($img | @sh) + " && break || sleep 5; done",
            "docker rm -f " + ($app_name | @sh) + "-new 2>/dev/null || true",
            "docker run -d --name " + ($app_name | @sh) + "-new " + ($img | @sh),
            "for i in $(seq 1 15); do docker exec " + ($app_name | @sh) + "-new sh -c \"curl -sf http://localhost:" + ($container_port | @sh) + "/ || wget -q -O- http://localhost:" + ($container_port | @sh) + "/\" >/dev/null 2>&1 && break || sleep 1; done",
            "docker stop " + ($app_name | @sh) + " 2>/dev/null || true && docker rm " + ($app_name | @sh) + " 2>/dev/null || true",
            "docker rm -f " + ($app_name | @sh) + "-new 2>/dev/null || true",
            "docker run -d --name " + ($app_name | @sh) + " --restart unless-stopped -p " + ($host_port | @sh) + ":" + ($container_port | @sh) + " " + ($img | @sh),
            "docker image prune -f || true"
          ]}')

        aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Deploy app container to staging" \
          --parameters "$COMMANDS_JSON" \
          --output json > ssm-output.json

        COMMAND_ID=$(jq -r '.Command.CommandId' ssm-output.json)
        echo "SSM Command ID: $COMMAND_ID"

        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" \
            --query 'Status' --output text 2>/dev/null || echo "Pending")
          echo "Deployment status: $STATUS"
          if [ "$STATUS" = "Success" ]; then
            echo "Deployment succeeded"
            exit 0
          elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
            echo "Deployment failed with status: $STATUS"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --region "${{ env.AWS_REGION }}" \
              --query 'StandardErrorContent' --output text || true
            exit 1
          fi
          sleep 10
        done

        echo "Deployment timed out waiting for completion"
        exit 1
    - name: Staging health check & smoke test
      shell: bash
      run: |
        set -euo pipefail

        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        IMAGE="${{ env.REGISTRY }}/${IMAGE_REPO}:${{ env.IMAGE_TAG }}"

        HOST_PORT="${{ env.HOST_PORT || '80' }}"
        CONTAINER_PORT="${{ env.CONTAINER_PORT || '80' }}"
        host_port="$HOST_PORT"
        container_port="$CONTAINER_PORT"
        app_name="${{ secrets.DEPLOYMENT_NAME }}"

        COMMANDS_JSON=$(jq -n \
          --arg host_port "$HOST_PORT" \
          --arg app_name "$app_name" \
          '{commands: [
            "set -e",
            "for i in $(seq 1 15); do curl -sf http://localhost:" + ($host_port | @sh) + "/ >/dev/null 2>&1 && break || sleep 1; done",
            "curl -sf http://localhost:" + ($host_port | @sh) + "/ || exit 1",
            "docker ps --filter name=" + ($app_name | @sh) + " --format \"{{.Status}}\""
          ]}')

        aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Staging health check" \
          --parameters "$COMMANDS_JSON" \
          --output json > ssm-health-output.json

        COMMAND_ID=$(jq -r '.Command.CommandId' ssm-health-output.json)

        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" \
            --query 'Status' --output text 2>/dev/null || echo "Pending")
          if [ "$STATUS" = "Success" ]; then
            echo "Staging health check passed"
            exit 0
          elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
            echo "Staging health check failed"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --region "${{ env.AWS_REGION }}" \
              --query 'StandardErrorContent' --output text || true
            exit 1
          fi
          sleep 10
        done

        echo "Staging health check timed out"
        exit 1
      if: ${{ env.ACT != 'true' }}
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.job }}-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  deploy-production:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - deploy-staging
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Deploy to production via SSM
      shell: bash
      run: |
        set -euo pipefail

        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        IMAGE="${{ env.REGISTRY }}/${IMAGE_REPO}:${{ env.IMAGE_TAG }}"

        HOST_PORT="${{ env.HOST_PORT || '80' }}"
        CONTAINER_PORT="${{ env.CONTAINER_PORT || '80' }}"
        host_port="$HOST_PORT"
        container_port="$CONTAINER_PORT"
        app_name="${{ secrets.DEPLOYMENT_NAME }}"

        COMMANDS_JSON=$(jq -n \
          --arg img "$IMAGE" \
          --arg user "${{ secrets.GHCR_USER || github.actor }}" \
          --arg token "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" \
          --arg host_port "$HOST_PORT" \
          --arg container_port "$CONTAINER_PORT" \
          --arg app_name "$app_name" \
          '{commands: [
            "set -e",
            "if ! command -v docker >/dev/null 2>&1; then if command -v dnf >/dev/null 2>&1; then dnf install -y docker; elif command -v yum >/dev/null 2>&1; then yum install -y docker; else apt-get update && apt-get install -y docker.io; fi; fi",
            "systemctl enable --now docker || service docker start || true",
            "for i in $(seq 1 15); do docker info >/dev/null 2>&1 && break || sleep 1; done",
            "echo " + ($token | @sh) + " | docker login " + ($env.REGISTRY | @sh) + " -u " + ($user | @sh) + " --password-stdin",
            "for i in $(seq 1 5); do docker pull " + ($img | @sh) + " && break || sleep 5; done",
            "docker rm -f " + ($app_name | @sh) + "-new 2>/dev/null || true",
            "docker run -d --name " + ($app_name | @sh) + "-new " + ($img | @sh),
            "for i in $(seq 1 15); do docker exec " + ($app_name | @sh) + "-new sh -c \"curl -sf http://localhost:" + ($container_port | @sh) + "/ || wget -q -O- http://localhost:" + ($container_port | @sh) + "/\" >/dev/null 2>&1 && break || sleep 1; done",
            "docker stop " + ($app_name | @sh) + " 2>/dev/null || true && docker rm " + ($app_name | @sh) + " 2>/dev/null || true",
            "docker rm -f " + ($app_name | @sh) + "-new 2>/dev/null || true",
            "docker run -d --name " + ($app_name | @sh) + " --restart unless-stopped -p " + ($host_port | @sh) + ":" + ($container_port | @sh) + " " + ($img | @sh),
            "docker image prune -f || true"
          ]}')

        aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Deploy app container to production" \
          --parameters "$COMMANDS_JSON" \
          --output json > ssm-output.json

        COMMAND_ID=$(jq -r '.Command.CommandId' ssm-output.json)
        echo "SSM Command ID: $COMMAND_ID"

        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" \
            --query 'Status' --output text 2>/dev/null || echo "Pending")
          echo "Deployment status: $STATUS"
          if [ "$STATUS" = "Success" ]; then
            echo "Deployment succeeded"
            exit 0
          elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
            echo "Deployment failed with status: $STATUS"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --region "${{ env.AWS_REGION }}" \
              --query 'StandardErrorContent' --output text || true
            exit 1
          fi
          sleep 10
        done

        echo "Deployment timed out waiting for completion"
        exit 1
    - name: Production health check & smoke test
      shell: bash
      run: |
        set -euo pipefail

        HOST_PORT="${{ env.HOST_PORT || '80' }}"
        app_name="${{ secrets.DEPLOYMENT_NAME }}"

        COMMANDS_JSON=$(jq -n \
          --arg host_port "$HOST_PORT" \
          --arg app_name "$app_name" \
          '{commands: [
            "set -e",
            "for i in $(seq 1 15); do curl -sf http://localhost:" + ($host_port | @sh) + "/ >/dev/null 2>&1 && break || sleep 1; done",
            "curl -sf http://localhost:" + ($host_port | @sh) + "/ || exit 1",
            "docker ps --filter name=" + ($app_name | @sh) + " --format \"{{.Status}}\""
          ]}')

        aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Production health check" \
          --parameters "$COMMANDS_JSON" \
          --output json > ssm-health-output.json

        COMMAND_ID=$(jq -r '.Command.CommandId' ssm-health-output.json)

        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" \
            --query 'Status' --output text 2>/dev/null || echo "Pending")
          if [ "$STATUS" = "Success" ]; then
            echo "Production health check passed"
            exit 0
          elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
            echo "Production health check failed"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --region "${{ env.AWS_REGION }}" \
              --query 'StandardErrorContent' --output text || true
            exit 1
          fi
          sleep 10
        done

        echo "Production health check timed out"
        exit 1
      if: ${{ env.ACT != 'true' }}
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.job }}-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  rollback:
    name: Rollback on production deploy failure
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - deploy-production
    if: failure()
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Rollback to previous image
      shell: bash
      run: |
        set -euo pipefail

        PREV_SHA=$(git rev-parse HEAD~1)
        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        PREV_IMAGE="${{ env.REGISTRY }}/${IMAGE_REPO}:${PREV_SHA}"

        HOST_PORT="${{ env.HOST_PORT || '80' }}"
        CONTAINER_PORT="${{ env.CONTAINER_PORT || '80' }}"
        host_port="$HOST_PORT"
        container_port="$CONTAINER_PORT"
        app_name="${{ secrets.DEPLOYMENT_NAME }}"

        COMMANDS_JSON=$(jq -n \
          --arg img "$PREV_IMAGE" \
          --arg user "${{ secrets.GHCR_USER || github.actor }}" \
          --arg token "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" \
          --arg host_port "$HOST_PORT" \
          --arg container_port "$CONTAINER_PORT" \
          --arg app_name "$app_name" \
          '{commands: [
            "set -e",
            "echo " + ($token | @sh) + " | docker login " + ($env.REGISTRY | @sh) + " -u " + ($user | @sh) + " --password-stdin",
            "for i in $(seq 1 5); do docker pull " + ($img | @sh) + " && break || sleep 5; done",
            "docker stop " + ($app_name | @sh) + " 2>/dev/null || true && docker rm " + ($app_name | @sh) + " 2>/dev/null || true",
            "docker run -d --name " + ($app_name | @sh) + " --restart unless-stopped -p " + ($host_port | @sh) + ":" + ($container_port | @sh) + " " + ($img | @sh),
            "for i in $(seq 1 15); do curl -sf http://localhost:" + ($host_port | @sh) + "/ >/dev/null 2>&1 && break || sleep 1; done",
            "curl -sf http://localhost:" + ($host_port | @sh) + "/ || exit 1",
            "docker image prune -f || true"
          ]}')

        aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Rollback to previous image" \
          --parameters "$COMMANDS_JSON" \
          --output json > ssm-rollback-output.json

        COMMAND_ID=$(jq -r '.Command.CommandId' ssm-rollback-output.json)

        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" \
            --query 'Status' --output text 2>/dev/null || echo "Pending")
          if [ "$STATUS" = "Success" ]; then
            echo "Rollback succeeded"
            exit 0
          elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
            echo "Rollback failed"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --region "${{ env.AWS_REGION }}" \
              --query 'StandardErrorContent' --output text || true
            exit 1
          fi
          sleep 10
        done

        echo "Rollback timed out"
        exit 1
  post-deploy:
    name: Post-deploy notification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - deploy-production
    if: always()
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Post-deploy container status check
      shell: bash
      run: |-
        set -euo pipefail

        app_name="${{ secrets.DEPLOYMENT_NAME }}"

        COMMANDS_JSON=$(jq -n \
          --arg app_name "$app_name" \
          '{commands: [
            "set -e",
            "docker ps --filter name=" + ($app_name | @sh) + " --format \"table {{.Names}}\\t{{.Status}}\\t{{.Ports}}\""
          ]}')

        aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Post-deploy container status check" \
          --parameters "$COMMANDS_JSON" \
          --output json > ssm-postdeploy-output.json

        COMMAND_ID=$(jq -r '.Command.CommandId' ssm-postdeploy-output.json)

        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" \
            --query 'Status' --output text 2>/dev/null || echo "Pending")
          if [ "$STATUS" = "Success" ]; then
            echo "Post-deploy status check completed"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --region "${{ env.AWS_REGION }}" \
              --query 'StandardOutputContent' --output text || true
            exit 0
          elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
            echo "Post-deploy status check failed"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --region "${{ env.AWS_REGION }}" \
              --query 'StandardErrorContent' --output text || true
            exit 1
          fi
          sleep 10
        done

        echo "Post-deploy status check timed out"
        exit 1
      if: ${{ env.ACT != 'true' }}