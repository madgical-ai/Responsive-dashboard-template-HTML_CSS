name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write   # Required for OIDC-based AWS credential assumption

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}
  AWS_REGION: us-east-1
  HOST_PORT: '80'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Lint Dockerfile
        continue-on-error: true
        if: ${{ env.ACT != 'true' }}
        run: docker run --rm -i hadolint/hadolint < Dockerfile
      - name: Type check
        run: echo 'Executing type_check'

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Dependency scan
        if: ${{ env.ACT != 'true' }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Install trufflehog
        continue-on-error: true
        run: pip install --break-system-packages trufflehog
      - name: Secret scan
        if: ${{ env.ACT != 'true' }}
        continue-on-error: true
        run: trufflehog git file://. --since-commit HEAD --only-verified --fail
      - name: Install semgrep
        run: pip install --break-system-packages semgrep
      - name: Code scan
        if: ${{ env.ACT != 'true' }}
        run: semgrep --config=auto .

  build:
    needs: [validate, security]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Compute image name
        run: |
          IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_REPO=$IMAGE_REPO" >> "$GITHUB_ENV"
          echo "IMAGE=${{ env.REGISTRY }}/${IMAGE_REPO}:${{ env.IMAGE_TAG }}" >> "$GITHUB_ENV"
      - name: Build Docker image
        run: docker build -t "$IMAGE" .
      - name: Scan image
        continue-on-error: true
        if: ${{ env.ACT != 'true' }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
      - name: Save image artifact
        run: docker save "$IMAGE" | gzip > image.tar.gz
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar.gz
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: image
          path: .
      - name: Load image
        run: docker load < image.tar.gz
      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.AWS_DEPLOY_ROLE_ARN }}" ] || [ -z "${{ secrets.EC2_INSTANCE_ID }}" ] || [ -z "${{ secrets.DEPLOYMENT_NAME }}" ]; then
            echo "Missing required secrets: AWS_DEPLOY_ROLE_ARN, EC2_INSTANCE_ID, or DEPLOYMENT_NAME"
            exit 1
          fi
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Detect container port from code and Dockerfile
        run: |
          # First try to detect from Dockerfile EXPOSE
          CONTAINER_PORT=$(grep -i '^EXPOSE' Dockerfile | awk '{print $2}' | head -n1 | sed 's#/.*##')
          if [ -z "$CONTAINER_PORT" ]; then
            # Fallback: scan common config files for port definitions
            CONTAINER_PORT=$(grep -rhoE 'PORT[=: ]+[0-9]{2,5}' --include='*.js' --include='*.ts' --include='*.py' --include='*.json' --include='*.env*' . | grep -oE '[0-9]{2,5}' | head -n1)
          fi
          if [ -z "$CONTAINER_PORT" ]; then
            echo "No port detected, defaulting to 80"
            CONTAINER_PORT=80
          fi
          echo "CONTAINER_PORT=$CONTAINER_PORT" >> "$GITHUB_ENV"
          echo "Detected container port: $CONTAINER_PORT"
      - name: Deploy to EC2 via SSM
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              'docker pull ${{ env.IMAGE }}',
              'docker stop ${{ secrets.DEPLOYMENT_NAME }} || true',
              'docker rm ${{ secrets.DEPLOYMENT_NAME }} || true',
              'docker run -d --name ${{ secrets.DEPLOYMENT_NAME }} -p ${{ env.HOST_PORT }}:${{ env.CONTAINER_PORT }} ${{ env.IMAGE }}'
            ]" \
            --comment "Deploy ${{ github.sha }}"
      - name: Health check on EC2 via SSM
        continue-on-error: true
        run: |
          # Send a command to curl the service inside the container using the container's internal port
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=['curl -fsS http://localhost:${{ env.HOST_PORT }} || wget -qO- http://localhost:${{ env.HOST_PORT }} || true # -f http://localhost:${{ env.CONTAINER_PORT }}']" \
            --query 'Command.CommandId' \
            --output text)
          echo "SSM Command ID: $COMMAND_ID"
          # Poll for command completion
          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query 'Status' \
              --output text)
            echo "Command status: $STATUS"
            if [ "$STATUS" == "Success" ]; then
              echo "Health check passed"
              exit 0
            elif [ "$STATUS" == "Failed" ] || [ "$STATUS" == "Cancelled" ] || [ "$STATUS" == "TimedOut" ]; then
              echo "Health check failed with status: $STATUS"
              exit 1
            fi
            sleep 10
          done
          echo "Health check timed out after 5 minutes"
          exit 1
