name: CI/CD
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch:
    inputs:
      rollback:
        description: Trigger rollback
        required: false
        default: 'false'
        type: boolean
      rollback_to:
        description: Image tag or commit SHA to rollback to
        required: true
        type: string
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}
  AWS_REGION: ${{ secrets.AWS_REGION }}
  HOST_PORT: '80'
  CONTAINER_PORT: '8080'
permissions:
  contents: read
jobs:
  security:
    name: Security Scans
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
    - uses: actions/checkout@v4
    - name: Run Trivy filesystem scan
      uses: aquasecurity/trivy-action@v0.28.0
      with:
        scan-type: fs
        scan-ref: .
        severity: CRITICAL,HIGH
        exit-code: '1'
        ignore-unfixed: true
    - name: Run Gitleaks secret scan
      uses: gitleaks/gitleaks-action@v2
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: javascript
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
  build-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: security
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build Docker image
      shell: bash
      run: |
        set -euo pipefail
        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        IMAGE="${{ env.REGISTRY }}/${IMAGE_REPO}:${{ env.IMAGE_TAG }}"
        docker build --cache-from type=gha --cache-to type=gha,mode=max -t "$IMAGE" -t "${{ env.REGISTRY }}/${IMAGE_REPO}:latest" .
        echo "image=$IMAGE" >> $GITHUB_ENV
        echo "image_repo=$IMAGE_REPO" >> $GITHUB_ENV
    - name: Run Trivy image scan
      uses: aquasecurity/trivy-action@v0.28.0
      with:
        scan-type: image
        image-ref: ${{ env.REGISTRY }}/${{ env.image_repo }}:${{ env.IMAGE_TAG }}
        severity: CRITICAL,HIGH
        exit-code: '1'
        ignore-unfixed: true
    - name: Log in to GHCR
      shell: bash
      run: |
        set -euo pipefail
        echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      if: ${{ env.ACT != 'true' }}
    - name: Push Docker image
      shell: bash
      run: |
        set -euo pipefail
        docker push "${{ env.REGISTRY }}/${{ env.image_repo }}:${{ env.IMAGE_TAG }}"
        docker push "${{ env.REGISTRY }}/${{ env.image_repo }}:latest"
      if: ${{ env.ACT != 'true' }}
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ci-artifacts
        path: |
          reports/**
          dist/**
        if-no-files-found: warn
  deploy-staging:
    name: Deploy to Staging (EC2 via SSM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-push
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' &&
      github.event.inputs.rollback != 'true')
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
      if: ${{ env.ACT != 'true' }}
    - name: Deploy to EC2 via SSM
      shell: bash
      if: ${{ env.ACT != 'true' }}
      run: |
        set -euo pipefail
        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        IMAGE="${{ env.REGISTRY }}/${IMAGE_REPO}:${{ env.IMAGE_TAG }}"
        LOGIN_USER="${{ secrets.GHCR_USER }}"
        LOGIN_TOKEN="${{ secrets.GHCR_TOKEN }}"
        HOST_PORT="${{ env.HOST_PORT }}"
        CONTAINER_PORT="${{ env.CONTAINER_PORT }}"
        APP_NAME="${{ secrets.DEPLOYMENT_NAME }}"

        COMMANDS_JSON=$(jq -n \
          --arg img "$IMAGE" \
          --arg user "$LOGIN_USER" \
          --arg token "$LOGIN_TOKEN" \
          --arg host_port "$HOST_PORT" \
          --arg container_port "$CONTAINER_PORT" \
          --arg app_name "$APP_NAME" \
          '{commands: [
            "if ! command -v docker >/dev/null 2>&1; then if command -v dnf >/dev/null 2>&1; then dnf install -y docker; elif command -v yum >/dev/null 2>&1; then yum install -y docker; elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y docker.io; else echo \"No supported package manager found\"; exit 1; fi; fi; systemctl enable --now docker || service docker start",
            "set -e",
            "for i in $(seq 1 15); do docker info >/dev/null 2>&1 && break || sleep 2; done",
            "echo " + ($token | @sh) + " | docker login ghcr.io -u " + ($user | @sh) + " --password-stdin",
            "docker pull " + ($img | @sh),
            "docker rm -f " + ($app_name | @sh) + "-new 2>/dev/null || true",
            "docker run -d --name " + ($app_name | @sh) + "-new " + ($img | @sh),
            "for i in $(seq 1 30); do if docker exec " + ($app_name | @sh) + "-new curl -f http://localhost:" + ($container_port | @sh) + "/ >/dev/null 2>&1; then break; elif docker exec " + ($app_name | @sh) + "-new wget -q -O- http://localhost:" + ($container_port | @sh) + "/ >/dev/null 2>&1; then break; else sleep 2; fi; done",
            "docker exec " + ($app_name | @sh) + "-new curl -f http://localhost:" + ($container_port | @sh) + "/ >/dev/null 2>&1 || docker exec " + ($app_name | @sh) + "-new wget -q -O- http://localhost:" + ($container_port | @sh) + "/ >/dev/null 2>&1 || exit 1",
            "docker stop " + ($app_name | @sh) + " 2>/dev/null || true",
            "docker rm " + ($app_name | @sh) + " 2>/dev/null || true",
            "docker stop " + ($app_name | @sh) + "-new 2>/dev/null || true",
            "docker rm " + ($app_name | @sh) + "-new 2>/dev/null || true",
            "docker run -d --name " + ($app_name | @sh) + " --restart unless-stopped -p " + ($host_port | @sh) + ":" + ($container_port | @sh) + " " + ($img | @sh),
            "for i in $(seq 1 30); do if curl -f http://localhost:" + ($host_port | @sh) + "/ >/dev/null 2>&1; then break; else sleep 2; fi; done",
            "curl -f http://localhost:" + ($host_port | @sh) + "/ || exit 1",
            "docker image prune -f || true"
          ]}')

        COMMAND_ID=$(aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Deploy to staging" \
          --parameters "$COMMANDS_JSON" \
          --output json | jq -r '.Command.CommandId')

        STATUS=""
        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'Status' --output text)
          if [ "$STATUS" = "Success" ]; then
            echo "Deployment succeeded"
            break
          elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
            echo "Deployment failed with status $STATUS"
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'StandardErrorContent' --output text
            exit 1
          fi
          sleep 10
        done
        [ "$STATUS" = "Success" ] || { echo "Timed out waiting for deployment"; exit 1; }
    - name: Health check via SSM
      shell: bash
      if: ${{ env.ACT != 'true' }}
      run: |
        set -euo pipefail
        URL="http://localhost:${{ env.HOST_PORT }}/"
        COMMANDS_JSON=$(jq -n --arg url "$URL" '{commands: ["set -e", "curl -f -s " + ($url | @sh)]}')
        COMMAND_ID=$(aws ssm send-command --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --document-name "AWS-RunShellScript" --parameters "$COMMANDS_JSON" --output json | jq -r '.Command.CommandId')
        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'Status' --output text)
          if [ "$STATUS" = "Success" ]; then
            echo "Health check passed"
            break
          elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'StandardErrorContent' --output text
            exit 1
          fi
          sleep 10
        done
        [ "$STATUS" = "Success" ] || { echo "Health check timed out"; exit 1; }
    - name: Smoke test via SSM
      shell: bash
      if: ${{ env.ACT != 'true' }}
      run: |
        set -euo pipefail
        URL="http://localhost:${{ env.HOST_PORT }}/"
        COMMANDS_JSON=$(jq -n --arg url "$URL" '{commands: ["set -e", "curl -f -s " + ($url | @sh)]}')
        COMMAND_ID=$(aws ssm send-command --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --document-name "AWS-RunShellScript" --parameters "$COMMANDS_JSON" --output json | jq -r '.Command.CommandId')
        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'Status' --output text)
          if [ "$STATUS" = "Success" ]; then
            echo "Smoke test passed"
            break
          elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'StandardErrorContent' --output text
            exit 1
          fi
          sleep 10
        done
        [ "$STATUS" = "Success" ] || { echo "Smoke test timed out"; exit 1; }
  deploy-production:
    name: Deploy to Production (EC2 via SSM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: deploy-staging
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' &&
      github.event.inputs.rollback != 'true')
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
    - name: Request manual approval
      uses: trstringer/manual-approval@v1
      with:
        timeout: 86400
      if: ${{ env.ACT != 'true' }}
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
      if: ${{ env.ACT != 'true' }}
    - name: Deploy to EC2 via SSM
      shell: bash
      if: ${{ env.ACT != 'true' }}
      run: |
        set -euo pipefail
        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        IMAGE="${{ env.REGISTRY }}/${IMAGE_REPO}:${{ env.IMAGE_TAG }}"
        LOGIN_USER="${{ secrets.GHCR_USER }}"
        LOGIN_TOKEN="${{ secrets.GHCR_TOKEN }}"
        HOST_PORT="${{ env.HOST_PORT }}"
        CONTAINER_PORT="${{ env.CONTAINER_PORT }}"
        APP_NAME="${{ secrets.DEPLOYMENT_NAME }}"

        COMMANDS_JSON=$(jq -n \
          --arg img "$IMAGE" \
          --arg user "$LOGIN_USER" \
          --arg token "$LOGIN_TOKEN" \
          --arg host_port "$HOST_PORT" \
          --arg container_port "$CONTAINER_PORT" \
          --arg app_name "$APP_NAME" \
          '{commands: [
            "if ! command -v docker >/dev/null 2>&1; then if command -v dnf >/dev/null 2>&1; then dnf install -y docker; elif command -v yum >/dev/null 2>&1; then yum install -y docker; elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y docker.io; else echo \"No supported package manager found\"; exit 1; fi; fi; systemctl enable --now docker || service docker start",
            "set -e",
            "for i in $(seq 1 15); do docker info >/dev/null 2>&1 && break || sleep 2; done",
            "echo " + ($token | @sh) + " | docker login ghcr.io -u " + ($user | @sh) + " --password-stdin",
            "docker pull " + ($img | @sh),
            "docker rm -f " + ($app_name | @sh) + "-new 2>/dev/null || true",
            "docker run -d --name " + ($app_name | @sh) + "-new " + ($img | @sh),
            "for i in $(seq 1 30); do if docker exec " + ($app_name | @sh) + "-new curl -f http://localhost:" + ($container_port | @sh) + "/ >/dev/null 2>&1; then break; elif docker exec " + ($app_name | @sh) + "-new wget -q -O- http://localhost:" + ($container_port | @sh) + "/ >/dev/null 2>&1; then break; else sleep 2; fi; done",
            "docker exec " + ($app_name | @sh) + "-new curl -f http://localhost:" + ($container_port | @sh) + "/ >/dev/null 2>&1 || docker exec " + ($app_name | @sh) + "-new wget -q -O- http://localhost:" + ($container_port | @sh) + "/ >/dev/null 2>&1 || exit 1",
            "docker stop " + ($app_name | @sh) + " 2>/dev/null || true",
            "docker rm " + ($app_name | @sh) + " 2>/dev/null || true",
            "docker stop " + ($app_name | @sh) + "-new 2>/dev/null || true",
            "docker rm " + ($app_name | @sh) + "-new 2>/dev/null || true",
            "docker run -d --name " + ($app_name | @sh) + " --restart unless-stopped -p " + ($host_port | @sh) + ":" + ($container_port | @sh) + " " + ($img | @sh),
            "for i in $(seq 1 30); do if curl -f http://localhost:" + ($host_port | @sh) + "/ >/dev/null 2>&1; then break; else sleep 2; fi; done",
            "curl -f http://localhost:" + ($host_port | @sh) + "/ || exit 1",
            "docker image prune -f || true"
          ]}')

        COMMAND_ID=$(aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Deploy to production" \
          --parameters "$COMMANDS_JSON" \
          --output json | jq -r '.Command.CommandId')

        STATUS=""
        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'Status' --output text)
          if [ "$STATUS" = "Success" ]; then
            echo "Deployment succeeded"
            break
          elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
            echo "Deployment failed with status $STATUS"
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'StandardErrorContent' --output text
            exit 1
          fi
          sleep 10
        done
        [ "$STATUS" = "Success" ] || { echo "Timed out waiting for deployment"; exit 1; }
    - name: Health check via SSM
      shell: bash
      if: ${{ env.ACT != 'true' }}
      run: |
        set -euo pipefail
        URL="http://localhost:${{ env.HOST_PORT }}/"
        COMMANDS_JSON=$(jq -n --arg url "$URL" '{commands: ["set -e", "curl -f -s " + ($url | @sh)]}')
        COMMAND_ID=$(aws ssm send-command --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --document-name "AWS-RunShellScript" --parameters "$COMMANDS_JSON" --output json | jq -r '.Command.CommandId')
        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'Status' --output text)
          if [ "$STATUS" = "Success" ]; then
            echo "Health check passed"
            break
          elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'StandardErrorContent' --output text
            exit 1
          fi
          sleep 10
        done
        [ "$STATUS" = "Success" ] || { echo "Health check timed out"; exit 1; }
    - name: Smoke test via SSM
      shell: bash
      if: ${{ env.ACT != 'true' }}
      run: |
        set -euo pipefail
        URL="http://localhost:${{ env.HOST_PORT }}/"
        COMMANDS_JSON=$(jq -n --arg url "$URL" '{commands: ["set -e", "curl -f -s " + ($url | @sh)]}')
        COMMAND_ID=$(aws ssm send-command --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --document-name "AWS-RunShellScript" --parameters "$COMMANDS_JSON" --output json | jq -r '.Command.CommandId')
        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'Status' --output text)
          if [ "$STATUS" = "Success" ]; then
            echo "Smoke test passed"
            break
          elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'StandardErrorContent' --output text
            exit 1
          fi
          sleep 10
        done
        [ "$STATUS" = "Success" ] || { echo "Smoke test timed out"; exit 1; }
  rollback:
    name: Rollback
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.rollback ==
      'true'
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
      if: ${{ env.ACT != 'true' }}
    - name: Rollback to specified image
      shell: bash
      if: ${{ env.ACT != 'true' }}
      run: |
        set -euo pipefail
        IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        IMAGE_TAG="${{ github.event.inputs.rollback_to }}"
        IMAGE="${{ env.REGISTRY }}/${IMAGE_REPO}:${IMAGE_TAG}"
        LOGIN_USER="${{ secrets.GHCR_USER }}"
        LOGIN_TOKEN="${{ secrets.GHCR_TOKEN }}"
        HOST_PORT="${{ env.HOST_PORT }}"
        CONTAINER_PORT="${{ env.CONTAINER_PORT }}"
        APP_NAME="${{ secrets.DEPLOYMENT_NAME }}"

        COMMANDS_JSON=$(jq -n \
          --arg img "$IMAGE" \
          --arg user "$LOGIN_USER" \
          --arg token "$LOGIN_TOKEN" \
          --arg host_port "$HOST_PORT" \
          --arg container_port "$CONTAINER_PORT" \
          --arg app_name "$APP_NAME" \
          '{commands: [
            "if ! command -v docker >/dev/null 2>&1; then if command -v dnf >/dev/null 2>&1; then dnf install -y docker; elif command -v yum >/dev/null 2>&1; then yum install -y docker; elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y docker.io; else echo \"No supported package manager found\"; exit 1; fi; fi; systemctl enable --now docker || service docker start",
            "set -e",
            "for i in $(seq 1 15); do docker info >/dev/null 2>&1 && break || sleep 2; done",
            "echo " + ($token | @sh) + " | docker login ghcr.io -u " + ($user | @sh) + " --password-stdin",
            "docker pull " + ($img | @sh),
            "docker rm -f " + ($app_name | @sh) + "-new 2>/dev/null || true",
            "docker run -d --name " + ($app_name | @sh) + "-new " + ($img | @sh),
            "for i in $(seq 1 30); do if docker exec " + ($app_name | @sh) + "-new curl -f http://localhost:" + ($container_port | @sh) + "/ >/dev/null 2>&1; then break; elif docker exec " + ($app_name | @sh) + "-new wget -q -O- http://localhost:" + ($container_port | @sh) + "/ >/dev/null 2>&1; then break; else sleep 2; fi; done",
            "docker exec " + ($app_name | @sh) + "-new curl -f http://localhost:" + ($container_port | @sh) + "/ >/dev/null 2>&1 || docker exec " + ($app_name | @sh) + "-new wget -q -O- http://localhost:" + ($container_port | @sh) + "/ >/dev/null 2>&1 || exit 1",
            "docker stop " + ($app_name | @sh) + " 2>/dev/null || true",
            "docker rm " + ($app_name | @sh) + " 2>/dev/null || true",
            "docker stop " + ($app_name | @sh) + "-new 2>/dev/null || true",
            "docker rm " + ($app_name | @sh) + "-new 2>/dev/null || true",
            "docker run -d --name " + ($app_name | @sh) + " --restart unless-stopped -p " + ($host_port | @sh) + ":" + ($container_port | @sh) + " " + ($img | @sh),
            "for i in $(seq 1 30); do if curl -f http://localhost:" + ($host_port | @sh) + "/ >/dev/null 2>&1; then break; else sleep 2; fi; done",
            "curl -f http://localhost:" + ($host_port | @sh) + "/ || exit 1",
            "docker image prune -f || true"
          ]}')

        COMMAND_ID=$(aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ env.AWS_REGION }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Rollback" \
          --parameters "$COMMANDS_JSON" \
          --output json | jq -r '.Command.CommandId')

        STATUS=""
        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'Status' --output text)
          if [ "$STATUS" = "Success" ]; then
            echo "Rollback succeeded"
            break
          elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
            echo "Rollback failed with status $STATUS"
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'StandardErrorContent' --output text
            exit 1
          fi
          sleep 10
        done
        [ "$STATUS" = "Success" ] || { echo "Timed out waiting for rollback"; exit 1; }
  post-deploy:
    name: Post-deploy verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: deploy-production
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' &&
      github.event.inputs.rollback != 'true')
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
      if: ${{ env.ACT != 'true' }}
    - name: Verify deployment via SSM
      shell: bash
      if: ${{ env.ACT != 'true' }}
      run: |-
        set -euo pipefail
        APP_NAME="${{ secrets.DEPLOYMENT_NAME }}"
        COMMANDS_JSON=$(jq -n \
          --arg app_name "$APP_NAME" \
          --arg host_port "${{ env.HOST_PORT }}" \
          '{commands: [
                "if ! command -v docker >/dev/null 2>&1; then if command -v dnf >/dev/null 2>&1; then dnf install -y docker; elif command -v yum >/dev/null 2>&1; then yum install -y docker; elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y docker.io; fi; systemctl enable --now docker; fi",
        "set -e",
            "docker ps --filter name=" + ($app_name | @sh),
            "curl -f http://localhost:" + ($host_port | @sh) + "/"
          ]}'
        )
        COMMAND_ID=$(aws ssm send-command --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --document-name "AWS-RunShellScript" --parameters "$COMMANDS_JSON" --output json | jq -r '.Command.CommandId')
        STATUS=""
        for i in $(seq 1 30); do
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'Status' --output text)
          if [ "$STATUS" = "Success" ]; then
            echo "Post-deploy verification passed"
            break
          elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --query 'StandardErrorContent' --output text
            exit 1
          fi
          sleep 10
        done
        [ "$STATUS" = "Success" ] || { echo "Post-deploy verification timed out"; exit 1; }